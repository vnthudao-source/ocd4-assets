<style>#kka{--red:#b8261c;--ink:#2b2520;--muted:#7b6f63;--line:#e7ddcc;--bg:#faf6ee;max-width:860px;margin:0 auto;color:var(--ink);font-size:15px;line-height:1.55}#kka *{box-sizing:border-box}#kka button{font:inherit;cursor:pointer;margin:0}#kka .kka-hide{display:none!important}#kka .kka-head{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:20px 20px 16px;margin-bottom:12px}#kka .kka-kicker{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);font-weight:700}#kka .kka-title{margin:4px 0 8px;font-size:24px;line-height:1.25;color:var(--ink)}#kka .kka-lead{margin:0 0 14px;color:#4d443c}#kka .kka-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#kka .kka-stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;position:relative;overflow:hidden}#kka .kka-stat b{display:block;font-size:19px;color:var(--red);line-height:1.2}#kka .kka-stat span{font-size:12px;color:var(--muted)}#kka .kka-prog i{position:absolute;left:0;bottom:0;height:3px;background:var(--red)}@media (max-width:560px){#kka .kka-stats{grid-template-columns:repeat(2,1fr)}#kka .kka-title{font-size:20px}}#kka .kka-bar{position:sticky;top:0;z-index:5;background:#fff;padding:8px 0;display:flex;flex-direction:column;gap:8px}#kka .kka-tabs{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}#kka .kka-tabs button{flex:1;border:0;background:#fff;padding:11px 8px;font-weight:600;color:var(--ink)}#kka .kka-tabs button+button{border-left:1px solid var(--line)}#kka .kka-tabs button.on{background:var(--red);color:#fff}#kka .kka-search{font:inherit;font-size:15px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}#kka .kka-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}#kka .kka-chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:1 dy li{margin:0 0 6px}#kka .kka-tasks li{background:var(--bg);border-radius:8px;padding:6px 10px;margin-left:-4px}#kka .kka-terms{display:flex;flex-wrap:wrap;gap:6px}#kka .kka-tchip{border:1px solid #e3c9c2;background:#fdf3f1;color:var(--red);border-radius:999px;padding:4px 10px;font-size:13px}#kka .kka-design{margin-top:12px;font-size:13px;color:var(--muted)}#kka .kka-btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px}#kka .kka-alpha{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 12px}#kka .kka-alpha button{min-width:34px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 6px;font-weight:700;color:var(--red)}#kka .kka-letter{margin:14px 0 6px;font-size:18px;color:var(--red);border-bottom:1px solid var(--line);padding-bottom:2px;scroll-margin-top:120px}#kka .kka-term{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:#fff;scroll-margin-top:120px}#kka .kka-term-h{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}#kka .kka-term-h b{font-size:15.5px}#kka .kka-term-h span{font-size:13px;color:var(--muted);font-style:italic}#kka .kka-term p{margin:4px 0 0;font-size:14px}#kka .kka-term-n{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;font-size:12px;color:var(--muted)}#kka .kka-term-n button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--ink)}#kka .kka-lesson,#kka .kka-group{scroll-margin-top:120px}#kka .kka-empty{color:var(--muted);text-align:center;padding:20px 0}#kka .kka-flash{animation:kkaflash 1.6s ease}@keyframes kkaflash{0%,40%{background:#fff3cf;border-color:#e0b64a}100%{background:#fff}}#kka .kka-ver{font-size:11.5px;color:var(--muted);margin:18px 2px 0;line-height:1.5}</style>

<script>(function(){var r=document.getElementById('kka');try{(function(){ 'use strict'; var phases=[ {id:'p1',name:'Nhập môn',from:1,to:4,desc:'Hiểu triện khắc là gì, chuẩn bị dụng cụ, mài đá, đọc được một con ấn.',src:'Sách chương 1 (Dụng cụ và vật liệu), lời nói đầu; kiến thức chung về lịch sử ấn chương.'}, {id:'p2',name:'Chữ triện',from:5,to:10,desc:'Biết nhận và viết chữ triện bằng bút lông trước khi cầm dao: tiểu triện, mâu triện, bộ thủ.',src:'Sách chương 2 (Kỹ pháp chữ triện).'}, {id:'p3',name:'Đao pháp',from:11,to:18,desc:'Làm quen dao và đá qua các bài tập đường nét, nắm hai đao pháp gốc và tự nhận ra nét bệnh.',src:'Sách chương 3 (Kỹ thuật dùng dao).'}, {id:'p4',name:'Khắc trọn một con ấn',from:19,to:24,desc:'Đi hết quy trình: chuyển bản lên đá, khắc âm văn và dương văn, sửa, hoàn thiện, đóng ấn.',src:'Sách chương 4 (Kỹ thuật khắc ấn), chương 11 (Cách đóng ấn).'}, {id:'p5',name:'Lâm mô ấn cổ',from:25,to:31,desc:'Đọc, chọn, chép và khắc theo ấn mẫu đời Hán, từ dễ đến khó.',src:'Sách chương 5 (Lâm mô ấn chương) và phụ lục ấn mẫu.'}, {id:'p6',name:'Chương pháp (bố cục)',from:32,to:38,desc:'Sắp xếp chữ trong mặt ấn: cách xếp 1–9 chữ, chọn âm hay dương văn, xử lý tình huống khó, tám điều cốt yếu.',src:'Sách chương 7 (Chương pháp của ấn).'}, {id:'p7',name:'Biên lan (đường viền)',from:39,to:40,desc:'Hiểu viền là một phần của thiết kế và biết chọn kiểu viền, kiểu chia ô.',src:'Sách chương 8 (Đường viền của ấn).'}, {id:'p8',name:'Sáng tác',from:41,to:45,desc:'Năm bậc sáng tác, độc lập tăng dần: gom chữ, phỏng chữ, phỏng hình, phỏng ý, độc lập.',src:'Sách chương 6 (Sáng tác ấn).'}, {id:'p9',name:'Biên khoản',from:46,to:48,desc:'Khắc chữ ghi ở thân ấn: nội dung, vị trí, đơn đao, song đao và rập khoản.',src:'Sách chương 9 (Khắc biên khoản).'}, {id:'p10',name:'Dùng ấn và tốt nghiệp',from:49,to:52,desc:'Các loại ấn, núm ấn, cách dùng ấn trên thư pháp, làm ấn bình và hoàn thành bộ ấn tốt nghiệp.',src:'Sách chương 10 (Các loại ấn), chương 11 (Dùng ấn).'} ]; var lessons=[ {n:1,t:'Triện khắc là gì',g:'Hiểu triện khắc là nghệ thuật kết hợp chữ, bố cục và dao, và biết vì sao người học lấy ấn Tần Hán làm gốc.', c:['Ấn chương có từ thời Tiên Tần, thịnh ở đời Tần Hán. Trước đời Minh, ấn chủ yếu để dùng; từ đời Minh, Thanh, văn nhân tự khắc ấn bằng đá và ấn trở thành một môn nghệ thuật.', 'Một con ấn hoàn chỉnh đi qua ba khâu theo thứ tự: triện pháp (chọn và viết chữ), chương pháp (xếp bố cục), đao pháp (khắc). Dao là khâu quyết định thành bại và tạo ra vị kim thạch.', 'Nguyên tắc học: chữ triện trước, khắc sau; luyện đường nét trước, lâm ấn sau; lâm ấn trước, sáng tác sau. Người xưa tóm lại là “ấn tông Tần Hán”.', 'Người ta gọi thơ, thư, hoạ, ấn là bốn môn đi cùng nhau: một con ấn nhỏ chứa cả thư pháp, hội hoạ, văn chương và điêu khắc.'], b:['Sưu tầm 10 dấu ấn mình thích (sách, báo, mạng), dán thành “ấn phổ tự làm” đầu tiên.','Viết vài dòng: mình muốn khắc con ấn đầu tiên với nội dung gì.'], k:['trien-khac','trien-phap','chuong-phap','dao-phap','kim-thach-vi','an-tong-tan-han','van-nhan-an','an-pho']}, {n:2,t:'Dụng cụ và vật liệu',g:'Chuẩn bị đủ đồ dùng và biết chọn dao, đá, son phù hợp người mới.', c:['Dao khắc: dùng dao lưỡi bằng, mài hai mặt đối xứng, góc giữa hai mặt vát khoảng 30–40 độ, cán dài 12–15 cm quấn dây cho chắc tay. Nên có một dao nhỏ (lưỡi khoảng 0,6 cm) và một dao lớn (khoảng 0,8–1 cm). Không dùng dao lưỡi xiên hay dao lệch mũi.', 'Độ sắc: không quá sắc, không quá cùn. Dao sắc cho nét cứng cáp, gọn; dao cùn cho nét dày dặn, mộc mạc.', 'Đá: người mới dùng đá Thanh Điền (giòn mà mềm, mịn, không có hạt cứng, giá rẻ). Đá Thọ Sơn, Xương Hoá loại thường cũng được. Học khắc đá trước, chưa vội khắc kim loại, ngọc, tre, ngà.', 'Son (ấn nê): đỏ mà không gắt, dày, bóng, mịn, không loang dầu. Năng đảo son; mùa đông để nơi không quá lạnh.', 'Đồ dùng khác: bút lông nhỏ, giấy mỏng, giá kẹp ấn (không bắt buộc với ấn đá), thước định vị khi đóng ấn, gương nhỏ, bàn chải đánh răng cũ để quét vụn đá, từ điển chữ triện và ấn phổ.'], b:['Chụp ảnh bộ dụng cụ của mình (dao, 3–5 viên đá Thanh Điền, son, bàn chải, gương) gửi lớp.','Tự làm một thước định vị hình chữ L bằng bìa cứng hoặc mica.'], k:['binh-khau-dao','thanh-dien','tho-son','xuong-hoa','an-ne','an-sang','an-quy','an-pho']}, {n:3,t:'Mài đá, mài dao và an toàn',g:'Mài phẳng mặt đá, giữ dao luôn sắc và tập thói quen an toàn khi khắc.', c:['Đá mới mua mặt không phẳng và phủ sáp, phải mài phẳng trước khi khắc.', 'Cách thường: trải giấy nhám mịn trên mặt kính, tay ấn đá đều lực, đưa theo hình số 8 hoặc số 0. Cách nhanh: mài thô trên đĩa đá mài dưới vòi nước, rồi mài tinh trên gạch xanh mài dao vừa xối nước — mặt đá phẳng như gương.', 'An toàn: ngón áp út tay cầm dao luôn tì vào cạnh đá để làm điểm tựa; dao trượt (trượt dao, lệch dao, mất dao) có thể đâm vào tay giữ đá. Không đẩy dao thẳng hướng về phía tay trái.', 'Không thổi vụn đá bằng miệng vì bụi đá có hại; dùng bàn chải quét.'], b:['Mài phẳng ba viên đá, chụp mặt đá dưới ánh đèn để thấy độ phẳng.','Phủ mực đen lên một mặt đá đã mài để chuẩn bị cho các bài đao pháp.'], k:['ma-thach','dao-truot']}, {n:4,t:'Đọc một con ấn',g:'Gọi đúng tên các phần của con ấn và phân biệt âm văn với dương văn, dấu in với mặt khắc.', c:['Các phần của ấn: mặt ấn (chỗ khắc chữ để đóng), thân ấn (bốn mặt bên, nơi khắc biên khoản), đỉnh ấn, núm ấn (phần chạm trên đỉnh, có hoặc không).', 'Âm văn (bạch văn): khắc bỏ nét chữ, khi đóng chữ hiện màu trắng trên nền đỏ. Dương văn (chu văn): khắc bỏ nền, giữ nét, khi đóng chữ hiện màu đỏ.', 'Chữ trên mặt khắc là chữ ngược; dấu in ra mới là chữ thuận. Soi mặt ấn vào gương nhỏ để thấy chữ thuận.', 'Thứ tự đọc thường gặp: cột dọc, từ phải sang trái, từ trên xuống dưới.'], b:['Chọn 6 dấu ấn trong ấn phổ tự làm, ghi rõ ấn nào âm văn, ấn nào dương văn và thứ tự đọc.','Mở trang Thiết kế ấn triện, chuyển qua lại Âm văn / Dương văn và so “Dấu in” với “Mặt khắc (lật ngược)”.'], k:['mat-an','than-an','nui-an','am-van','duong-van','an-thoai'],design:true}, {n:5,t:'Các thể chữ đưa vào ấn',g:'Biết những thể chữ dùng được trong ấn và vì sao mâu triện là chữ cơ bản để nhập ấn.', c:['Gần như mọi thể chữ đều đưa vào ấn được: giáp cốt văn, kim văn, chữ trên gốm, ngói, tiền, đá, tiểu triện, mâu triện, cả chân, thảo về sau.', 'Người mới học hai thể: tiểu triện (chữ thống nhất đời Tần) và mâu triện (chữ trên ấn Hán).', 'Bước đầu tiên là “nhận được chữ triện”: vừa đọc, vừa viết, vừa nhớ.'], b:['Tra một chữ (ví dụ tên mình nếu là chữ Hán, hoặc chữ “Thọ”, “Phúc”) ở cả dạng tiểu triện và mâu triện, chép lại cạnh nhau.'], k:['giap-cot','kim-van','tieu-trien','mau-trien','dai-trien']}, {n:6,t:'Sáu loại tiểu triện',g:'Nhận ra sáu lối tiểu triện và chọn mẫu khởi đầu.', c:['Chiếu bản triện: góc vuông gãy, chữ to nhỏ tự do, gần lệ thư.', 'Ngọc trứ triện: nét đều như chiếc đũa ngọc. Nên bắt đầu học tiểu triện từ bia Dịch Sơn khắc thạch vì vuông tròn hợp độ.', 'Thiết tuyến triện: như ngọc trứ nhưng mảnh và căng hơn, như dây sắt.', 'Trường cước triện: trọng tâm cao, nét đi xuống kéo dài. Huyền châm triện: nét sổ nhọn đuôi như mũi kim.', 'Tiểu triện đời Thanh: lưu loát, dáng thon, trong vuông có tròn; tiêu biểu Đặng Thạch Như, Ngô Nhượng Chi, Triệu Chi Khiêm, Ngô Xương Thạc.'], b:['Lâm viết 20 chữ trong bia Dịch Sơn bằng bút lông nhỏ.'], k:['ngoc-tru','thiet-tuyen','tieu-trien']}, {n:7,t:'Kết cấu tiểu triện',g:'Nắm sáu quy tắc dựng chữ tiểu triện.', c:['Dáng chữ nhật đứng; không có phẩy, mác, móc — chỉ có đường thẳng và đường cong.', 'Chữ lấy thế dọc. Chữ trên–dưới: hai phần nằm cùng một trục dọc.', 'Ngang bằng sổ thẳng, khoảng trắng đều. Luật nhường: bên rộng thì bên kia nhường; bên ngắn tựa vào bên dài; hai bên xấp xỉ thì chia đều.', 'Trên chặt dưới lỏng; đối xứng trái phải; kết cấu bao quanh không được cứng đờ.'], b:['Viết 12 chữ đủ các kiểu kết cấu (đơn, trên–dưới, trái–phải, bao quanh), tự đánh dấu chữ nào phạm quy tắc.'], k:['tren-chat-duoi-long','so-mat']}, {n:8,t:'Vận bút chữ triện',g:'Viết được bốn loại nét triện bằng bút lông.', c:['Bốn loại nét: ngang, sổ, cong, tròn.', 'Ba bước: khởi bút ngược chiều (giấu đầu nét) → giữ ngòi ở giữa mà đi → quay ngòi lại thu nét.', 'Người đời Thanh viết khác: khởi bút hơi dừng, thu bút hơi lộ ngòi, giữa nét có nhấc–ấn.', 'Nét vòng và khung được ghép từ nhiều nét nối khớp nhau.'], b:['Luyện một trang nét ngang, một trang nét sổ, một trang nét cong và vòng tròn; chụp gửi lớp.'], k:['but-y']}, {n:9,t:'Mâu triện — chữ của ấn Hán',g:'Biến tiểu triện thành mâu triện để lấp đầy ô vuông của mặt ấn.', c:['Mâu triện (còn gọi Hán triện, mô ấn triện) đổi chỗ xoay tròn thành gấp vuông, đổi dáng chữ nhật thành vuông, trong vuông có tròn, chữ lấp đầy ô.', 'Một chữ có nhiều cách viết, nên chọn được dạng hợp với bố cục — làm ít được nhiều.', 'Sách tra thực dụng nhất là các bộ tập hợp chữ trên ấn Hán. Nên lâm thêm bia Hán vuông, mộc để có khí kim thạch.'], b:['Lấy 6 chữ đã viết tiểu triện ở buổi 7, viết lại thành mâu triện trong ô vuông 3 cm.'], k:['mau-trien','an-tong-tan-han','kim-thach-vi']}, {n:10,t:'Bộ thủ dạng triện và chữ Việt trong ấn',g:'Nhận bộ thủ ở dạng triện và vận dụng nguyên tắc chữ triện cho chữ Quốc ngữ.', c:['Nhiều bộ thủ dạng triện khác xa dạng chữ chân: bộ thuỷ là ba nét lượn; bộ sước (bộ đi) là bộ xích ghép bộ chỉ; bộ phụ (bên trái) khác hẳn bộ ấp (bên phải); bộ nguyệt khác bộ nhục; bộ võng là hình lưới.', 'Phải nhận được bộ thủ thì mới tra từ điển và tự dựng chữ được.', 'Vận dụng cho chữ Việt (không phải nội dung sách): xếp chữ Quốc ngữ thành khối vuông theo quy tắc Điền thể của lớp, giữ nét đều, đầu tròn, khoảng trắng đều như mâu triện.'], b:['Dựng tên mình bằng chữ Quốc ngữ thành một khối vuông trên trang Thiết kế ấn triện (lưới 12 × 12).'], k:['bo-thu','dien-the'],design:true}, {n:11,t:'Cầm dao và xoay đá',g:'Cầm dao đúng và giữ hướng dao cố định, xoay đá theo nét.', c:['Tay phải cầm dao, tay trái cầm đá. Ba cách cầm: cầm để xung ngang (ba ngón bao cán, áp út tì cạnh đá, đi dao từ phải sang trái — khuyên người mới dùng); cầm để xung dọc (đi dao từ ngoài vào trong); nắm cả bàn tay (cho ấn lớn, cần đục bỏ nhiều đá).', 'Nguyên tắc “dĩ thạch tựu đao”: hướng dao gần như cố định, nét ngang, dọc, cong đều do tay trái xoay đá mà có.', 'Chọn cách cầm nào là do thói quen; then chốt là cổ tay cử động thuận và phát được lực.'], b:['Tập cầm dao cả ba cách trên đá chưa khắc, quay video 30 giây gửi lớp để giáo viên chỉnh tư thế.'], k:['di-thach-tuu-dao','xung-dao']}, {n:12,t:'Đơn đao: đường thẳng âm văn',g:'Khắc được đường thẳng âm văn bằng một dao.', c:['Luyện trên đá Thanh Điền 2,5–3 cm đã phủ mực đen.', 'Đi dao từ phải sang trái, giữ thẳng và song song, không cong, không gãy khúc. Nét dọc thì xoay đá 90 độ rồi khắc như nét ngang.', 'Nét đơn đao có một mép nhẵn, một mép răng cưa. Muốn bớt răng cưa: dựng cán đứng hơn, đi dao lặp, hoặc bổ thêm một dao phía răng cưa.'], b:['Khắc 10 đường thẳng song song, đóng ra giấy, mài phẳng và khắc lại ba lượt.'], k:['don-dao','net-benh']}, {n:13,t:'Song đao: đường thẳng âm văn',g:'Khắc nét âm văn bằng hai dao cho nét rộng và gọn.', c:['Viết nét mực trên đá. Khắc mép dưới trước, xoay ngược đá khắc mép kia.', 'Nét rộng thì hai đầu còn sót đá — bổ thêm hai dao ngắn ở hai đầu để dọn.', 'Góc dao hướng vào phía nét khi khắc âm văn.'], b:['Khắc 6 nét song đao rộng khoảng 1,5 mm, đóng thử và so với nét đơn đao ở buổi trước.'], k:['song-dao','huong-tuyen']}, {n:14,t:'Đường thẳng dương văn',g:'Khắc nét dương văn: giữ nét, khắc bỏ hai bên.', c:['Viết nét mực, khắc bỏ phần phía trên nét, xoay đá khắc phía còn lại, rồi khắc bỏ phần ngoài hai đầu nét.', 'Góc dao quay lưng khỏi nét, áp sát mép ngoài nét mà cắt.', 'Nét dương văn là đá còn lại nên rất dễ gãy nếu khắc quá sâu, quá sát.'], b:['Khắc 6 nét dương văn, đóng thử và tìm nét nào bị mẻ.'], k:['boi-tuyen','duong-van']}, {n:15,t:'Đường song song và chỗ nối',g:'Giữ đều đặn khi khắc nhiều nét và biết hai cách nối nét.', c:['Viết 6–9 nét song song, ban đầu thưa rồi dày dần. Khắc cả dương văn lẫn âm văn.', 'Nối hai đầu các nét thành đường liền: gấp vuông cho cảm giác ngay thẳng, cứng cáp; chuyển tròn cho cảm giác mềm, linh động.', 'Chữ trong ấn suy cho cùng gồm điểm–nét và chỗ chuyển gấp; bài này là nền móng để khắc chữ.'], b:['Khắc một mặt 9 nét song song dương văn và một mặt âm văn có nối gấp vuông.'], k:['phuong-chiet','vien-chuyen']}, {n:16,t:'Mê cung vuông và xoắn tròn',g:'Kiểm soát dao ở chỗ gấp và chỗ cong.', c:['Mê cung vuông: xoay đá linh hoạt, vừa đẩy dao vừa giữ được dao — cảm giác “trầm trước”, vững, chắc. Không khắc nhanh cho sướng tay.', 'Xoắn tròn: không đẩy thẳng như đường thẳng mà theo chỗ cong mà cong; dao đổi hướng nhưng lực không đứt; đi mà có giữ.', 'Khắc xong thì mài phẳng và khắc lại, lặp nhiều lần đến khi thuần thục.'], b:['Khắc một mê cung vuông âm văn và một xoắn tròn dương văn trên hai mặt đá.'], k:['tram-truoc','dao-truot']}, {n:17,t:'Xung đao và thiết đao',g:'Phân biệt và phối hợp hai đao pháp gốc.', c:['Xung đao (đẩy dao): một góc lưỡi vào đá, cán nghiêng khoảng 30 độ, cổ tay và năm ngón cùng lực đẩy liên tục. Nét thẳng mạnh, hùng hậu. Hoàn phái là điển hình.', 'Thiết đao (cắt nhịp): góc phải của dao vào đá trước, cán 45–65 độ rồi dựng lên gần 90 độ cho cả lưỡi ăn vào; nhấc–ấn luân phiên, gom điểm thành đường. Nét gãy cứng, có nhịp. Chiết phái dùng nhiều nhất.', 'Thuyết “mười ba phép dùng dao” thực chất đều là biến thể của hai cách này.', 'Phối hợp: lấy xung làm chính, trong xung có thiết → cương mà hàm súc; lấy thiết làm chính, trong thiết có xung → mộc mà vẫn lưu loát.'], b:['Khắc cùng một chữ hai lần: một lần chỉ xung đao, một lần chỉ thiết đao. Đóng cạnh nhau và nhận xét.'], k:['xung-dao','thiet-dao','hoan-phai','chiet-phai']}, {n:18,t:'Bốn phải, bốn không và mười hai nét bệnh',g:'Có chuẩn mực cho mỗi nhát dao và tự soát nét bệnh.', c:['Bốn phải: vững (kiểm soát tốc độ và độ sâu), chuẩn (nhìn kỹ mép nét rồi mới cắt), mạnh (một hơi, dứt khoát), đều (lực đều từ vào đến thu dao).', 'Bốn không: không phù nề, không mảnh yếu, không dừng dao giữa nét, không sửa lặp tuỳ tiện.', 'Mười hai nét bệnh: cành gãy, béo phì, đốt tre, đầu đinh, răng cưa, to nhỏ không đều, mềm yếu, khối vuông, vỡ vụn, nhọn cạnh, đá ngầm, gai râu.', 'Quy luật sửa: dương văn chỉ bớt được, không thêm được; âm văn chỉ mở rộng được, không lấp lại được.'], b:['Kiểm tra giai đoạn: nộp bản đóng của 4 bài đao pháp (thẳng, song song, mê cung, xoắn), tự đánh dấu nét bệnh trên mỗi bản.'], k:['tu-yeu-tu-bat','net-benh']}, {n:19,t:'Chuyển bản lên đá bằng cách thuỷ ấn',g:'Đưa bản thiết kế lên mặt đá đúng chiều.', c:['Bảy bước: úp đá lên giấy vẽ khung đúng cỡ → viết bản thảo bằng mực đặc trong khung → úp mặt mực xuống mặt đá, dán cố định → bút sạch chấm nước làm bản thảo hơi ẩm → đặt giấy thấm hút bớt nước → miết đi miết lại bằng móng tay hoặc đầu cán bút → lật một góc kiểm tra, gỡ ra, tô bổ nét mờ.', 'Vì úp mặt mực xuống nên chữ trên đá tự thành chữ ngược — đúng chiều để khắc.', 'Soi gương kiểm tra trước khi hạ dao.'], b:['In “bản thuận” từ trang Thiết kế ấn triện và chuyển lên đá bằng cách thuỷ ấn.'], k:['thuy-an-an-cao','an-thoai'],design:true}, {n:20,t:'Viết ngược lên đá',g:'Tự viết chữ ngược lên đá không cần chuyển mực.', c:['Cách 1: viết bản thảo trên giấy mỏng, lật mặt sau soi ánh sáng là thấy chữ ngược, nhìn đó mà viết lên đá.', 'Cách 2: đặt bản thảo hoặc dấu ấn mẫu trên bàn, soi bằng gương nhỏ, chép chữ ngược trong gương lên đá.', 'Trang Thiết kế ấn triện in sẵn “bản lật ngược” và bản lưới phóng to để chép.'], b:['Viết ngược hai chữ lên đá bằng cả hai cách; chụp mặt đá kèm ảnh soi gương.'], k:['phan-thu','an-thoai'],design:true}, {n:21,t:'Con ấn âm văn đầu tiên',g:'Khắc hoàn chỉnh một ấn âm văn 1–2 chữ.', c:['Thứ tự: khắc tất cả nét ngang → tất cả nét dọc → nét xiên, nét cong (nét chủ trước, nét phụ sau).', 'Đơn đao: một dao một nét, gần như không sửa. Song đao: góc dao hướng vào nét, khắc nửa này, xoay đá khắc nửa kia, bổ hai đầu cho tròn có bút ý.', 'Ấn lớn cần nét rộng thì dùng điệp đao: hai nhát đơn đao song song chồng nhau.'], b:['Khắc ấn âm văn tên mình (1–2 chữ) cỡ 2 cm, đóng thử ba bản.'], k:['am-van','huong-tuyen','diep-dao']}, {n:22,t:'Con ấn dương văn đầu tiên',g:'Khắc hoàn chỉnh một ấn dương văn có viền.', c:['Ấn dương văn gần như luôn khắc song đao. Góc dao quay lưng khỏi nét, áp sát mép ngoài nét mà cắt, xoay đá làm bên kia.', 'Nét mảnh dùng cách cầm xung ngang. Đừng khoét nền quá sâu sát nét kẻo nét đá gãy.', 'Viền khắc sau cùng.'], b:['Khắc lại nội dung buổi 21 bằng dương văn, có viền đơn. Đóng cạnh bản âm văn để so.'], k:['duong-van','boi-tuyen']}, {n:23,t:'Sửa và hoàn thiện',g:'Phân biệt sửa cục bộ với hoàn thiện toàn ấn.', c:['Khắc xong: chải sạch → chấm son → đóng thử → đối chiếu mà sửa. Sửa phải nhìn toàn cục, vừa đúng mức; sửa vội càng sửa càng hỏng.', 'Sửa (tu cải) là chỉnh vài nét; hoàn thiện (thu thập) là chỉnh cả mặt ấn, gồm góc, viền, nền.', 'Góc ấn: góc ngoài thiên tròn, góc trong thiên vuông — trong vuông ngoài tròn thì có thần. Viền: lấy bằng thẳng làm chủ nhưng có biến hoá nhỏ. Nền dương văn khắc nông sẽ in ra chấm đỏ — phải xúc phẳng.', 'Sửa quá nhiều sinh bệnh gọt đẽo; tập thói quen khắc một lần là thành.'], b:['Hoàn thiện góc, viền, nền cho hai ấn ở buổi 21–22; nộp bản đóng trước và sau khi sửa.'], k:['tu-cai','thu-thap','noi-phuong-ngoai-vien']}, {n:24,t:'Tám ấn bệnh và cách đóng ấn',g:'Tự soát ấn bệnh và đóng ấn ra bản rõ, đẹp.', c:['Tám ấn bệnh: dày mảnh chênh quá xa, kết cấu không đều, thưa dày không thoả, trọng tâm sa xuống, nét mềm yếu, cứng đờ (bệnh người mới hay mắc nhất), đầu cuối nét nhọn, xiêu vẹo vỡ vụn (gõ đục quá tay để giả cổ).', 'Đóng ấn bốn bước: lót một cuốn sách dày khoảng 0,5 cm dưới giấy → chấm son nhịp nhanh, khoảng ngắn → hạ ấn phẳng, thẳng, đều lực → tay trái giữ giấy, tay phải nhấc ấn. Mờ thì dựa thước định vị đóng lại đúng chỗ.', 'Mùa đông son cứng thì hà hơi cho mềm.'], b:['Kiểm tra giai đoạn: nộp hai con ấn (âm văn, dương văn) kèm 3 bản đóng đẹp nhất và tự soát theo tám ấn bệnh.'], k:['an-benh','an-quy','an-ne','trong-tam']}, {n:25,t:'Đọc ấn',g:'Thưởng thức và phân tích một con ấn từ bốn góc độ.', c:['Cấu đồ tổng thể: viền, to nhỏ, vuông tròn, chỗ tàn phá, khí tức chung.', 'Phân chu bố bạch: số chữ, cách xếp, tỉ lệ chỗ để trống và chỗ để đỏ, quan hệ hư thực.', 'Đường nét: dài ngắn, dày mảnh, khoảng cách, khởi–thu, chuyển gấp; các thủ pháp co duỗi, nhường tránh, xuyên cài.', 'Đao ý và bút ý: nhịp bút lông bên trong nét, và khí kim thạch do dao tạo ra.', 'Cách đọc: tự hỏi “tại sao”, vừa đọc vừa ghi, so vài ấn cùng loại.'], b:['Viết phân tích 4 góc độ cho 3 ấn Hán trong phụ lục ấn mẫu của lớp.'], k:['doc-an','phan-chu-bo-bach','but-y','dao-y','hu-thuc']}, {n:26,t:'Chọn ấn mẫu',g:'Biết chọn mẫu lâm theo trình tự dễ đến khó.', c:['Chọn ấn Hán nét rõ, kết cấu đơn giản, vuông vắn, nét bằng thẳng, khoảng cách đều. Tránh ấn mờ nhoè, tàn vỡ, cuồng quái.', 'Trình tự: ấn 2 chữ trước, nhiều chữ sau; âm văn trước, dương văn sau; nét mảnh ít cong trước, nét thô cong tròn sau.', 'Phụ lục ấn mẫu gồm: Hán âm văn, Hán dương văn, cổ tỉ, dương văn nét mảnh của danh gia Minh–Thanh.'], b:['Chọn 4 ấn mẫu cho các buổi 27–31, giải thích vì sao chọn.'], k:['lam-mo','co-ti']}, {n:27,t:'Chép mẫu',g:'Chép ấn mẫu giống cả hình lẫn tinh thần.', c:['Đá 2 cm, vẽ khung 2 cm trên giấy, chép từng nét theo chữ ngược. Có thể chụp hoặc photo ấn thoái, lật bản sao để thấy chữ ngược mà tô.', 'Vẽ lại nhiều lần đến khi gần trùng khớp, giữ cả hình và tinh thần khí chất của ấn gốc.', 'Trang Thiết kế ấn triện có mục “Ảnh mẫu”: mở ảnh dấu ấn để đồ theo trên lưới hoặc cho máy chuyển thành nét.'], b:['Chép ấn âm văn nét mảnh “Vương Nghị” lên đá, nộp ảnh mặt đá và ảnh soi gương.'], k:['lam-mo','an-thoai'],design:true}, {n:28,t:'Khắc mẫu âm văn nét mảnh',g:'Khắc theo mẫu và sửa dần đến gần bản gốc.', c:['Dùng xung đao, hạ dao mạnh dạn, đừng rụt rè sợ hỏng.', 'Khắc chữ thứ nhất, rồi từng bộ phận của chữ thứ hai; đóng thử, đối chiếu ấn gốc, chỉnh chi tiết.', 'Âm văn: góc dao hướng vào nét — khắc bỏ chính nét chữ.'], b:['Khắc xong ấn “Vương Nghị”, nộp bản đóng đặt cạnh ấn gốc.'], k:['huong-tuyen','lam-mo']}, {n:29,t:'Khắc mẫu âm văn nét thô — nhiều lượt',g:'Biết sửa dần qua nhiều lượt mà không sửa quá tay.', c:['Lượt đầu nét thường mảnh hơn gốc, chỗ gấp cứng. Bắt đầu mảnh là đúng: nét mảnh sửa dày được, nét dày khó sửa mảnh (đây là quy luật của âm văn).', 'Mỗi lượt đóng thử, so gốc, sửa từng bước, tránh sửa quá tay.', 'Mục tiêu là đạt trong 1–2 lượt; bản tốt thì hình thần kiêm bị, khí thế quán thông.'], b:['Khắc ấn “Hạ Diên Thọ”, nộp bản đóng của từng lượt sửa.'], k:['tu-cai','am-van']}, {n:30,t:'Khắc mẫu ấn Hán dương văn',g:'Lâm khắc dương văn đời Hán.', c:['Cách làm như âm văn, chỉ khác: dương văn hạ dao quay lưng lại nét — khắc bỏ chỗ trống, giữ nét chữ.', 'Quy luật ngược với âm văn: để nét dày trước rồi gọt mảnh dần, vì dương văn chỉ bớt được.'], b:['Khắc ấn dương văn “Tử Thành”, nộp bản đóng cạnh ấn gốc.'], k:['boi-tuyen','duong-van']}, {n:31,t:'Ấn có tàn phá và cổ tỉ',g:'Xử lý chỗ vỡ ở viền và làm quen cổ tỉ.', c:['Chỗ vỡ ở viền của ấn mẫu không khắc ngay từ đầu mà để xử lý sau cùng, như vậy ấn lâm mới hoàn chỉnh.', 'Cổ tỉ dương văn thường viền rất dày, chữ nhỏ thoáng nhiều khoảng trắng — tương phản mạnh.', 'Tàn phá phải có chủ ý; gõ đục quá tay để giả cổ là ấn bệnh.'], b:['Khắc ấn “Quân tư mã ấn” hoặc một cổ tỉ dương văn viền dày, ghi rõ bước xử lý tàn phá.'], k:['tan-khuyet','co-ti']}, {n:32,t:'Phân chu bố bạch — xếp ấn 1 đến 4 chữ',g:'Nắm các cách xếp chữ cơ bản và thứ tự đọc.', c:['Chương pháp là sắp xếp hình tượng trong mặt vuông một tấc cho thành một chỉnh thể; trong khắc ấn gọi là phân chu bố bạch.', 'Ấn 2 chữ: phải–trái, trên–dưới, hoặc đối góc (hai góc còn lại để trống). Ấn 3 chữ: phải 2 trái 1, phải 1 trái 2, ba cột. Ấn 4 chữ: 2 × 2, phải 3 trái 1, 1–2–1, hồi văn (đọc vòng: phải trên → trái trên → trái dưới → phải dưới).', 'Chữ ít nét nên chiếm trọn một cột hoặc ô lớn.'], b:['Trên trang Thiết kế ấn triện, nhập một nội dung 4 chữ và thử cả 6 cách xếp; chọn cách đẹp nhất và giải thích.'], k:['phan-chu-bo-bach','chuong-phap','hoi-van'],design:true}, {n:33,t:'Xếp ấn nhiều chữ',g:'Xếp được ấn 5–9 chữ và ấn nhiều dòng.', c:['Ấn 5 chữ: 2–2–1, 1–2–2, 2–1–2, 3–2, 2–3. Ấn 6 chữ: 3 cột × 2, 2 cột × 3, 4–2, 3–2–1, 3–1–2.', 'Ấn 7–8 chữ: nhiều cách chia cột không đều (3–2–2, 4–2–1, 1–3–3, 4–4, 3–2–3…). Ấn 9 chữ: lưới 3 × 3.', 'Số chữ mỗi cột không cần bằng nhau; mặc định đọc cột dọc, phải sang trái.'], b:['Xếp một câu 7 chữ theo hai cách khác nhau trên trang Thiết kế, in ra so sánh.'], k:['phan-chu-bo-bach'],design:true}, {n:34,t:'Chọn âm văn hay dương văn',g:'Chọn kiểu khắc theo chữ và biết cách xen kẽ đỏ trắng.', c:['Chữ nhiều nét, phức tạp nên khắc dương văn; chữ ít nét, đơn giản nên khắc âm văn.', 'Dương văn lưu loát, thanh tú; âm văn hồn hậu, mộc mạc, ngưng trọng.', 'Chu bạch tương gian: trong một ấn có phần dương văn, có phần âm văn để cân nặng nhẹ.'], b:['Thiết kế một ấn 3 chữ chu bạch tương gian.'], k:['am-van','duong-van','chu-bach-tuong-gian'],design:true}, {n:35,t:'Xử lý tình huống khó',g:'Có cách giải cho chữ lặp, nhiều chữ, chữ nhiều nét, số chữ lẻ.', c:['Chữ lặp: mượn dùng (thêm hai chấm dưới chữ trên), gộp chữ, hoặc viết chữ lặp bằng dạng triện khác.', 'Nhiều chữ: chèn vào chỗ trống, nối hai chữ ít nét như một chữ, cho chữ to nhỏ theo số nét.', 'Chữ nhiều nét: gộp các nét gần nhau, cho chiếm nhiều diện tích hơn.', 'Số chữ lẻ: kéo dài một chữ chiếm trọn cột, nối chữ, thêm hình (tiếu hình), hoặc xen kẽ đỏ trắng.'], b:['Thiết kế một ấn có chữ lặp và một ấn 5 chữ, mỗi ấn dùng một cách giải khác nhau.'], k:['phan-chu-bo-bach','tieu-hinh-an'],design:true}, {n:36,t:'Tám điều cốt yếu của chương pháp (1–4)',g:'Hiểu bốn điều đầu của chương pháp.', c:['Chỉnh tề, cân đều: nét và khoảng cách nhất quán, ngang bằng dọc thẳng.', 'Đoan trang, đối xứng: cân trên–dưới, trái–phải; đối xứng có thể theo hư thực hoặc theo đường chéo.', 'Có biến hoá dày–mảnh cho sinh động.', 'Có cảm giác trong–đục, tàn khuyết: tàn khuyết dùng có chủ ý để bù chỗ thiếu về thưa dày, nặng nhẹ.'], b:['Phân tích 2 ấn Hán theo bốn điều này.'], k:['chuong-phap-bat-yeu','tan-khuyet','hu-thuc']}, {n:37,t:'Tám điều cốt yếu của chương pháp (5–8)',g:'Hiểu bốn điều sau của chương pháp.', c:['Thưa dày có ý tứ: chỗ thưa cho ngựa chạy, chỗ dày gió không lọt; trong hư có thực, trong thực có hư.', 'Nhìn nhau, hô ứng: chữ với chữ, nét với nét, bộ với bộ nương nhau.', 'Kết hợp chính–nghiêng, hiểm–bình: trong ngay ngắn có chút chênh vênh, hoá nguy thành yên.', 'So le, khoa trương: cố ý phóng to, thu nhỏ, kéo dài, xếp so le cho khỏi cứng.'], b:['Phân tích 2 ấn Hán theo bốn điều này; chỉ ra một chỗ “hoá hiểm thành di”.'], k:['chuong-phap-bat-yeu','so-mat','ho-ung','chinh-khi','thac-lac']}, {n:38,t:'Thiết kế và tự soát bố cục',g:'Thiết kế một ấn và tự soát theo chương pháp trước khi khắc.', c:['Dùng trang Thiết kế ấn triện: đặt bố cục chữ, vẽ nét, bật bản đồ thưa–dày và đọc phần “Soát chương pháp”.', 'Soát trọng tâm (tránh đầu nhẹ chân nặng), thưa dày, đối xứng, khoảng cách nét đủ để khắc.', 'Kết quả soát chỉ là gợi ý; quyết định cuối là ở mắt người khắc.'], b:['Kiểm tra giai đoạn: nộp bản in khắc của một ấn 4 chữ tự thiết kế kèm phần soát, rồi khắc ấn đó.'], k:['trong-tam','so-mat'],design:true}, {n:39,t:'Viền của ấn dương văn và âm văn',g:'Hiểu viền là một phần của thiết kế và chọn được kiểu viền.', c:['Người xưa ví: ấn có viền như nhà có tường rào.', 'Dương văn: viền là đường đỏ nhìn thấy — viền dày, viền mảnh, phối dày mảnh, viền kép, mượn nét chữ làm viền, hoặc không viền (phải xếp chữ vuông chặt để tạo “biên vô hình”).', 'Âm văn: viền chính là phần đỏ chừa quanh chữ (lưu hồng); lề rộng thì thoáng, lề hẹp thì chặt. Có thể thêm khung trắng, hoặc cho chữ ép sát mép để khí thế mở.'], b:['Thiết kế cùng một nội dung với 4 kiểu viền khác nhau, chọn kiểu hợp nhất.'], k:['bien-lan','luu-hong','ta-bien','buc-bien','vo-bien'],design:true}, {n:40,t:'Chia ô và các viền mô phỏng đồ cổ',g:'Dùng ô chia và các viền đặc biệt đúng chỗ.', c:['Ô chia theo số chữ: ô chữ Nhật cho 2 chữ, ô chữ T cho 3 chữ, ô chữ Điền (hoặc chữ Thập không viền ngoài) cho 4 chữ, ô chữ Tỉnh hoặc nhiều ô cho 6–9 chữ, hàng rào dọc cho chữ xếp cột.', 'Viền mô phỏng đồ cổ: phong nê (viền dày, mép sần), ngói đương (vòng ngoài rất dày, chia bốn ô), tiền cổ, chuông nhạc, khuyết góc, hình chữ Á.', 'Phân biệt: liên châu là các ô rời nhưng có điểm nối; bính hợp là rời hẳn. Bất quy tắc là theo hình đá tự nhiên; dị hình là hình lạ có chủ ý.'], b:['Thiết kế một ấn 4 chữ ô chữ Điền và một ấn tròn kiểu ngói đương.'], k:['dien-tu-cach','phong-ne','ngoa-duong'],design:true}, {n:41,t:'Sáng tác bằng gom chữ',g:'Ghép chữ có sẵn từ các ấn cùng phong cách thành ấn mới.', c:['Tìm trong các ấn có phong cách thống nhất những chữ mình cần, sắp xếp lại theo chương pháp ấn Hán.', 'Phần sáng tạo chủ yếu là bố cục và làm cho các chữ thống nhất với nhau.', 'Giai đoạn đầu sáng tác vẫn lấy phong cách ấn Hán đoan trang làm chủ.'], b:['Gom chữ từ ấn mẫu để làm một ấn 4 chữ, ghi rõ mỗi chữ lấy từ ấn nào.'], k:['tap-tu']}, {n:42,t:'Sáng tác bằng phỏng chữ',g:'Tự dựng chữ mới theo phong cách của một nhóm ấn.', c:['Khác gom chữ: chữ do mình tự dựng theo đặc điểm tự hình và đường nét của ấn mẫu; không chữ nào trùng với mẫu.', 'Kỹ thuật: song đao xung khắc; phần đá còn sót giữa nét rộng thì khắc bỏ bằng nhát thứ ba.'], b:['Phỏng phong cách quan ấn Hán để khắc một ấn tên một người bạn.'], k:['phong-tu']}, {n:43,t:'Sáng tác bằng phỏng hình',g:'Mượn ngoại hình, đặc biệt là viền, của ấn cổ.', c:['Có ấn đẹp nhờ viền mới lạ kết hợp với chữ bên trong — ví dụ cổ tỉ viền rất dày đi với chữ mảnh.', 'Viền khắc ngoài tròn trong vuông, không được đờ. Chỉ cần đại thể tương tự, lấy được hình thần.', 'Phỏng hình là bài tập hằng ngày cho người mới.'], b:['Phỏng hình một cổ tỉ hoặc ngói đương để khắc một ấn 2–4 chữ.'], k:['phong-hinh','co-ti']}, {n:44,t:'Sáng tác bằng phỏng ý',g:'Lấy ý cảnh của một lối ấn, không cầu giống hình.', c:['Phỏng ý là cầu “thần hợp ý hợp”: lấy ý cảnh của cổ tỉ, ấn Tần, ấn Hán, phong nê hay ngói đương mà tạo ấn mới.', 'Đòi hỏi công phu cơ bản và thẩm mỹ cao hơn các bậc trước.'], b:['Khắc một ấn lấy ý phong nê và viết 5 dòng giải thích mình đã lấy “ý” gì.'], k:['phong-y','phong-ne']}, {n:45,t:'Sáng tác độc lập — ấn họ tên',g:'Tự cấu tứ một con ấn của riêng mình.', c:['Không phỏng theo hình thức nào, tự cấu tứ theo đặc điểm kết cấu chữ và kỹ năng đã có.', 'Bố cục, thế nét, nặng nhẹ, dày mảnh, nhường tránh, co duỗi đều đổi được phong mạo ấn.', 'Với người mới: mỗi ấn có một “điểm sáng” là thành công.'], b:['Thiết kế và khắc ấn họ tên của mình (chữ Hán hoặc chữ Việt Điền thể), nộp bản in khắc và bản đóng.'], k:['doc-lap','tinh-danh-an'],design:true}, {n:46,t:'Nội dung, vị trí và hình thức biên khoản',g:'Quyết định khoản ghi gì và đặt ở đâu trước khi khắc mặt ấn.', c:['Khoản là chữ khắc chìm, thức là chữ khắc nổi; gọi chung là biên khoản.', 'Tám loại nội dung: đơn khoản (chỉ tên người khắc), song khoản (thêm tên người nhận kèm lời khiêm như “nhã chúc”, “chỉ chính”), năm tháng, nơi chốn, lý do, tâm đắc, nhàn văn, tiếu hình. Câu chữ cần có văn thái.', 'Vị trí phải chọn trước khi khắc mặt ấn. Khoản một mặt đặt ở mặt trái; nhiều mặt thì đi trái → sau → phải → trước → đỉnh (bắt đầu từ trái), hoặc ngược lại để kết thúc ở trái.', 'Đá quý chỉ khắc ít chữ ở mặt kém đẹp nhất.'], b:['Soạn song khoản cho ấn buổi 45 trên thẻ Thân ấn của trang Thiết kế, in bản trải 4 mặt.'], k:['bien-khoan','don-khoan','song-khoan','thuy-u-ta'],design:true}, {n:47,t:'Khắc khoản đơn đao',g:'Khắc từng loại nét chữ khải bằng góc dao.', c:['Không viết trước; mỗi nét là một hoặc vài nhát ấn góc dao vào đá.', 'Chấm: ấn góc dao từ trên xuống thành chấm tam giác. Ngang: đi từ phải sang trái. Sổ: từ trên xuống. Phẩy: xung chéo xuống trái. Mác: xung từ dưới phải lên trên trái (ngược chiều viết).', 'Móc: ghép từ nhiều nhát (sổ rồi chấm tam giác; móc tai ghép năm nhát).', 'Đơn đao chữ khải là nền tảng cho mọi thể khác. Với chữ Quốc ngữ, dùng cùng cách cắt cho từng nét chữ cái.'], b:['Khắc một trang nét mẫu (chấm, ngang, sổ, phẩy, mác, móc) và khoản tên mình lên mặt trái ấn buổi 45.'], k:['don-dao','bien-khoan']}, {n:48,t:'Khắc khoản song đao và rập khoản',g:'Khắc khoản giữ dáng bút và rập ra giấy.', c:['Khoản dương văn luôn khắc song đao như ấn dương văn, nhưng chữ xuôi, không ngược. Khoản âm văn song đao: viết mực trước, khắc hai bên nét, nét to thì khoét giữa.', 'Rập khoản: quét nước lên mặt khoản, phủ giấy mỏng hút nước → thấm bớt nước → xoa cho dính phẳng → chải cho giấy lún vào rãnh chữ → khi giấy khô khoảng bảy phần, chấm thác bao thật ít mực, rập từ chỗ không chữ dần vào, 3–5 lượt → bóc giấy (dính thì hà hơi).', 'Cách nhanh: bôi đen mặt khoản, xoa bột trắng vào rãnh rồi photocopy.'], b:['Rập khoản ấn buổi 47, nộp ảnh bản rập.'], k:['song-dao','thac-khoan','thac-bao']}, {n:49,t:'Các loại ấn và núm ấn',g:'Gọi tên các loại ấn và làm quen chạm núm.', c:['Ấn thường gặp: họ tên, tự hiệu, trai quán (tên thư phòng), thư giản (dùng cho thư từ), giám tàng (thưởng giám, sưu tầm), cát ngữ, nhàn chương, tiếu hình, hoa áp, điểu trùng triện, phỏng phong nê, phỏng ngói đương.', 'Ấn đặc biệt: hình lạ, hai mặt, sáu mặt, ấn lồng mẹ–con, móc thắt lưng, ấn nung, dấu trên gốm ngói.', 'Núm ấn: đời Hán có đẳng cấp (rồng, hổ cho vua; rùa cho hầu tướng; núm mũi cho quan thấp). Người mới tập chạm nông quanh thân đá (bạc ý nữu) trước; chọn đầu đá có tì vết để làm núm.'], b:['Lập danh sách bộ ấn cá nhân cần có: ấn họ tên, ấn tự hiệu, một nhàn chương, một dẫn thủ chương.'], k:['tinh-danh-an','tu-hieu-an','trai-quan-an','nhan-chuong','tieu-hinh-an','nui-an','bac-y-nuu']}, {n:50,t:'Dùng ấn trên thư pháp',g:'Đóng ấn đúng chỗ, đúng cỡ trên một bức thư pháp.', c:['Tác phẩm thư hoạ phải có ấn mới trọn vẹn.', 'Ấn họ tên, tự hiệu: đi theo lạc khoản, cỡ không lớn hơn chữ khoản; thường một cặp vuông, một âm một dương.', 'Dẫn thủ chương: góc trên bên phải (đầu dòng đầu), thường hình chữ nhật hoặc hình tự nhiên. Áp giác chương (cũng là nhàn chương): góc dưới, lớn hơn một chút. Biên ấn: giữa mép trái hoặc phải, nhỏ hơn áp giác, không đóng cả hai bên.', 'Sáu điểm: cỡ hợp tác phẩm, số ấn thống nhất mà biến hoá, hợp phong cách, bổ trợ đề khoản, giữ lễ nghi, có ý mới.'], b:['Viết một bức thư pháp nhỏ và đóng đủ ấn họ tên, dẫn thủ chương, áp giác chương; chụp gửi lớp.'], k:['dan-thu-chuong','ap-giac-chuong','bien-an','nhan-chuong','lac-khoan']}, {n:51,t:'Ấn bình và ấn phổ cá nhân',g:'Trình bày ấn thành tác phẩm để triển lãm và lưu giữ.', c:['Ấn thác (ấn hoa, ấn cảo) là dấu ấn đóng ra giấy; ấn bình là tác phẩm ghép dấu ấn, bản rập khoản và lạc khoản, trình bày như một bức thư hoạ.', 'Ấn bình có nhiều khổ: lập trục, đấu phương, mặt quạt, sách trang…; tác phẩm khắc ấn đi triển lãm chủ yếu ở dạng này.', 'Ấn phổ (ấn tập, ấn tồn) là sách tập hợp dấu ấn.'], b:['Làm một ấn bình gồm 3–4 ấn đã khắc trong khoá, kèm bản rập khoản.'], k:['an-binh','an-thoai','an-pho']}, {n:52,t:'Tác phẩm tốt nghiệp',g:'Hoàn thành bộ ấn cá nhân và tự đánh giá cả quá trình.', c:['Bộ ấn tốt nghiệp gồm: một cặp ấn họ tên (một âm văn, một dương văn), một nhàn chương do mình tự chọn nội dung, có biên khoản.', 'Mỗi ấn nộp kèm bản in khắc từ trang Thiết kế, bản đóng, bản rập khoản và phần tự soát (nét bệnh, ấn bệnh, tám điều cốt yếu).', 'Trình bày tất cả thành một ấn bình và đóng ấn lên một bức thư pháp của mình.'], b:['Nộp bộ tác phẩm tốt nghiệp và bài tự đánh giá: ấn nào có “điểm sáng”, nét bệnh nào mình còn hay mắc.'], k:['an-binh','tinh-danh-an','nhan-chuong','bien-khoan'],design:true} ]; var terms=[ {id:'am-van',t:'Âm văn',a:'Bạch văn, chữ trắng',d:'Ấn khắc bỏ nét chữ; khi đóng, chữ hiện màu trắng trên nền đỏ. Hợp với chữ ít nét; phong cách hồn hậu, mộc mạc.'}, {id:'an-benh',t:'Ấn bệnh',a:'Tám ấn bệnh',d:'Lỗi của cả con ấn: dày mảnh chênh quá xa, kết cấu không đều, thưa dày không thoả, trọng tâm sa xuống, nét mềm yếu, cứng đờ, đầu cuối nét nhọn, xiêu vẹo vỡ vụn.'}, {id:'an-binh',t:'Ấn bình',a:'',d:'Tác phẩm ghép dấu ấn, bản rập khoản và lạc khoản, trình bày như một bức thư hoạ để treo hoặc triển lãm.'}, {id:'an-ne',t:'Ấn nê',a:'Son, mực son',d:'Chất màu để đóng ấn, làm từ chu sa, dầu thầu dầu và sợi ngải. Son tốt đỏ mà không gắt, dày, bóng, mịn, không loang dầu.'}, {id:'an-pho',t:'Ấn phổ',a:'Ấn tập, ấn tồn',d:'Sách tập hợp dấu ấn. Người học dùng ấn phổ cổ để lâm mô, và nên tự làm ấn phổ riêng.'}, {id:'an-quy',t:'Ấn quy',a:'Thước định vị',d:'Thước hình chữ L để áp ấn vào góc trong khi đóng; giữ nguyên thước để đóng lại lần hai cho rõ mà không lệch.'}, {id:'an-sang',t:'Ấn sàng',a:'Giá kẹp ấn',d:'Dụng cụ kẹp chặt ấn khi khắc, bằng gỗ hoặc kim loại. Ấn đá thường không cần, cầm tay linh hoạt hơn; ấn đồng thì phải dùng.'}, {id:'an-thoai',t:'Ấn thoái',a:'Ấn thác, ấn hoa, ấn cảo, dấu in',d:'Dấu ấn đã đóng ra giấy. Chữ trên dấu in là chữ thuận, chữ trên mặt khắc là chữ ngược.'}, {id:'an-tong-tan-han',t:'Ấn tông Tần Hán',a:'',d:'Nguyên tắc làm ấn lấy ấn đời Tần, Hán làm gốc: dùng mâu triện, học theo chương pháp và đao pháp của ấn Tần Hán.'}, {id:'ap-giac-chuong',t:'Áp giác chương',a:'Ấn chặn góc',d:'Ấn đóng ở góc dưới của bức thư hoạ, thường vuông và lớn hơn ấn họ tên một chút; cũng là một loại nhàn chương.'}, {id:'bac-y-nuu',t:'Bạc ý nữu',a:'Chạm nông',d:'Lối chạm nông tranh (người, sơn thuỷ, hoa điểu) quanh thân hoặc đỉnh đá thay cho núm. Người mới nên tập lối này trước.'}, {id:'bien-an',t:'Biên ấn',a:'Yêu chương, ấn cạnh',d:'Ấn đóng ở khoảng giữa mép trái hoặc mép phải bức thư hoạ, nhỏ hơn áp giác chương. Không đóng cả hai bên cùng lúc.'}, {id:'bien-khoan',t:'Biên khoản',a:'Khoản thức',d:'Chữ hoặc hình khắc ở thân ấn: ghi tên người khắc, người nhận, thời gian, lý do… Chữ khắc chìm gọi là khoản, khắc nổi gọi là thức.'}, {id:'bien-lan',t:'Biên lan',a:'Đường viền, khung ấn',d:'Viền bao quanh mặt ấn, có thể gồm cả đường chia ô. Người xưa ví ấn có viền như nhà có tường rào.'}, {id:'bo-thu',t:'Bộ thủ dạng triện',a:'',d:'Hình dạng các bộ thủ khi viết bằng chữ triện; nhiều bộ khác xa dạng chữ chân, phải học thuộc mới tra và dựng chữ được.'}, {id:'boi-tuyen',t:'Dao quay lưng khỏi nét',a:'Bối tuyến lạc đao',d:'Cách đặt góc dao khi khắc dương văn: lưng dao hướng ra phía nền, lưỡi áp sát mép ngoài nét để giữ nét lại.'}, {id:'buc-bien',t:'Ép sát mép',a:'Bức biên',d:'Kiểu ấn âm văn cho chữ kéo ra chạm hoặc gần chạm mép ấn, khí thế mở và căng.'}, {id:'but-y',t:'Bút ý',a:'',d:'Nhịp điệu của bút lông còn thấy trong nét khắc: dừng–ngắt, nhấc–ấn, nhanh–chậm.'}, {id:'chiet-phai',t:'Chiết phái',a:'Phái Chiết Giang, phái Tây Linh',d:'Trường phái khắc ấn do Đinh Kính mở đầu, dùng thiết đao nhiều nhất; nét gãy cứng, cổ phác, nặng đọng.'}, {id:'chinh-khi',t:'Chính – khi, hiểm – di',a:'',d:'Kết hợp ngay ngắn với nghiêng lệch, chênh vênh với yên ổn trong bố cục; khéo xử lý thì “hoá hiểm thành di” (hoá nguy thành yên).'}, {id:'chu-bach-tuong-gian',t:'Chu bạch tương gian',a:'Đỏ trắng xen kẽ',d:'Trong một ấn có phần khắc dương văn, có phần khắc âm văn, để cân nặng nhẹ hoặc giải bài toán số chữ lẻ.'}, {id:'chuong-phap',t:'Chương pháp',a:'Bố cục',d:'Cách sắp xếp chữ và các thành phần trên mặt ấn cho thành một chỉnh thể đẹp.'}, {id:'chuong-phap-bat-yeu',t:'Tám điều cốt yếu của chương pháp',a:'Chương pháp bát yếu',d:'Chỉnh tề cân đều; đoan trang đối xứng; dày mảnh biến hoá; trong đục tàn khuyết; thưa dày có ý tứ; nhìn nhau hô ứng; chính nghiêng hiểm bình; so le khoa trương.'}, {id:'co-ti',t:'Cổ tỉ',a:'',d:'Ấn thời Tiên Tần (chủ yếu Chiến Quốc). Dương văn thường viền dày, chữ nhỏ thoáng; âm văn hay có vạch ngăn.'}, {id:'dai-trien',t:'Đại triện',a:'',d:'Chữ triện có trước tiểu triện, dáng tự do, nhiều nét tượng hình.'}, {id:'dan-thu-chuong',t:'Dẫn thủ chương',a:'Ấn mở đầu',d:'Ấn đóng ở góc trên bên phải bức thư hoạ (đầu dòng đầu), thường hình chữ nhật hoặc hình tự nhiên theo viên đá.'}, {id:'dao-phap',t:'Đao pháp',a:'Kỹ thuật dùng dao',d:'Cách dùng dao khắc chữ lên đá. Khâu cuối và quyết định của một con ấn, tạo ra vị kim thạch.'}, {id:'dao-truot',t:'Trượt dao, lệch dao, mất dao',a:'Hoạt đao, tẩu đao, thất đao',d:'Lỗi mất kiểm soát dao khi đẩy quá nhanh: làm hỏng nét, mẻ đá và có thể đâm vào tay giữ đá.'}, {id:'dao-y',t:'Đao ý',a:'',d:'Khí chất kim thạch do dao tạo ra khi đẩy, cắt, chém, đục — thấy được trong mép nét.'}, {id:'di-thach-tuu-dao',t:'Dĩ thạch tựu đao',a:'Đưa đá đến với dao',d:'Nguyên tắc giữ hướng dao gần như cố định và xoay đá bằng tay trái để khắc các nét theo nhiều hướng.'}, {id:'diep-dao',t:'Điệp đao',a:'Dao chồng',d:'Hai nhát đơn đao song song chồng lên nhau để được một nét âm văn rộng, dùng khi khắc ấn lớn.'}, {id:'dien-the',t:'Điền thể',a:'',d:'Lối chữ Quốc ngữ xếp thành khối vuông theo tinh thần chữ triện, nét đều đầu tròn, do lớp xây dựng. Không có trong sách gốc.'}, {id:'dien-tu-cach',t:'Ô chữ Điền',a:'Điền tự cách',d:'Khung vuông chia bốn ô bằng một ngang một dọc, mỗi ô một chữ; rất đặc trưng cho ấn Tần. Không có khung ngoài thì gọi là ô chữ Thập.'}, {id:'doc-an',t:'Đọc ấn',a:'Độc ấn',d:'Thưởng thức và phân tích một con ấn qua bốn góc độ: cấu đồ tổng thể, phân chu bố bạch, đường nét, đao ý và bút ý.'}, {id:'doc-lap',t:'Sáng tác độc lập',a:'',d:'Bậc cao nhất trong năm bậc sáng tác: không phỏng theo hình thức nào, tự cấu tứ theo kết cấu chữ.'}, {id:'don-dao',t:'Đơn đao',a:'Một dao',d:'Mỗi nét khắc bằng một nhát dao; một mép nhẵn, một mép vỡ tự nhiên. Dùng cho ấn âm văn và biên khoản.'}, {id:'don-khoan',t:'Đơn khoản',a:'Cùng khoản',d:'Biên khoản chỉ ghi tên người khắc, có thể thêm chữ “khắc”, “triện”, “chế” hoặc thời gian, nơi chốn.'}, {id:'duong-van',t:'Dương văn',a:'Chu văn, chữ đỏ',d:'Ấn khắc bỏ nền, giữ lại nét chữ; khi đóng, chữ hiện màu đỏ. Hợp với chữ nhiều nét; phong cách lưu loát, thanh tú.'}, {id:'giap-cot',t:'Giáp cốt văn',a:'',d:'Chữ khắc trên mai rùa, xương thú đời Thương; có thể đưa vào ấn cho vẻ cổ, tự nhiên.'}, {id:'hoan-phai',t:'Hoàn phái',a:'Phái An Huy',d:'Trường phái khắc ấn tiêu biểu cho xung đao (như Hà Chấn); nét thẳng mạnh, hùng hậu, vững chãi.'}, {id:'ho-ung',t:'Cố phán hô ứng',a:'Nhìn nhau, hô ứng',d:'Chữ với chữ, nét với nét, bộ thủ với bộ thủ có liên hệ, nương tựa nhau trong mặt ấn.'}, {id:'hoi-van',t:'Hồi văn',a:'Đọc vòng',d:'Cách xếp ấn 4 chữ đọc theo vòng: phải trên → trái trên → trái dưới → phải dưới.'}, {id:'hu-thuc',t:'Hư – thực',a:'',d:'Chỗ có nét là thực, chỗ trống (nền, khoảng cách, viền) là hư. Ấn hay làm cho hư thực đối lập mà thống nhất.'}, {id:'huong-tuyen',t:'Dao hướng vào nét',a:'Hướng tuyến lạc đao',d:'Cách đặt góc dao khi khắc âm văn: góc dao hướng vào phía nét, khắc bỏ chính nét chữ.'}, {id:'kim-thach-vi',t:'Vị kim thạch',a:'Khí kim thạch',d:'Vẻ cổ kính, mộc mạc như chữ trên đồ đồng, bia đá mà nét khắc trên ấn mang lại.'}, {id:'kim-van',t:'Kim văn',a:'',d:'Chữ đúc trên đồ đồng đời Thương, Chu.'}, {id:'lac-khoan',t:'Lạc khoản',a:'Đề khoản',d:'Dòng chữ ghi tên tác giả, thời gian… trên bức thư hoạ; ấn họ tên đi theo lạc khoản.'}, {id:'lam-mo',t:'Lâm mô',a:'',d:'Chép và khắc theo ấn mẫu; với khắc ấn gồm đọc ấn, chọn ấn, chép mẫu, khắc mẫu. Học khắc ấn bắt đầu từ lâm mô ấn Tần Hán.'}, {id:'luu-hong',t:'Lưu hồng',a:'Chừa đỏ',d:'Phần đỏ chừa quanh chữ của ấn âm văn — chính là viền của ấn âm văn. Lề rộng thì ấn thoáng, lề hẹp thì ấn chặt.'}, {id:'ma-thach',t:'Mài đá',a:'Ma thạch chương',d:'Mài phẳng mặt đá trước khi khắc, đưa tay theo hình số 8 hoặc số 0; mài thô trên đá mài, mài tinh trên gạch xanh.'}, {id:'mat-an',t:'Mặt ấn',a:'Ấn diện',d:'Mặt khắc chữ ở đáy con ấn, dùng để đóng.'}, {id:'mau-trien',t:'Mâu triện',a:'Hán triện, mô ấn triện',d:'Chữ triện trên ấn đời Hán: xoay tròn đổi thành gấp vuông, dáng vuông lấp đầy ô. Là chữ cơ bản để đưa vào ấn.'}, {id:'nhan-chuong',t:'Nhàn chương',a:'Nhàn văn ấn',d:'Ấn khắc thơ, cách ngôn, thành ngữ, thiền ngữ… để gửi gắm tâm tình; thường dùng làm dẫn thủ hoặc áp giác chương.'}, {id:'net-benh',t:'Nét bệnh',a:'Mười hai nét bệnh',d:'Lỗi của từng nét do dao: cành gãy, béo phì, đốt tre, đầu đinh, răng cưa, to nhỏ không đều, mềm yếu, khối vuông, vỡ vụn, nhọn cạnh, đá ngầm, gai râu.'}, {id:'ngoa-duong',t:'Ngói đương',a:'Ngõa đương',d:'Đầu ngói tròn hoặc bán nguyệt của công trình cổ, có chữ cát tường. Ấn phỏng ngói đương thường tròn, vòng ngoài dày, chia bốn ô quanh núm tâm.'}, {id:'ngoc-tru',t:'Ngọc trứ triện',a:'Triện đũa ngọc',d:'Lối tiểu triện nét đều như chiếc đũa ngọc; mẫu nên học đầu tiên là bia Dịch Sơn khắc thạch.'}, {id:'noi-phuong-ngoai-vien',t:'Trong vuông ngoài tròn',a:'Nội phương ngoại viên',d:'Nguyên tắc xử lý góc: góc ngoài của ấn thiên tròn, góc trong thiên vuông thì ấn có thần.'}, {id:'nui-an',t:'Núm ấn',a:'Ấn nữu',d:'Phần tạo hình trên đỉnh ấn: núm mũi, núm ngói, núm cầu, rùa, rồng, sư tử… Đời Hán, kiểu núm thể hiện đẳng cấp.'}, {id:'phan-chu-bo-bach',t:'Phân chu bố bạch',a:'',d:'Chia phần đỏ, xếp phần trắng: cách gọi chương pháp trong khắc ấn — quyết định số chữ, cách xếp, chỗ để trống và chỗ để đỏ.'}, {id:'phan-thu',t:'Viết ngược lên đá',a:'Phản thư thượng thạch',d:'Tự viết chữ ngược lên mặt đá, bằng cách soi mặt sau giấy mỏng hoặc soi gương.'}, {id:'phong-hinh',t:'Phỏng hình',a:'',d:'Bậc sáng tác mượn ngoại hình (đặc biệt là viền) của ấn cổ, chỉ cần đại thể tương tự.'}, {id:'phong-ne',t:'Phong nê',a:'',d:'Cục đất sét niêm phong thư tre gỗ thời xưa, có in dấu ấn. Ấn phỏng phong nê có viền dày, mép sần, chữ mộc.'}, {id:'phong-tu',t:'Phỏng chữ',a:'Phỏng tự',d:'Bậc sáng tác tự dựng chữ mới theo phong cách nét của ấn mẫu, không chữ nào trùng mẫu.'}, {id:'phong-y',t:'Phỏng ý',a:'',d:'Bậc sáng tác chỉ lấy ý cảnh của một lối ấn, không cầu giống hình — “thần hợp ý hợp”.'}, {id:'phuong-chiet',t:'Gấp vuông',a:'Phương chiết',d:'Cách nối nét bằng góc vuông, cho cảm giác ngay thẳng, cứng cáp.'}, {id:'so-mat',t:'Sơ mật',a:'Thưa – dày',d:'Quan hệ chỗ thưa, chỗ dày trong mặt ấn. Thưa dày nên sinh tự nhiên từ kết cấu chữ: chỗ thưa cho ngựa chạy, chỗ dày gió không lọt.'}, {id:'song-dao',t:'Song đao',a:'Hai dao',d:'Khắc mỗi mép nét bằng một nhát dao riêng, giữ được dáng bút. Ấn dương văn và khoản dương văn đều khắc song đao.'}, {id:'song-khoan',t:'Song khoản',a:'',d:'Biên khoản ghi cả tên người được tặng (kèm lời khiêm như nhã chúc, chỉ chính, phủ chính) và tên người khắc.'}, {id:'ta-bien',t:'Mượn viền',a:'Tá biên',d:'Lấy một số nét của chữ làm luôn viền ấn dương văn, ở một, hai hoặc ba mặt.'}, {id:'tan-khuyet',t:'Tàn khuyết',a:'Tàn phá',d:'Chỗ sứt, vỡ trên nét hoặc viền. Dùng có chủ ý để bù chỗ thiếu về thưa dày, nặng nhẹ; khi khắc thật thì để làm sau cùng.'}, {id:'tap-tu',t:'Gom chữ',a:'Tập tự',d:'Bậc sáng tác đầu tiên: lấy chữ có sẵn từ các ấn cùng phong cách, xếp lại thành ấn mới.'}, {id:'thac-bao',t:'Thác bao',a:'Túi rập',d:'Túi bông bọc giấy dầu và vải, gói thành hình cầu dẹt, dùng chấm mực để rập khoản.'}, {id:'thac-khoan',t:'Rập khoản',a:'Thác biên khoản',d:'Lấy chữ khoản ra giấy: phủ giấy mỏng ướt lên mặt khoản, chải cho lún vào rãnh, khô khoảng bảy phần thì rập mực 3–5 lượt.'}, {id:'thac-lac',t:'So le, khoa trương',a:'Thác lạc khoa trương',d:'Cố ý phóng to, thu nhỏ, kéo dài, xếp lệch một số chữ, nét để bố cục không cứng nhắc.'}, {id:'than-an',t:'Thân ấn',a:'',d:'Bốn mặt bên của con ấn (trước, phải, sau, trái); nơi khắc biên khoản.'}, {id:'thanh-dien',t:'Đá Thanh Điền',a:'',d:'Đá khắc ấn vùng Thanh Điền (Chiết Giang): giòn mà mềm, mịn, không lẫn hạt cứng, rẻ — đá luyện tập tốt nhất cho người mới.'}, {id:'thiet-dao',t:'Thiết đao',a:'Cắt dao',d:'Đao pháp cắt theo nhịp nhấc–ấn, gom điểm thành đường; cán dao 45–65 độ rồi dựng lên gần 90 độ. Nét gãy cứng, có nhịp.'}, {id:'thiet-tuyen',t:'Thiết tuyến triện',a:'Triện dây sắt',d:'Lối tiểu triện nét mảnh, cứng và căng như dây sắt.'}, {id:'tho-son',t:'Đá Thọ Sơn',a:'',d:'Đá vùng Thọ Sơn (Phúc Kiến). Loại thường giá thấp, hợp người mới; thượng phẩm là điền hoàng và bạch phù dung.'}, {id:'thu-thap',t:'Hoàn thiện',a:'Thu thập',d:'Chỉnh sửa, tô điểm toàn bộ mặt ấn ở bước cuối: góc ấn, viền ấn, nền ấn.'}, {id:'thuy-an-an-cao',t:'Thuỷ ấn ấn cảo',a:'Chuyển bản bằng nước',d:'Cách chuyển bản thảo lên đá: úp mặt mực xuống đá, làm ẩm, miết cho mực in sang; chữ tự thành chữ ngược đúng chiều khắc.'}, {id:'thuy-u-ta',t:'Bắt đầu từ trái',a:'Thuỷ ư tả',d:'Quy ước đặt biên khoản: khoản một mặt ở mặt trái; nhiều mặt thì đi trái → sau → phải → trước → đỉnh. Cách ngược lại gọi là kết thúc ở trái.'}, {id:'tieu-hinh-an',t:'Tiếu hình ấn',a:'Ấn hình',d:'Ấn khắc hình người, vật, cảnh thay cho chữ hoặc kèm chữ; phần lớn là âm văn.'}, {id:'tieu-trien',t:'Tiểu triện',a:'Tần triện',d:'Chữ thống nhất đời Tần: dáng chữ nhật đứng, nét đều, chỉ có thẳng và cong, không phẩy mác móc.'}, {id:'tinh-danh-an',t:'Ấn họ tên',a:'Tính danh ấn',d:'Ấn khắc họ và tên, loại dùng nhiều nhất trên thư hoạ; công thức thường gặp: … ấn, … chi ấn, … tư ấn, … ấn tín.'}, {id:'trai-quan-an',t:'Ấn trai quán',a:'Ấn thư phòng',d:'Ấn khắc tên thư phòng, nhà ở (… trai, … đường, … hiên, … các…), thể hiện khí chất văn nhân.'}, {id:'tram-truoc',t:'Trầm trước',a:'',d:'Cảm giác vững, chìm, chắc khi đi dao: vừa đẩy dao tới vừa giữ được dao, không khắc vội.'}, {id:'tren-chat-duoi-long',t:'Trên chặt dưới lỏng',a:'Thượng khẩn hạ tùng',d:'Quy tắc kết cấu: phần trên chữ (và mặt ấn) xếp chặt hơn phần dưới để trọng tâm không sa xuống.'}, {id:'trien-khac',t:'Triện khắc',a:'Khắc ấn',d:'Nghệ thuật khắc chữ (thường là chữ triện) lên ấn, kết hợp thư pháp, bố cục và dao.'}, {id:'trien-phap',t:'Triện pháp',a:'',d:'Khâu chọn, tra và viết chữ triện cho con ấn; khâu đầu tiên trước chương pháp và đao pháp.'}, {id:'trong-tam',t:'Trọng tâm',a:'',d:'Điểm cân của khối nét trong mặt ấn. Trọng tâm sa xuống (đầu nhẹ chân nặng) là một ấn bệnh.'}, {id:'tu-cai',t:'Sửa',a:'Tu cải',d:'Chỉnh cục bộ vài nét sau khi đóng thử. Sửa ít, nhìn toàn cục; sửa quá nhiều sinh bệnh gọt đẽo, cứng đờ.'}, {id:'tu-hieu-an',t:'Ấn tự hiệu',a:'',d:'Ấn khắc tên tự hoặc tên hiệu; thường không thêm chữ “ấn”. Biệt hiệu thường có dạng … sơn nhân, … cư sĩ, … đạo nhân.'}, {id:'tu-yeu-tu-bat',t:'Bốn phải, bốn không',a:'Tứ yếu tứ bất',d:'Chuẩn mực cho mỗi nhát dao. Bốn phải: vững, chuẩn, mạnh, đều. Bốn không: không phù nề, không mảnh yếu, không dừng dao giữa nét, không sửa lặp tuỳ tiện.'}, {id:'van-nhan-an',t:'Văn nhân ấn',a:'',d:'Ấn do văn nhân, hoạ sĩ tự khắc bằng đá, hưng thịnh từ đời Minh, Thanh; từ đây ấn thành một môn nghệ thuật độc lập.'}, {id:'
