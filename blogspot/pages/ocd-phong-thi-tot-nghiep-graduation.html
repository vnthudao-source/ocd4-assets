========================================================= */

@media(max-width:760px){

    #ocdGraduationExamPage{
        margin-top:10px;

        padding-left:8px;
        padding-right:8px;
    }

    .exam-hero{
        padding:25px 15px;

        border-radius:16px;
    }

    .exam-hero h1{
        font-size:26px;
    }

    .exam-card{
        padding:15px;

        border-radius:14px;
    }

    .exam-lookup-row{
        display:grid;

        grid-template-columns:1fr;
    }

    .exam-student-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .exam-session-header{
        grid-template-columns:1fr auto;

        gap:8px;

        padding:9px;
    }

    .exam-session-student{
        grid-column:1;
        grid-row:1;
    }

    .exam-timer{
        grid-column:2;
        grid-row:1;

        min-width:92px;

        font-size:17px;
    }

    .exam-pinned-question{
        grid-column:1 / -1;
        grid-row:2;

        border-left:0;
        border-top:3px solid var(--gold);

        padding:7px 9px;
    }

    .exam-pinned-text{
        font-size:12px;
    }

    .exam-tabs{
        grid-template-columns:1fr;
    }

    .practical-list{
        grid-template-columns:1fr;
    }

    .review-grid{
        grid-template-columns:1fr;
    }

    .result-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

}

/* =========================================================
   FIX HTML ENTITY
========================================================= */

function decodeHtmlEntities(value){

    var str=
        String(
            value===undefined ||
            value===null
                ?
                ""
                :
                value
        );

    if(str.indexOf("&")===-1){

        return str;
    }

    try{

        var textarea=
            document.createElement("textarea");

        textarea.innerHTML=
            str;

        return textarea.value;

    }catch(error){

        return str
        .replace(/&#8220;/g,"“")
        .replace(/&#8221;/g,"”")
        .replace(/&#8216;/g,"‘")
        .replace(/&#8217;/g,"’")
        .replace(/&quot;/g,'"')
        .replace(/&amp;/g,"&");
    }
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(value){

    return decodeHtmlEntities(value)
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d")
    .replace(/\s+/g," ");
}

function normalizeCode(value){

    return String(
        value===undefined ||
        value===null
            ? ""
            : value
    )
    .trim()
    .toUpperCase();
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return decodeHtmlEntities(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


/* =========================================================
   RANDOM
========================================================= */

function hashString(str){

    str=
        String(str || "");

    var h=
        2166136261;

    for(
        var i=0;
        i<str.length;
        i++
    ){

        h^=
            str.charCodeAt(i);

        h=
            Math.imul(
                h,
                16777619
            );
    }

    return h>>>0;
}


function createSeededRandom(seed){

    var value=
        seed>>>0;

    return function(){

        value+=
            0x6D2B79F5;

        var t=
            value;

        t=
            Math.imul(
                t^(t>>>15),
                t|1
            );

        t^=
            t+
            Math.imul(
                t^(t>>>7),
                t|61
            );

        return (
            (
                t^(t>>>14)
            )>>>0
        ) /
        4294967296;
    };
}


function shuffleWithRandom(
    array,
    random
){

    var list=
        array.slice();

    for(
        var i=list.length-1;
        i>0;
        i--
    ){

        var j=
            Math.floor(
                random() *
                (i+1)
            );

        var temp=
            list[i];

        list[i]=
            list[j];

        list[j]=
            temp;
    }

    return list;
}

function buildTheoryPaper(
    studentCode,
    startedAt,
    isAdmin
){

    var seedSource=
        CONFIG.theoryBankVersion +
        "|" +
        normalizeCode(
            studentCode
        );

    /*
       ADMIN hoặc THI THỬ:
       thêm thời gian vào seed.

       Reset phiên sẽ nhận bộ câu hỏi khác.
    */

    if(
        isAdmin ||
        CONFIG.trialMode ||
        isUnlimited(
            studentCode
        )
    ){

        seedSource+=
            "|" +
            String(
                startedAt
            );
    }

    var random=
        createSeededRandom(
            hashString(
                seedSource
            )
        );

    var selected=
        shuffleWithRandom(
            THEORY_BANK,
            random
        )
        .slice(
            0,
            CONFIG.theoryTextCount
        );

        /*
       v2.6.0: đề lưu trong máy KHÔNG kèm đáp án đúng.
       Chấm điểm bằng khóa băm trong ngân hàng (isCorrectChoice).
    */
    var textQuestions=
        selected.map(
            function(source,index){

                return {

                    id:
                        index+1,

                    bankId:
                        source.bankId,

                    text:
                        source.text,

                    options:
                        shuffleWithRandom(
                            source.options,
                            random
                        )
                };
            }
        );

    return textQuestions.concat(
        buildImagePaper(
            random,
            CONFIG.theoryTextCount
        )
    );
}

function loadImageBank(){

    if(
        STATE.imageBank &&
        STATE.imageBank.length
    ){

        return Promise.resolve(
            STATE.imageBank
        );
    }

    if(STATE.imageBankTask){

        return STATE.imageBankTask;
    }

    STATE.imageBankTask=
        (async function(){

            var rows=
                parseCSV(
                    await fetchTextRetry(
                        CONFIG.imageBankCsv
                    )
                );

            var heads=
                (rows.shift() || [])
                .map(
                    function(h){

                        return String(h || "").trim();
                    }
                );

            var at=
                function(name){

                    return heads.indexOf(
                        name
                    );
                };

            if(
                heads[0]!=="QuestionID" ||
                at("Prompt")<0 ||
                at("CorrectOption")<0
            ){

                throw new Error(
                    "Sai nguồn ngân hàng câu hỏi hình ảnh."
                );
            }

            var list=[];

            rows.forEach(
                function(r){

                    var get=
                        function(name){

                            return String(
                                r[at(name)] || ""
                            )
                            .trim();
                        };

                    var item={

                        id:
                            get("QuestionID"),

                        prompt:
                            get("Prompt"),

                        image:
                            get("QuestionImageURL"),

                        topic:
                            get("Topic") ||
                            get("QuestionID").replace(/_\d+$/,""),

                        correct:
                            get("CorrectOption").toUpperCase(),

                        status:
                            (get("Status") || "ACTIVE").toUpperCase(),

                        options:
                            ["A","B","C","D"].map(
                                function(k){

                                    return {

                                        letter:k,

                                        label:get("Option"+k),

                                        img:get("Image"+k+"URL")
                                    };
                                }
                            )
                    };

                    if(
                        item.id &&
                        item.prompt &&
                        item.status==="ACTIVE" &&
                        /^[ABCD]$/.test(item.correct) &&
                        item.options.every(
                            function(o){

                                return !!o.img;
                            }
                        )
                    ){

                        list.push(
                            item
                        );
                    }
                }
            );

            if(
                list.length<
                CONFIG.imageCount
            ){

                throw new Error(
                    "Ngân hàng câu hỏi hình ảnh chưa đủ " +
                    CONFIG.imageCount +
                    " câu ACTIVE."
                );
            }

            STATE.imageBank=
                list;

            return list;
        })();

    return STATE.imageBankTask
    .finally(
        function(){

            STATE.imageBankTask=
                null;
        }
    );
}


function imageKey(
    questionId,
    letter

        "OCD-I|" +
        questionId +
        "|" +
        letter
    )
    .toString(36);
}

    var groups={};

    var topics=[];

    bank.forEach(
        function(item){

            if(!groups[item.topic]){

                groups[item.topic]=[];

                topics.push(
                    item.topic
                );
            }

            groups[item.topic].push(
                item
            );
        }
    );

    var picked;

    if(
        topics.length>=
        CONFIG.imageCount
    ){

        /* mỗi chủ đề 1 câu */
        picked=
            shuffleWithRandom(
                topics,
                random
            )
            .slice(
                0,
                CONFIG.imageCount
            )
            .map(
                function(topic){

                    return shuffleWithRandom(
                        groups[topic],
                        random
                    )[0];
                }
            );

    }else{

        picked=
            shuffleWithRandom(
                bank,
                random
            )
            .slice(
                0,
                CONFIG.imageCount
            );
    }

    return picked.map(
        function(item,index){

            return {

                id:
                    offset+index+1,

                type:
                    "image",

                bankId:
                    item.id,

                topic:
                    item.topic,

                text:
                    item.prompt,

                image:
                    item.image,

                /* không lưu đáp án; chỉ lưu khoá băm */
                k:
                    imageKey(
                        item.id,
                        item.correct
                    ),

                options:
                    shuffleWithRandom(
                        item.options,
                        random
                    )
                    .map(
                        function(o){

                            return {

                                letter:o.letter,

                                img:o.img
                            };
                        }
                    )
            };
        }
    );
}


function isCorrectChoice(
    bankId,
    optionText
){

    var source=
        THEORY_BANK.find(
            function(item){

                return (
                    Number(item.bankId)===
                    Number(bankId)
                );
            }
        );

    if(
        !source ||
        optionText===undefined ||
        optionText===null
    ){

        return false;
    }

    return (
        hashString(
            "OCD-K|" +
            source.bankId +
            "|" +
            String(optionText)
        )
        .toString(36)===
        source.key
    );
}


function questionIsCorrect(
    q,
    answer
){

    if(
        answer===undefined ||
        answer===null ||
        !q ||
        !Array.isArray(q.options)
    ){

        return false;
    }

    if(q.type==="image"){

        var chosen=
            q.options[
                Number(answer)
            ];

        return (
            !!chosen &&
            imageKey(
                q.bankId,
                chosen.letter
            )===
            q.k
        );
    }


    return isCorrectChoice(
        q.bankId,
        q.options[
            Number(answer)
        ]
    );
}

/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

    var rows=[];
    var row=[];
    var field="";
    var quoted=false;

    text=
        String(text || "")
        .replace(/^\uFEFF/,"");

    for(
        var i=0;
        i<text.length;
        i++
    ){

        var c=
            text[i];

        if(c==='"'){

            if(
                quoted &&
                text[i+1]==='"'
            ){

                field+='"';

                i++;

            }else{

                quoted=
                    !quoted;
            }

        }else if(
            c==="," &&
            !quoted
        ){

            row.push(field);

            field="";

        }else if(
            (
                c==="\n" ||
                c==="\r"
            ) &&
            !quoted
        ){

            if(
                c==="\r" &&
                text[i+1]==="\n"
            ){

                i++;
            }

            row.push(field);

            if(
                row.some(
                    function(v){

                        return (
                            String(v)
                            .trim()!==""
                        );
                    }
                )
            ){

                rows.push(row);
            }

            row=[];

            field="";

        }else{

            field+=c;
        }
    }

    row.push(field);

    if(
        row.some(
            function(v){

                return (
                    String(v)
                    .trim()!==""
                );
            }
        )
    ){

        rows.push(row);
    }

    return rows;
}


/* =========================================================
   FETCH
========================================================= */

function sleep(ms){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


function fetchWithTimeout(url){

    var controller=
        typeof AbortController!=="undefined"
            ?
            new AbortController()
            :
            null;

    var timeoutHandle=
        controller
            ?
            setTimeout(
                function(){

                    controller.abort();

                },
                CONFIG.timeout
            )
            :
            null;

    return fetch(
        url,
        {
            cache:"no-store",

            signal:
                controller
                    ?
                    controller.signal
                    :
                    undefined
        }
    )
    .then(
        function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status
                );
            }

            return response.text();
        }
    )
    .finally(
        function(){

            if(timeoutHandle){

                clearTimeout(
                    timeoutHandle
                );
            }
        }
    );
}


async function fetchTextRetry(url){

    var lastError=null;

    for(
        var i=0;
        i<2;
        i++
    ){

        try{

            return await fetchWithTimeout(
                url
            );

        }catch(error){

            lastError=
                error;

            if(i===0){

                await sleep(
                    400
                );
            }
        }
    }

    throw lastError;
}


/* =========================================================
   COLUMN
========================================================= */

function findColumn(
    headers,
    aliases
){

    var normalized=
        headers.map(
            normalizeText
        );

    for(
        var i=0;
        i<aliases.length;
        i++
    ){

        var wanted=
            normalizeText(
                aliases[i]
            );

        var exact=
            normalized.indexOf(
                wanted
            );

        if(exact!==-1){

            return exact;
        }
    }

    for(
        var a=0;
        a<aliases.length;
        a++
    ){

        var partial=
            normalizeText(
                aliases[a]
            );

        for(
            var h=0;
            h<normalized.length;
            h++
        ){

            if(
                partial &&
                normalized[h]
                .indexOf(
                    partial
                )!==-1
            ){

                return h;
            }
        }
    }

    return -1;
}


function valueAt(
    row,
    index
){

    if(
        index<0 ||
        !row ||
        index>=row.length
    ){

        return "";
    }

    return decodeHtmlEntities(
        String(
            row[index] || ""

    )
    .trim();
}

/* =========================================================
   DATE
========================================================= */

function parseDateLoose(value){

    if(!value){

        return null;
    }

    var raw=
        String(value)
        .trim();

    /*
       v2.6.0: Sheet dùng định dạng Việt Nam ngày/tháng/năm.
       Đọc dd/mm/yyyy TRƯỚC; trước đây new Date("03/10/2026")
       hiểu thành 10/3 (tháng/ngày) nên bài xoá không khớp,
       danh sách bài nộp xếp sai thứ tự.
    */
    var match=
        raw.match(
            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/
        );

    if(match){

        var date=
            new Date(
                Number(match[3]),
                Number(match[2])-1,
                Number(match[1]),
                Number(match[4] || 0),
                Number(match[5] || 0),
                Number(match[6] || 0)
            );

        if(
            !isNaN(
                date.getTime()
            )
        ){

            return date;
        }
    }

    var direct=
        new Date(raw);

    if(
        !isNaN(
            direct.getTime()
        )
    ){

        return direct;
    }

    return null;
}


function compactTimestamp(value){

    var d=
        parseDateLoose(
            value
        );

    if(!d){

        return normalizeText(value)
        .replace(
            /[^0-9]/g,
            ""
        )
        .slice(
            0,
            14
        );
    }

    function pad(n){

        return String(n)
        .padStart(
            2,
            "0"
        );
    }

    return (
        d.getFullYear() +
        pad(
            d.getMonth()+1
        ) +
        pad(
            d.getDate()
        ) +
        pad(
            d.getHours()
        ) +
        pad(
            d.getMinutes()
        ) +
        pad(
            d.getSeconds()
        )
    );
}


function formatDateTime(value){

    var d=
        new Date(
            value
        );

    if(
        isNaN(
            d.getTime()
        )
    ){

        return String(
            value || ""
        );
    }

    function pad(n){

        return String(n)
        .padStart(
            2,
            "0"
        );
    }

    return (
        pad(
            d.getDate()
        ) +
        "/" +
        pad(
            d.getMonth()+1
        ) +
        "/" +
        d.getFullYear() +
        " " +
        pad(
            d.getHours()
        ) +
        ":" +
        pad(
            d.getMinutes()
        ) +
        ":" +
        pad(
            d.getSeconds()
        )
    );
}


/* =========================================================
   DRIVE
========================================================= */

function driveIdFromUrl(value){

    var str=
        String(value || "")
        .trim();

    if(!str){

        return "";
    }

    var patterns=[

        /\/file\/d\/([a-zA-Z0-9_-]+)/,

        /[?&]id=([a-zA-Z0-9_-]+)/,

        /\/d\/([a-zA-Z0-9_-]+)/
    ];

    for(
        var i=0;
        i<patterns.length;
        i++
    ){

        var match=
            str.match(
                patterns[i]
            );

        if(match){

            return match[1];
        }
    }

    if(
        /^[a-zA-Z0-9_-]{20,}$/
        .test(str)
    ){

        return str;
    }

    return "";
}


function imageUrl(value){

    var RS=
        window.StudentRewardSystem;

    if(
        RS &&
        typeof RS.convertDriveImageUrl===
        "function"
    ){

        try{

            return RS.convertDriveImageUrl(
                value,
                700
            );

        }catch(error){}
    }

    var id=
        driveIdFromUrl(
            value
        );

    if(id){

        return (
            "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(id) +
            "&sz=w700"
        );
    }

    return String(
        value || ""
    );
}

async function findPreviousExam(code){

    if(
        CONFIG.trialMode ||
        normalizeCode(code)===
        CONFIG.adminCode
    ){

        return {

            done:null,

            start:null
        };
    }

    var text=
        await fetchTextRetry(
            examHistoryCsvUrl()
        );

    var rows=
        parseCSV(
            text
        );

    if(!rows.length){

        return null;
    }

    var headers=
        rows[0];

    var examIdCol=
        findColumn(
            headers,
            [
                "Exam ID",
                "examid",
                "exam id"
            ]
        );

    var codeCol=
        findColumn(
            headers,
            [
                "Mã học viên",
                "ma hoc vien",
                "mã hv",
                "ma hv"
            ]
        );

    var nameCol=
        findColumn(
            headers,
            [
                "Họ và tên",
                "ho va ten"
            ]
        );

    var startedCol=
        findColumn(
            headers,
            [
                "Thời gian bắt đầu",
                "thoi gian bat dau"
            ]
        );

    var submittedCol=
        findColumn(
            headers,
            [
                "Thời gian nộp",
                "thoi gian nop"
            ]
        );

    var timestampCol=
        findColumn(
            headers,
            [
                "Dấu thời gian",
                "dau thoi gian"
            ]
        );

    var reasonCol=
        findColumn(
            headers,
            [
                "Hình thức nộp",
                "hinh thuc nop"
            ]
        );

    if(codeCol<0){

        throw new Error(
            "Không xác định được cột Mã học viên trong BaiThiTotNghiep."
        );
    }

    /*
       v2.6.0: tách 2 loại dòng
       - dòng START: ghi lúc bắt đầu thi (đang thi dở)
       - dòng còn lại: bài đã nộp -> khóa lượt thi
    */
    var out={

        done:null,

        start:null
    };

    for(
        var i=rows.length-1;
        i>=1;
        i--
    ){

        var row=
            rows[i];

        if(
            normalizeCode(
                valueAt(
                    row,
                    codeCol
                )
            )===
            normalizeCode(
                code
            )
        ){

            var isStart=
                normalizeCode(
                    valueAt(
                        row,
                        reasonCol
                    )
                )===
                CONFIG.startReason;

            if(
                isStart
                    ?
                    out.start
                    :
                    out.done
            ){

                continue;
            }

            var info={

                isStart:
                    isStart,


                examId:
                    valueAt(
                        row,
                        examIdCol
                    ),

                studentCode:
                    normalizeCode(
                        code
                    ),

                studentName:
                    valueAt(
                        row,
                        nameCol
                    ),

                startedAt:
                    valueAt(
                        row,
                        startedCol
                    ),

                submittedAt:
                    valueAt(
                        row,
                        submittedCol
                    ),

                responseTimestamp:
                    valueAt(
                        row,
                        timestampCol
                    ),

                rowNumber:
                    i+1
            };

            if(isStart){

                out.start=
                    info;

            }else{

                out.done=
                    info;
            }
        }
    }

    /*
       Dòng START nào đã có bài nộp cùng Exam ID thì không còn là
       "đang thi dở".
    */
    if(
        out.start &&
        out.done &&
        out.done.examId &&
        out.done.examId===
        out.start.examId
    ){

        out.start=
            null;
    }

    return out;
}

/*
   v2.7.0: đọc bài nộp qua Apps Script (dữ liệu mới ngay, lọc sẵn theo mã)
   – cùng cách Reward Core đang dùng; lỗi thì quay về CSV công khai
   (CSV công khai có thể chậm vài phút so với Sheet).
*/
async function fetchSubmissionsFromApi(code){

    var key=
        "students:Form Responses 1!";

    var controller=
        typeof AbortController!=="undefined"
            ?
            new AbortController()
            :
            null;

    var timer=
        controller
            ?
            setTimeout(
                function(){

                    controller.abort();
                },
                CONFIG.timeout
            )
            :
            null;

    try{

        var response=
            await fetch(
                CONFIG.appsScriptUrl +
                "?multi=" +
                encodeURIComponent(key) +
                "&code=" +
                encodeURIComponent(code) +
                "&v=449&_=" +
                Date.now(),
                {
                    cache:"no-store",

                    credentials:"omit",

                    signal:
                        controller
                            ?
                            controller.signal
                            :
                            undefined
                }
            );

        var json=
            JSON.parse(
                await response.text()
            );

        if(
            !json ||
            !json.ok ||
            !json.sheets ||
            !Array.isArray(
                json.sheets[key]
            ) ||
            !json.sheets[key].length
        ){

            throw new Error(
                json && json.error ||
                "Apps Script không trả bài nộp."
            );
        }

        var rows=
            json.sheets[key]
            .map(
                function(row){

                    return (row || []).map(
                        function(v){

                            return v===null || v===undefined
                                ?
                                ""
                                :
                                String(v);
                        }
                    );
                }
            );

        if(
            detectSubmissionColumns(
                rows[0]
            ).code<0
        ){

            throw new Error(
                "Apps Script trả sai cấu trúc bài nộp."
            );
        }

        return rows;

    }finally{

        if(timer){

            clearTimeout(
                timer
            );
        }
    }
}

            timestampSort:
                parsedDate

                    i,

            file:
                file,

            note:
                valueAt(
                    row,
                    cols.note
                ) ||
                "Bài tập không có mô tả",

            score:
                parseScore(
                    valueAt(
                        row,
                        cols.score
                    )
                )

        });
    }

    list.sort(
        function(a,b){

            return (
                a.timestampSort -
                b.timestampSort
            );
        }
    );

    return list;
}


/* =========================================================
   DELETE LOG
========================================================= */

async function getDeleteRows(){

    if(STATE.deleteRows){

        return STATE.deleteRows;
    }

    try{

        var text=
            await fetchTextRetry(
                CONFIG.deleteLogCsv
            );

        var parsed=
            parseCSV(
                text
            );

        /*
           v2.6.0: phải đúng là bảng XoaBai (có cột Mã bài nộp),
           không phải trang lỗi / trang đăng nhập của Google.
        */
        if(
            !parsed.length ||
            detectDeleteColumns(
                parsed[0]
            ).submissionId<0
        ){

            throw new Error(
                "XoaBai không đúng cấu trúc."
            );
        }

        STATE.deleteRows=
            parsed;

        return STATE.deleteRows;

    }catch(error){

        console.error(
            error
        );

        /*
           v2.6.0: báo rõ là KHÔNG đọc được danh sách bài đã xoá,
           thay vì im lặng tính cả bài đã xoá.
        */
        return null;
    }
}


function detectDeleteColumns(headers){

    return {

        submissionId:
            findColumn(
                headers,
                [
                    "mã bài nộp",
                    "ma bai nop",
                    "submission id",
                    "submissionid",
                    "mã bài",
                    "ma bai"
                ]
            ),

        action:
            findColumn(
                headers,
                [
                    "hành động",
                    "hanh dong",
                    "thao tác",
                    "thao tac",
                    "trạng thái",
                    "trang thai"
                ]
            ),

        code:
            findColumn(
                headers,
                [
                    "mã học viên",
                    "ma hoc vien"
                ]
            ),

        timestamp:
            findColumn(
                headers,
                [
                    "dấu thời gian",
                    "dau thoi gian",
                    "thời gian",
                    "thoi gian"
                ]
            ),

        file:
            findColumn(
                headers,
                [
                    "file",
                    "bài nộp",
                    "bai nop",
                    "link"
                ]
            )

    };
}


async function applyDeleteLog(
    code,
    submissions
){

    var rows=
        await getDeleteRows();

    if(!rows){

        return {

            valid:
                submissions.slice(),

            removed:
                0,

            failed:
                true
        };
    }

    if(
        rows.length<2
    ){

        return {

            valid:
                submissions.slice(),

            removed:
                0
        };
    }

    var cols=
        detectDeleteColumns(
            rows[0]
        );

    var stateMap={};

    /*
       v2.6.0: khớp thêm theo ID ảnh Drive (duy nhất cho mỗi lần nộp).
       Dòng XoaBai ghi lệch cột (tên nằm ở cột mã) hoặc mã bài nộp
       tạo theo cách đọc ngày khác vẫn khớp đúng bài.
    */
    var fileStateMap={};

    var ownFiles={};

    submissions.forEach(
        function(item){

            var fid=
                driveIdFromUrl(
                    item.file
                );

            if(fid){

                ownFiles[fid]=
                    true;
            }
        }
    );

    for(
        var i=1;
        i<rows.length;
        i++
    ){

        var row=
            rows[i];

        var rowCode=
            normalizeCode(
                valueAt(
                    row,
                    cols.code
                )
            );

        var rawId=
            valueAt(
                row,
                cols.submissionId
            );

        var rowFile=
            driveIdFromUrl(
                String(rawId).split("|").pop()
            ) ||
            driveIdFromUrl(
                valueAt(
                    row,
                    cols.file
                )
            );

        if(
            rowCode &&
            rowCode!==code &&
            !(
                rowFile &&
                ownFiles[rowFile]
            )
        ){

            continue;
        }

        var id=
            rawId;

        if(!id){

            id=
                buildSubmissionId(
                    valueAt(
                        row,
                        cols.timestamp
                    ),
                    code,
                    valueAt(
                        row,
                        cols.file
                    )
                );
        }

        if(!id){

            continue;
        }

        var action=
            normalizeText(
                valueAt(
                    row,
                    cols.action
                )
            );

        var deleted=null;

        if(
            action.indexOf(
                "khoi phuc"
            )!==-1 ||
            action.indexOf(
                "restore"
            )!==-1
        ){

            deleted=
                false;

        }else if(
            action.indexOf(
                "xoa"
            )!==-1 ||
            action.indexOf(
                "delete"
            )!==-1
        ){

            deleted=
                true;
        }

        if(deleted===null){

            continue;
        }

        stateMap[id]=
            deleted;

        if(
            rowFile &&
            ownFiles[rowFile]
        ){

            fileStateMap[rowFile]=
                deleted;
        }
    }

    var valid=[];
    var removed=0;

    submissions.forEach(
        function(item){

            var fid=
                driveIdFromUrl(
                    item.file
                );

            var isDeleted=
                fid &&
                Object.prototype.hasOwnProperty.call(
                    fileStateMap,
                    fid
                )
                    ?
                    fileStateMap[fid]
                    :
                    !!stateMap[
                        item.submissionId
                    ];

            if(isDeleted){

                removed++;

            }else{

                valid.push(
                    item
                );
            }
        }
    );

    return {

        valid:
            valid,

        removed:
            removed
    };
}


/* =========================================================
   METRICS
========================================================= */

function calculateMetrics(submissions){

    var totalScore=0;
    var gradedCount=0;

    submissions.forEach(
        function(item){

            if(
                typeof item.score===
                "number" &&
                Number.isFinite(
                    item.score
                )
            ){

                totalScore+=
                    item.score;

                gradedCount++;
            }
        }
    );

    return {

        submissionCount:
            submissions.length,

        gradedCount:
            gradedCount,

        averageScore:
            gradedCount
                ?
                Math.round(
                    (
                        totalScore /
                        gradedCount
                    ) *
                    100
                ) / 100
                :
                0
    };
}

function friendlyError(error){

    var message=
        error &&
        error.message
            ?
            String(
                error.message
            )
            :
            "";

    if(
        !message ||
        /^HTTP \d+/.test(message) ||
        /abort|Failed to fetch|NetworkError|Load failed/i.test(message)
    ){

        return "Không tải được dữ liệu từ hệ thống (mạng chậm hoặc Google đang bận). Vui lòng thử lại sau ít phút.";
    }

    return message;
}

========================================================= */

/* v2.7.1: tài khoản kiểm thử thi không giới hạn */
function isUnlimited(code){

    return CONFIG.unlimitedCodes.indexOf(
        normalizeCode(
            code
        )
    )!==-1;
}


/* v2.7.0: được dự thi đợt này dù chưa đạt tiêu chuẩn */
function isExempt(identity){

    if(!identity){

        return false;
    }

    return (
        CONFIG.exemptCodes.indexOf(
            normalizeCode(
                identity.code
            )
        )!==-1 ||
        CONFIG.exemptCourses.indexOf(
            String(
                identity.course || ""
            )
            .trim()
        )!==-1
    );
}


async function checkAccount(code){

    var au=
        window.OCDAuth;

    /* Tài khoản kiểm thử (exemptCodes) không cần bảo mật */
    if(
        CONFIG.exemptCodes.indexOf(
            normalizeCode(
                code
            )
        )!==-1
    ){

        return {
            ok:true
        };
    }

    var again=
        function(){

            APP.lookup();
        };

    var official=
        !CONFIG.trialMode;

    if(
        official &&
        CONFIG.requireSecureAccount
    ){

        if(!au){

            return {

                ok:false,

                message:
                    "Chưa tải được hệ thống tài khoản. Vui lòng tải lại trang."
            };
        }

        if(
            au.isMe(
                code
            )
        ){

            return {
                ok:true
            };
        }

        var status=null;

        try{

            status=
                await au.post(
                    "authStatus",
                    {
                        code:code
                    }
                );

        }catch(error){}

        if(
            !status ||
            !status.ok
        ){

            return {

                ok:false,

                message:
                    "Chưa kiểm tra được tài khoản của mã " +
                    code +
                    ". Vui lòng thử lại sau ít phút."
            };
        }

        if(status.protected){

            au.openLogin({

                code:code,

                onSuccess:again
            });

            return {

                ok:false,

                message:
                    "Mã " +
                    code +
                    " đã được bảo mật. Vui lòng đăng nhập để vào phòng thi.",

                button:{

                    text:"ĐĂNG NHẬP",

                    onClick:function(){

                        au.openLogin({

                            code:code,

                            onSuccess:again
                        });
                    }
                }
            };
        }

        return {

            ok:false,

            message:
                "Thi chính thức chỉ dành cho tài khoản đã bảo mật, để không ai thi thay khi biết mã của bạn. " +
                "Bấm NÂNG CẤP BẢO MẬT (xác minh bằng số điện thoại và email đã đăng ký), đặt mật khẩu rồi tra cứu lại.",

            button:{

                text:"NÂNG CẤP BẢO MẬT",

                onClick:function(){

                    au.openUpgrade({

                        code:code,

                        onSuccess:again
                    });
                }
            }
        };
    }

    /* Thi thử: mã đã bảo mật thì phải đăng nhập */
    if(
        au &&
        typeof au.ensureAccess===
        "function"
    ){

        var allowed=false;

        try{

            allowed=
                await au.ensureAccess(
                    code,
                    {
                        onSuccess:again
                    }
                );

        }catch(error){

            allowed=
                true;
        }

        if(!allowed){

            return {

                ok:false,

                message:
                    "Mã " +
                    code +
                    " đã được bảo mật. Vui lòng đăng nhập để vào phòng thi."
            };
        }
    }

    return {
        ok:true
    };
}



/* =========================================================
   LOOKUP
   GIỮ NGUYÊN CƠ CHẾ BẢN ĐANG HOẠT ĐỘNG
========================================================= */

APP.lookup=
async function(){

    var button=
        el(
            "examLookupButton"
        );

    var input=
        el(
            "examStudentCode"
        );

    var code=
        normalizeCode(
            input.value
        );

    if(!code){

        setLookupMessage(
            "Vui lòng nhập mã học viên.",
            "error"
        );

        return false;
    }

    button.disabled=
        true;

    button.textContent=
        "ĐANG TRA CỨU...";

    STATE.previousExam=
        null;

    STATE.remoteStart=
        null;

    setLookupMessage(

        CONFIG.trialMode
            ?
            "Đang tải hồ sơ cho phiên thi thử..."
            :
            "Đang kiểm tra hồ sơ, lịch sử bài nộp và trạng thái dự thi...",

        "loading"
    );

    try{

        /* =================================================
           ADMIN
        ================================================= */

        if(
            code===
            CONFIG.adminCode
        ){

            var adminSubmissions=
                createAdminSubmissions();

            STATE.student={

                code:
                    "ADMIN",

                name:
                    CONFIG.adminName,

                group:
                    "ADMIN",

                course:
                    "TEST",

                submissionCount:
                    adminSubmissions.length,

                gradedCount:
                    adminSubmissions.length,

                averageScore:
                    10,

                isAdmin:
                    true
            };

            STATE.validSubmissions=
                adminSubmissions;

            STATE.removedCount=
                0;

            STATE.previousExam=
                null;

            STATE.eligible=
                true;

            renderCandidate();

            resumeIfNeeded();

            setLookupMessage(
                CONFIG.trialMode
                    ?
                    "Tài khoản kiểm thử - chế độ thi thử đã sẵn sàng."
                    :
                    "Tài khoản kiểm thử đã sẵn sàng.",
                "success"
            );

            return false;
        }


        /* =================================================
           HỌC VIÊN
        ================================================= */

        var results=
            await Promise.all([

                loadStudentIdentity(
                    code
                ),

                loadStudentSubmissions(
                    code
                ),

                findPreviousExam(
                    code
                )

            ]);

        var identity=
            results[0];

        var allSubmissions=
            results[1];

        var history=
            results[2] ||
            {
                done:null,
                start:null
            };

        if(!identity){

            throw new Error(
                "Không tìm thấy mã học viên."
            );
        }


        /* =================================================
           v2.6.0: TÀI KHOẢN BẢO MẬT
           Người khác không thể thi thay khi chỉ biết mã.
        ================================================= */

        var access=
            await checkAccount(
                code
            );

        if(!access.ok){

            STATE.eligible=
                false;

            hideCandidate();

            setLookupMessage(
                access.message,
                "error"
            );

            if(access.button){

                addLookupButton(
                    access.button.text,
                    access.button.onClick
                );
            }

            return false;
        }


        var deleteResult=
            await applyDeleteLog(
                code,
                allSubmissions
            );

        /*
           v2.6.0: không đọc được XoaBai -> thi chính thức dừng lại,
           tránh tính cả bài đã bị loại.
        */
        if(
            deleteResult.failed &&
            !CONFIG.trialMode
        ){

            throw new Error(
                "Không đọc được danh sách bài đã xoá (XoaBai). Vui lòng tải lại trang và thử lại sau ít phút."
            );
        }

        var metrics=
            calculateMetrics(
                deleteResult.valid
            );

        STATE.student={

            code:
                identity.code,

            name:
                identity.name,

            group:
                identity.group,

            course:
                identity.course,

            submissionCount:
                metrics.submissionCount,

            gradedCount:
                metrics.gradedCount,

            averageScore:
                metrics.averageScore,

            isAdmin:
                false
        };

        STATE.validSubmissions=
            deleteResult.valid;

        STATE.removedCount=
            deleteResult.removed;

        STATE.student.unlimited=
            !CONFIG.trialMode &&
            isUnlimited(
                identity.code
            );

        /* Tài khoản kiểm thử: không khoá vì bài cũ, không ép làm tiếp phiên cũ */
        if(STATE.student.unlimited){

            history={
                done:null,
                start:null
            };
        }

        STATE.previousExam=
            history.done;

        STATE.remoteStart=
            history.start;



        if(CONFIG.trialMode){

            STATE.eligible=
                metrics.submissionCount>=
                CONFIG.minPracticalSubmissions;

        }else{

            STATE.student.exempt=
                isExempt(
                    identity
                );

            STATE.eligible=
                (
                    STATE.student.exempt
                        ?
                        metrics.submissionCount>=
                        CONFIG.minPracticalSubmissions
                        :
                        (
                            metrics.averageScore >
                            CONFIG.minAverageExclusive
                        ) &&
                        (
                            metrics.submissionCount >
                            CONFIG.minSubmissionExclusive
                        )
                ) &&
                !history.done;
        }

        renderCandidate();

        resumeIfNeeded();


        if(CONFIG.trialMode){

            setLookupMessage(
                STATE.eligible
                    ?
                    (
                        "Đã xác nhận mã học viên. Chế độ THI THỬ không áp dụng điều kiện điểm trung bình và số bài nộp." +
                        (
                            deleteResult.failed
                                ?
                                " (Chưa đọc được danh sách bài đã xoá, số bài có thể chưa chính xác.)"
                                :
                                ""
                        )
                    )
                    :
                    "Cần ít nhất " +
                    CONFIG.minPracticalSubmissions +
                    " bài nộp để làm phần thực hành.",
                STATE.eligible
                    ?
                    "success"
                    :
                    "error"
            );

        }else if(STATE.student.unlimited){

            setLookupMessage(
                "TÀI KHOẢN KIỂM THỬ: được thi không giới hạn số lần, mỗi lần một đề mới. Bài vẫn được gửi vào hệ thống như bài thật.",
                "success"
            );

        }else if(history.done){

            setLookupMessage(
                "Học viên đã có bài thi trong hệ thống. Không thể tạo thêm phiên thi mới.",
                "error"
            );

        }else if(history.start){

            setLookupMessage(
                "Học viên đang có một phiên thi chưa nộp (bắt đầu lúc " +
                history.start.startedAt +
                "). Bấm TIẾP TỤC BÀI THI để làm tiếp; thời gian vẫn tính từ lúc bắt đầu.",
                "loading"
            );

        }else{

            setLookupMessage(
                "Đã tải dữ liệu học viên và xác nhận chưa có bài thi trước đó.",
                "success"
            );
        }

    }catch(error){

        console.error(
            error
        );

        STATE.eligible=
            false;

        hideCandidate();

        setLookupMessage(
            friendlyError(
                error
            ),
            "error"
        );

    }finally{

        button.disabled=
            false;

        button.textContent=
            "TRA CỨU";
    }

    return false;
};

    )

        ) +

        ) +

        infoBox(

            "-"
        ) +

        infoBox(
            "Bài nộp hợp lệ",
            s.submissionCount
        ) +

        infoBox(
            "Bài đã chấm",
            s.gradedCount
        ) +

        infoBox(
            "Điểm trung bình",
            s.averageScore
        ) +

        infoBox(
            "Bài đã loại",
            STATE.removedCount
        );

    var status=
        el(
            "examEligibility"
        );

        el(

        );

        loadSession();

            )==="active"
        ) ||
        (
            !CONFIG.trialMode &&
            !s.isAdmin &&
            !!STATE.remoteStart
        );


    if(CONFIG.trialMode){

        if(
            !s.isAdmin &&
            !STATE.eligible
        ){

            status.className=

            ?

            "BẮT ĐẦU BÀI THI";

    if(

    ){

                "<strong>Bài của ADMIN chỉ chạy thử trên máy, không gửi vào BaiThiTotNghiep.</strong>";

                "Mỗi học viên chỉ thi một lần.";

/* =========================================================
   STORAGE
========================================================= */

function storageKey(){

    if(!STATE.student){

        return "";
    }

    return (
        CONFIG.storagePrefix +
        normalizeCode(
            STATE.student.code
        )
    );
}


function saveSession(){

    if(
        !STATE.session ||
        !storageKey()
    ){

        return;
    }

    try{

        localStorage.setItem(
            storageKey(),
            JSON.stringify(
                STATE.session
            )
        );

    }catch(error){

        console.warn(
            "Không lưu được phiên thi.",
            error
        );
    }
}


function loadSession(){

    if(!storageKey()){

        return null;
    }

    try{

        var raw=
            localStorage.getItem(
                storageKey()
            );

        return raw
            ?
            JSON.parse(
                raw
            )
            :
            null;

    }catch(error){

        return null;
    }
}


function sessionStatus(session){

    if(!session){

        return "";
    }

    return (
        session.status==="submitted" ||
        session.submitted===true
    )
        ?
        "submitted"
        :
        "active";
}


/* =========================================================
   EXAM ID
========================================================= */

function buildExamId(
    code,
    startedAt
){

    var d=
        new Date(
            startedAt
        );

    function pad(n){

        return String(n)
        .padStart(
            2,
            "0"
        );
    }

    return [

        CONFIG.trialMode
            ?
            "OCD-TRIAL"
            :
            "OCD-EXAM",

        normalizeCode(
            code
        ),

        d.getFullYear() +
        pad(
            d.getMonth()+1
        ) +
        pad(
            d.getDate()
        ) +
        pad(
            d.getHours()
        ) +
        pad(
            d.getMinutes()
        ) +
        pad(
            d.getSeconds()
        )

    ].join("-");
}


/* =========================================================
   ENSURE THEORY PAPER
========================================================= */

function ensureTheoryPaper(){

    if(!STATE.session){

        return;
    }

    /*
       Chỉ chấp nhận đề đủ số câu trắc nghiệm.
       Nếu phiên nào sai số lượng sẽ tạo lại đề.
    */

    if(
        Array.isArray(
            STATE.session.theoryQuestions
        ) &&
        STATE.session.theoryQuestions.length===
        CONFIG.theoryCount
    ){

        return;
    }

    /* v2.7.0: chưa tải được ngân hàng ảnh thì chưa dựng lại đề */
    if(
        !STATE.imageBank ||
        !STATE.imageBank.length
    ){

        return;
    }

    var studentCode=
        STATE.session.student &&
        STATE.session.student.code
            ?
            STATE.session.student.code
            :
            (
                STATE.student
                    ?
                    STATE.student.code
                    :
                    ""
            );

    var isAdmin=
        normalizeCode(
            studentCode
        )===
        CONFIG.adminCode;

    STATE.session.theoryQuestions=
        buildTheoryPaper(
            studentCode,
            STATE.session.startedAt ||
            Date.now(),
            isAdmin
        );

    if(
        !STATE.session.answers
    ){

        STATE.session.answers={};
    }

    STATE.session.answers.theory=
        {};

    STATE.session.lastTheoryIndex=
        0;

    STATE.theoryIndex=
        0;

    saveSession();
}


/* =========================================================
   START
========================================================= */

/*
   v2.6.0: tạo phiên mới (dùng chung cho bắt đầu mới và
   dựng lại phiên từ dòng START ở thiết bị khác)
*/
function createSession(
    startedAt,
    examId
){

    return {

        version:
            CONFIG.version,

        isTrial:
            CONFIG.trialMode,

        theoryBankVersion:
            CONFIG.theoryBankVersion,

        examId:
            examId ||
            buildExamId(
                STATE.student.code,
                startedAt
            ),

        student:{

            code:
                STATE.student.code,

            name:
                STATE.student.name,

            group:
                STATE.student.group,

            course:
                STATE.student.course
        },

        theoryQuestions:
            buildTheoryPaper(
                STATE.student.code,
                startedAt,
                !!STATE.student.isAdmin
            ),

        startedAt:
            startedAt,

        endAt:
            startedAt +
            CONFIG.durationMs,

        status:
            "active",

        submitted:
            false,

        answers:{

            theory:{},

            practical:{}
        },

        lastSection:
            "theory",

        lastTheoryIndex:
            0,

        lastPracticalIndex:
            0,

        result:
            null,

        remoteSave:{

            status:
                CONFIG.trialMode
                    ?
                    "trial_not_sent"
                    :
                    "not_sent",

            attempts:
                0,

            lastAttemptAt:
                null,

            sentAt:
                null
        }
    };
}


/* Thời điểm bắt đầu lấy từ Exam ID (OCD-EXAM-MÃ-yyyymmddhhmmss) */
function startTimeFromRemote(info){

    var m=
        String(
            info &&
            info.examId ||
            ""
        )
        .match(
            /(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/
        );

    if(m){

        return new Date(
            Number(m[1]),
            Number(m[2])-1,
            Number(m[3]),
            Number(m[4]),
            Number(m[5]),
            Number(m[6])
        )
        .getTime();
    }

    var d=
        parseDateLoose(
            info &&
            info.startedAt
        );

    return d
        ?
        d.getTime()
        :
        null;
}


async function ensureImageBank(){

            ) +
            ")",

        );

    }
}


function lockAsFinished(existing){

    STATE.previousExam=
        existing;

    STATE.eligible=
        false;

    renderCandidate();

    setLookupMessage(

        "error"
    );
}


APP.start=
async function(){

    if(
        !STATE.student ||
        STATE.startChecking
    ){

        return false;
    }

    var startButton=
        el(
            "examStartButton"
        );

    var official=
        !CONFIG.trialMode &&
        !STATE.student.isAdmin;

    var old=
        loadSession();

    if(
        old &&
        sessionStatus(
            old
        )===
        "submitted"
    ){

        STATE.session=
            old;

        openResultScreen();

        return false;
    }

    if(
        !official
    ){

        if(
            old &&
            sessionStatus(
                old
            )===
            "active"
        ){

            STATE.session=
                old;

            ensureTheoryPaper();

            openExamScreen();

            return false;
        }

        if(
            CONFIG.trialMode &&
            !STATE.student.isAdmin &&
            !STATE.eligible
        ){

            return false;
        }

        if(
            !(await ensureImageBank())
        ){

            return false;
        }

        STATE.session=
            createSession(
                Date.now()
            );

        saveSession();

        openExamScreen();

        return false;
    }


    /* ================= THI CHÍNH THỨC ================= */

    if(
        !STATE.eligible &&
        !(
            old &&
            sessionStatus(
                old
            )===
            "active"
        )
    ){

        return false;
    }

    STATE.startChecking=
        true;

    if(startButton){

        startButton.disabled=
            true;

        startButton.textContent=
            "ĐANG XÁC MINH LẦN CUỐI...";
    }

    var opened=false;

    try{

        var history=
            await findPreviousExam(
                STATE.student.code
            );

        if(STATE.student.unlimited){

            history={
                done:null,
                start:null
            };
        }

        if(history.done){

            lockAsFinished(
                history.done
            );

            return false;
        }


        /* Phiên đang làm dở trên chính máy này */
        if(
            old &&
            sessionStatus(
                old
            )===
            "active"
        ){

            STATE.session=
                old;

            ensureTheoryPaper();

            opened=true;

            openExamScreen();

            return false;
        }


        if(
            !(await ensureImageBank())
        ){

            return false;
        }

        /*
           Đã bắt đầu ở thiết bị khác: làm tiếp đúng phiên đó,
           thời gian tính từ lúc bắt đầu (không có đề mới / giờ mới).
        */
        if(history.start){

            var remoteStartedAt=
                startTimeFromRemote(
                    history.start
                );

            if(!remoteStartedAt){

                throw new Error(
                    "Không đọc được thời điểm bắt đầu của phiên thi trước."
                );
            }

            STATE.session=
                createSession(
                    remoteStartedAt,
                    history.start.examId
                );

            STATE.session.startRecorded=
                true;

            STATE.session.resumedFromRemote=
                true;

            saveSession();

            opened=true;

            openExamScreen();

            return false;
        }


        /* Bắt đầu mới: ghi lượt START trước khi mở đề */
        if(startButton){

            startButton.textContent=
                "ĐANG GHI NHẬN LƯỢT THI...";
        }

        var session=
            createSession(
                Date.now()
            );

        var recorded=
            await postForm(
                startPayload(
                    session
                )
            );

        if(!recorded){

            setLookupMessage(
                "Chưa ghi nhận được lượt bắt đầu thi (mạng không ổn định). Đề thi chưa được mở – vui lòng kiểm tra mạng rồi bấm BẮT ĐẦU lại.",
                "error"
            );

            return false;
        }

        session.startRecorded=
            true;

        STATE.session=
            session;

        saveSession();

        opened=true;

        openExamScreen();

        return false;

    }catch(error){

        console.error(
            error
        );

        setLookupMessage(
            "Không thể xác minh trạng thái dự thi. Hệ thống tạm thời chưa cho bắt đầu để tránh tạo bài thi trùng. " +
            friendlyError(
                error
            ),
            "error"
        );

        return false;

    }finally{

        STATE.startChecking=
            false;

        if(
            startButton &&
            !opened &&
            !STATE.previousExam
        ){

            startButton.disabled=
                false;

            renderCandidate();
        }
    }
};


/* =========================================================
   RESUME
========================================================= */

function resumeIfNeeded(){

    var old=
        loadSession();

    if(!old){

        return;
    }

    STATE.session=
        old;

    if(
        sessionStatus(
            old
        )===
        "submitted"
    ){

        openResultScreen();

        return;
    }

    ensureTheoryPaper();
}


/* =========================================================
   EXAM SCREEN
========================================================= */

function openExamScreen(){

    if(!STATE.session){

        return;
    }

    ensureTheoryPaper();

    var currentTheory=
        theoryQuestions();

    el(
        "examLookupPanel"
    )
    .classList
    .add(
        "exam-hidden"
    );

    el(
        "examCandidatePanel"
    )
    .classList
    .add(
        "exam-hidden"
    );

    el(
        "examResultPanel"
    )
    .classList
    .add(
        "exam-hidden"
    );

    el(
        "examSessionPanel"
    )
    .classList
    .remove(
        "exam-hidden"
    );

    el(
        "examMiniName"
    )
    .textContent=
        STATE.student.name;

    el(
        "examMiniCode"
    )
    .textContent=
        STATE.student.code +
        (
            CONFIG.trialMode
                ?
                " - THI THỬ"
                :
                ""
        );

    STATE.theoryIndex=
        Math.max(
            0,
            Math.min(
                Number(
                    STATE.session
                    .lastTheoryIndex ||
                    0
                ),
                currentTheory.length-1
            )
        );

    STATE.practicalIndex=
        Math.max(
            0,
            Math.min(
                Number(
                    STATE.session
                    .lastPracticalIndex ||
                    0
                ),
                PRACTICAL_QUESTIONS.length-1
            )
        );

    startTimer();

    var section=
        STATE.session
        .lastSection ||
        "theory";

    if(
        section===
        "practical"
    ){

        APP.openPractical();

    }else if(
        section===
        "review"
    ){

        APP.openReview();

    }else{

        APP.openTheory();
    }
}


/* =========================================================
   TIMER
========================================================= */

function stopTimer(){

    if(
        STATE.timerHandle
    ){

        clearInterval(
            STATE.timerHandle
        );

        STATE.timerHandle=
            null;
    }
}


function startTimer(){

    stopTimer();

    updateTimer();

    STATE.timerHandle=
        setInterval(
            updateTimer,
            1000
        );
}


function updateTimer(){

    if(
        !STATE.session ||
        sessionStatus(
            STATE.session
        )===
        "submitted"
    ){

        stopTimer();

        return;
    }

    var remain=
        Number(
            STATE.session.endAt
        ) -
        Date.now();

    if(remain<=0){

        el(
            "examTimer"
        )
        .textContent=
            "00:00";

        stopTimer();

        finalizeExam(
            true
        );

        return;
    }

    var seconds=
        Math.floor(
            remain/1000
        );

    var minutes=
        Math.floor(
            seconds/60
        );

    seconds=
        seconds%60;

    el(
        "examTimer"
    )
    .textContent=
        String(
            minutes
        )
        .padStart(
            2,
            "0"
        ) +
        ":" +
        String(
            seconds
        )
        .padStart(
            2,
            "0"
        );

    el(
        "examTimer"
    )
    .classList
    .toggle(
        "warning",
        remain<=
        5*60*1000
    );
}


/* =========================================================
   PIN QUESTION
========================================================= */

function updatePinnedQuestion(){

    var box=
        el(
            "examPinnedQuestionText"
        );

    if(!box){

        return;
    }

    if(!STATE.session){

        box.textContent=
            "-";

        return;
    }

    var section=
        STATE.session.lastSection ||
        "theory";

    if(
        section===
        "theory"
    ){

        var questions=
            theoryQuestions();

        var theory=
            questions[
                STATE.theoryIndex
            ];

        if(theory){

            box.textContent=
                "Câu " +
                theory.id +
                ": " +
                decodeHtmlEntities(
                    theory.text
                );

        }else{

            box.textContent=
                "Phần lý thuyết";
        }

        return;
    }

    if(
        section===
        "practical"
    ){

        var practical=
            PRACTICAL_QUESTIONS[
                STATE.practicalIndex
            ];

        if(practical){

            box.textContent=
                "Câu " +
                practical.id +
                ": " +
                decodeHtmlEntities(
                    practical.text
                );

        }else{

            box.textContent=
                "Phần thực hành";
        }

        return;
    }

    box.textContent=
        "Rà soát toàn bộ bài thi và xác nhận nộp bài.";
}


/* =========================================================
   TABS
========================================================= */

function activateTab(name){

    var names=[
        "Theory",
        "Practical",
        "Review"
    ];

    names.forEach(
        function(item){

            var lower=
                item.toLowerCase();

            el(
                "examTab" +
                item
            )
            .classList
            .toggle(
                "active",
                lower===name
            );

            el(
                "exam" +
                item +
                "Panel"
            )
            .classList
            .toggle(
                "exam-hidden",
                lower!==name
            );
        }
    );

    if(STATE.session){

        STATE.session.lastSection=
            name;

        saveSession();
    }

    updatePinnedQuestion();
}

/* =========================================================
   THEORY
========================================================= */

function theoryAnswers(){

    if(!STATE.session.answers){

        STATE.session.answers={};
    }

    if(
        !STATE.session
        .answers
        .theory
    ){

        STATE.session
        .answers
        .theory={};
    }

    return STATE.session
        .answers
        .theory;
}


function theoryCount(){

    var answers=
        theoryAnswers();

    return Object.keys(
        answers
    )
    .filter(
        function(key){

            return (
                answers[key] !==
                undefined &&
                answers[key] !==
                null
            );
        }
    )
    .length;
}


function renderTheory(){

    var questions=
        theoryQuestions();

    var q=
        questions[
            STATE.theoryIndex
        ];

    if(!q){

        return;
    }

    var answers=
        theoryAnswers();

    var selected=
        answers[
            String(
                q.id
            )
        ];

    var isLastTheory=
        STATE.theoryIndex===
        questions.length-1;

    var html=

        '<div class="exam-question-head">' +

            '<div>' +

                '<div class="exam-question-number">' +
                    'CÂU ' +
                    q.id +
                    (
                        q.type==="image"
                            ?
                            ' · CÂU HỎI HÌNH ẢNH'
                            :
                            ''
                    ) +
                '</div>' +
                '<h2 class="exam-question-title">' +
                    escapeHtml(
                        q.text
                    ) +
                '</h2>' +
            '</div>' +
            '<div class="exam-progress">' +
                theoryCount() +
                '/' +
                CONFIG.theoryCount +

APP.goTheory=

        index<0 ||
        index>=questions.length
    ){

        return false;
    }

    STATE.theoryIndex=
        index;

    STATE.session

        STATE.theoryIndex;

    saveSession();

    renderTheory();

    return false;

APP.previousTheory=
function(){

    if(
        STATE.theoryIndex>0
    ){

        STATE.theoryIndex--;

        STATE.session
        .lastTheoryIndex=
            STATE.theoryIndex;

        saveSession();

        renderTheory();
    }

    return false;
};


APP.nextTheory=
function(){

    var questions=
        theoryQuestions();

    if(
        STATE.theoryIndex<
        questions.length-1
    ){

        STATE.theoryIndex++;

        STATE.session
        .lastTheoryIndex=
            STATE.theoryIndex;

        saveSession();

        renderTheory();

        return false;
    }

    STATE.practicalIndex=
        Math.max(
            0,
            Math.min(
                Number(
                    STATE.session
                    .lastPracticalIndex ||
                    0
                ),
                PRACTICAL_QUESTIONS.length-1
            )
        );

    return false;

/* =========================================================
   PRACTICAL ANSWERS
========================================================= */

function practicalAnswers(){

    if(!STATE.session.answers){

        STATE.session.answers={};
    }

    if(
        !STATE.session
        .answers
        .practical
    ){

        STATE.session
        .answers
        .practical={};
    }

    return STATE.session
        .answers
        .practical;
}


function practicalCount(){

    var answers=
        practicalAnswers();

    return Object.keys(
        answers
    )
    .filter(
        function(key){

            return !!answers[key];
        }
    )
    .length;
}


/* =========================================================
   USED SUBMISSIONS
========================================================= */

function usedSubmissionMap(){

    var map={};

    var answers=
        practicalAnswers();

    Object.keys(
        answers
    )
    .forEach(
        function(questionId){

            var answer=
                answers[
                    questionId
                ];

            if(
                answer &&
                answer.submissionId
            ){

                map[
                    answer.submissionId
                ]=
                    Number(
                        questionId
                    );
            }
        }
    );

    return map;
}


/*
   v2.7.0: câu 31 = bài nộp TRƯỚC lúc bắt đầu thi,
           câu 32 = bài nộp SAU lúc bắt đầu thi (sáng tác tại chỗ)
*/
function practicalAllowed(
    q,
    item
){

    var start=
        STATE.session &&
        Number(
            STATE.session.startedAt
        );

    if(
        !q ||
        !start
    ){

        return true;
    }

    var t=
        Number(
            item.timestampSort
        );

    var known=
        Number.isFinite(t) &&
        t>1000000000000;

    if(q.mode==="live"){

        return (
            known &&
            t>=start-CONFIG.liveToleranceMs
        );
    }

    if(q.mode==="history"){

        return (
            !known ||
            t<start-CONFIG.liveToleranceMs
        );
    }

    return true;
}

   v2.8.0: CÂU 32 – TẢI ẢNH THẲNG LÊN BÀI THI (Apps Script ChamThi.gs)
========================================================= */

function readFileAsDataUrl(file){

    return new Promise(
        function(resolve,reject){

            var r=
                new FileReader();

            r.onload=
                function(){

                    resolve(
                        r.result
                    );
                };

            r.onerror=
                reject;

            r.readAsDataURL(
                file
            );
        }
    );
}


function loadImageFrom(url){

    return new Promise(
        function(resolve,reject){

            var img=
                new Image();

            img.onload=
                function(){

                    resolve(
                        img
                    );
                };

            img.onerror=
                reject;

            img.src=
                url;
        }
    );
}


/* Thu nhỏ ảnh (cạnh dài tối đa 2000px, JPEG) giống trang Nộp bài */
async function prepareUploadImage(file){

    var raw=
        await readFileAsDataUrl(
            file
        );

    try{

        var img=
            await loadImageFrom(
                raw
            );

        var w=
            img.naturalWidth;

        var h=
            img.naturalHeight;

        if(
            !w ||
            !h
        ){

            return raw;
        }

        var k=
            Math.min(
                1,
                CONFIG.uploadMaxSide /
                Math.max(w,h)
            );

        var canvas=
            document.createElement(
                "canvas"
            );

        canvas.width=
            Math.round(w*k);

        canvas.height=
            Math.round(h*k);

        var ctx=
            canvas.getContext(
                "2d"
            );

        ctx.fillStyle=
            "#fff";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        return canvas.toDataURL(
            "image/jpeg",
            CONFIG.uploadQuality
        );

    }catch(error){

        /* trình duyệt không đọc được (vd HEIC) -> gửi ảnh gốc */
        return raw;
    }
}

async function postExamUpload(payload){

    var controller=
        new AbortController();

    var timer=
        setTimeout(
            function(){

                controller.abort();
            },
            120000
        );

    try{

        var response=
            await fetch(
                CONFIG.examUploadUrl,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(
                            payload
                        ),

                    credentials:"omit",

                    cache:"no-store",

                    signal:
                        controller.signal
                }
            );

        return JSON.parse(
            await response.text()
        );

    }catch(error){

        return {

            ok:false,

            network:true,

            error:
                error &&
                error.name==="AbortError"
                    ?
                    "Tải ảnh quá lâu, vui lòng kiểm tra mạng rồi bấm lại (ảnh trùng sẽ không bị lưu hai lần)."
                    :
                    "Không kết nối được máy chủ, vui lòng kiểm tra mạng rồi bấm lại."
        };

    }finally{

        clearTimeout(
            timer
        );
    }
}
