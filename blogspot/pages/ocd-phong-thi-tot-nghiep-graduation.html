/* =========================================================
   FIX HTML ENTITY
========================================================= */

function decodeHtmlEntities(value){

    var str=
        String(
            value===undefined ||
            value===null
                ?
                ""
                :
                value
        );

    if(str.indexOf("&")===-1){

        return str;
    }

    try{

        var textarea=
            document.createElement("textarea");

        textarea.innerHTML=
            str;

        return textarea.value;

    }catch(error){

        return str
        .replace(/&#8220;/g,"“")
        .replace(/&#8221;/g,"”")
        .replace(/&#8216;/g,"‘")
        .replace(/&#8217;/g,"’")
        .replace(/&quot;/g,'"')
        .replace(/&amp;/g,"&");
    }
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(value){

    return decodeHtmlEntities(value)
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d")
    .replace(/\s+/g," ");
}

function normalizeCode(value){

    return String(
        value===undefined ||
        value===null
            ? ""
            : value
    )
    .trim()
    .toUpperCase();
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return decodeHtmlEntities(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


/* =========================================================
   RANDOM
========================================================= */

function hashString(str){

    str=
        String(str || "");

    var h=
        2166136261;

    for(
        var i=0;
        i<str.length;
        i++
    ){

        h^=
            str.charCodeAt(i);

        h=
            Math.imul(
                h,
                16777619
            );
    }

    return h>>>0;
}


function createSeededRandom(seed){

    var value=
        seed>>>0;

    return function(){

        value+=
            0x6D2B79F5;

        var t=
            value;

        t=
            Math.imul(
                t^(t>>>15),
                t|1
            );

        t^=
            t+
            Math.imul(
                t^(t>>>7),
                t|61
            );

        return (
            (
                t^(t>>>14)
            )>>>0
        ) /
        4294967296;
    };
}


function shuffleWithRandom(
    array,
    random
){

    var list=
        array.slice();

    for(
        var i=list.length-1;
        i>0;
        i--
    ){

        var j=
            Math.floor(
                random() *
                (i+1)
            );

        var temp=
            list[i];

        list[i]=
            list[j];

        list[j]=
            temp;
    }

    return list;
}

   BUILD THEORY PAPER
   RÚT 20/35 CÂU

function buildTheoryPaper(
    studentCode,
    startedAt,
    isAdmin
){

    var seedSource=
        CONFIG.theoryBankVersion +
        "|" +
        normalizeCode(
            studentCode
        );

    /*
       ADMIN hoặc THI THỬ:
       thêm thời gian vào seed.

       Reset phiên sẽ nhận bộ câu hỏi khác.
    */

    if(
        isAdmin ||
        CONFIG.trialMode
    ){

        seedSource+=
            "|" +
            String(
                startedAt
            );
    }

    var random=
        createSeededRandom(
            hashString(
                seedSource
            )
        );

    var selected=
        shuffleWithRandom(
            THEORY_BANK,
            random
        )
        .slice(
            0,
            CONFIG.theoryCount
        );

    return selected.map(
        function(source,index){

            var optionObjects=
                source.options.map(
                    function(text,optionIndex){

                        return {

                            text:
                                text,

                            isCorrect:
                                optionIndex===
                                source.correct
                        };
                    }
                );

            optionObjects=
                shuffleWithRandom(
                    optionObjects,
                    random
                );

            var newCorrect=
                optionObjects.findIndex(
                    function(item){

                        return !!item.isCorrect;
                    }
                );

            return {

                id:
                    index+1,

                bankId:
                    source.bankId,

                text:
                    source.text,

                options:
                    optionObjects.map(
                        function(item){

                            return item.text;
                        }
                    ),

                correct:
                    newCorrect
            };
        }
    );
}

/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

    var rows=[];
    var row=[];
    var field="";
    var quoted=false;

    text=
        String(text || "")
        .replace(/^\uFEFF/,"");

    for(
        var i=0;
        i<text.length;
        i++
    ){

        var c=
            text[i];

        if(c==='"'){

            if(
                quoted &&
                text[i+1]==='"'
            ){

                field+='"';

                i++;

            }else{

                quoted=
                    !quoted;
            }

        }else if(
            c==="," &&
            !quoted
        ){

            row.push(field);

            field="";

        }else if(
            (
                c==="\n" ||
                c==="\r"
            ) &&
            !quoted
        ){

            if(
                c==="\r" &&
                text[i+1]==="\n"
            ){

                i++;
            }

            row.push(field);

            if(
                row.some(
                    function(v){

                        return (
                            String(v)
                            .trim()!==""
                        );
                    }
                )
            ){

                rows.push(row);
            }

            row=[];

            field="";

        }else{

            field+=c;
        }
    }

    row.push(field);

    if(
        row.some(
            function(v){

                return (
                    String(v)
                    .trim()!==""
                );
            }
        )
    ){

        rows.push(row);
    }

    return rows;
}


/* =========================================================
   FETCH
========================================================= */

function sleep(ms){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


function fetchWithTimeout(url){

    var controller=
        typeof AbortController!=="undefined"
            ?
            new AbortController()
            :
            null;

    var timeoutHandle=
        controller
            ?
            setTimeout(
                function(){

                    controller.abort();

                },
                CONFIG.timeout
            )
            :
            null;

    return fetch(
        url,
        {
            cache:"no-store",

            signal:
                controller
                    ?
                    controller.signal
                    :
                    undefined
        }
    )
    .then(
        function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status
                );
            }

            return response.text();
        }
    )
    .finally(
        function(){

            if(timeoutHandle){

                clearTimeout(
                    timeoutHandle
                );
            }
        }
    );
}


async function fetchTextRetry(url){

    var lastError=null;

    for(
        var i=0;
        i<2;
        i++
    ){

        try{

            return await fetchWithTimeout(
                url
            );

        }catch(error){

            lastError=
                error;

            if(i===0){

                await sleep(
                    400
                );
            }
        }
    }

    throw lastError;
}


/* =========================================================
   COLUMN
========================================================= */

function findColumn(
    headers,
    aliases
){

    var normalized=
        headers.map(
            normalizeText
        );

    for(
        var i=0;
        i<aliases.length;
        i++
    ){

        var wanted=
            normalizeText(
                aliases[i]
            );

        var exact=
            normalized.indexOf(
                wanted
            );

        if(exact!==-1){

            return exact;
        }
    }

    for(
        var a=0;
        a<aliases.length;
        a++
    ){

        var partial=
            normalizeText(
                aliases[a]
            );

        for(
            var h=0;
            h<normalized.length;
            h++
        ){

            if(
                partial &&
                normalized[h]
                .indexOf(
                    partial
                )!==-1
            ){

                return h;
            }
        }
    }

    return -1;
}


function valueAt(
    row,
    index
){

    if(
        index<0 ||
        !row ||
        index>=row.length
    ){

        return "";
    }

    return decodeHtmlEntities(
        String(
            row[index] || ""
        )
    )
    .trim();
}

function parseScore(value){

        .trim()
        .replace(",",".")
        .replace(

            ""
        );

    if(!str){

    }

    var number=

    return Number.isFinite(number)

}


/* =========================================================
   DATE
========================================================= */

function parseDateLoose(value){

    if(!value){

        return null;
    }

    var raw=
        String(value)
        .trim();

    var direct=
        new Date(raw);

    if(
        !isNaN(
            direct.getTime()
        )
    ){

        return direct;
    }

    var match=
        raw.match(
            /(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/
        );

    if(match){

        var date=
            new Date(
                Number(match[3]),
                Number(match[2])-1,
                Number(match[1]),
                Number(match[4] || 0),
                Number(match[5] || 0),
                Number(match[6] || 0)
            );

        if(
            !isNaN(
                date.getTime()
            )
        ){

            return date;
        }
    }

    return null;
}


function compactTimestamp(value){

    var d=
        parseDateLoose(
            value
        );

    if(!d){

        return normalizeText(value)
        .replace(
            /[^0-9]/g,
            ""
        )
        .slice(
            0,
            14
        );
    }

    function pad(n){

        return String(n)
        .padStart(
            2,
            "0"
        );
    }

    return (
        d.getFullYear() +
        pad(
            d.getMonth()+1
        ) +
        pad(
            d.getDate()
        ) +
        pad(
            d.getHours()
        ) +
        pad(
            d.getMinutes()
        ) +
        pad(
            d.getSeconds()
        )
    );
}


function formatDateTime(value){

    var d=
        new Date(
            value
        );

    if(
        isNaN(
            d.getTime()
        )
    ){

        return String(
            value || ""
        );
    }

    function pad(n){

        return String(n)
        .padStart(
            2,
            "0"
        );
    }

    return (
        pad(
            d.getDate()
        ) +
        "/" +
        pad(
            d.getMonth()+1
        ) +
        "/" +
        d.getFullYear() +
        " " +
        pad(
            d.getHours()
        ) +
        ":" +
        pad(
            d.getMinutes()
        ) +
        ":" +
        pad(
            d.getSeconds()
        )
    );
}


/* =========================================================
   DRIVE
========================================================= */

function driveIdFromUrl(value){

    var str=
        String(value || "")
        .trim();

    if(!str){

        return "";
    }

    var patterns=[

        /\/file\/d\/([a-zA-Z0-9_-]+)/,

        /[?&]id=([a-zA-Z0-9_-]+)/,

        /\/d\/([a-zA-Z0-9_-]+)/
    ];

    for(
        var i=0;
        i<patterns.length;
        i++
    ){

        var match=
            str.match(
                patterns[i]
            );

        if(match){

            return match[1];
        }
    }

    if(
        /^[a-zA-Z0-9_-]{20,}$/
        .test(str)
    ){

        return str;
    }

    return "";
}


function imageUrl(value){

}

/* =========================================================
   LOAD STUDENT SUBMISSIONS
========================================================= */

async function loadStudentSubmissions(code){

    var text=
        await fetchTextRetry(
            submissionCsvUrl()
        );

    var rows=
        parseCSV(
            text
        );

    if(rows.length<2){

        return [];
    }

    var headers=
        rows[0];

    var cols=
        detectSubmissionColumns(
            headers
        );

    if(cols.code<0){

        throw new Error(
            "Không tìm thấy mã học viên trong lịch sử bài nộp."
        );
    }

    var list=[];

    for(
        var i=1;
        i<rows.length;
        i++
    ){

        var row=
            rows[i];

        if(
            normalizeCode(
                valueAt(
                    row,
                    cols.code
                )
            )!==
            code
        ){

            continue;
        }

        var timestamp=
            valueAt(
                row,
                cols.timestamp
            );

        var file=
            valueAt(
                row,
                cols.file
            );

        var explicitId=
            valueAt(
                row,
                cols.submissionId
            );

        var parsedDate=
            parseDateLoose(
                timestamp
            );

        list.push({

            submissionId:
                explicitId ||
                buildSubmissionId(
                    timestamp,
                    code,
                    file
                ),

            studentCode:
                code,

            timestamp:
                timestamp,

            timestampSort:
                parsedDate
                    ?
                    parsedDate.getTime()
                    :
                    i,

            file:
                file,

            note:
                valueAt(
                    row,
                    cols.note
                ) ||
                "Bài tập không có mô tả",

            score:
                parseScore(
                    valueAt(
                        row,
                        cols.score
                    )
                )

        });
    }

    list.sort(
        function(a,b){

            return (
                a.timestampSort -
                b.timestampSort
            );
        }
    );

    return list;
}

async function applyDeleteLog(
    code,
    submissions
){

    var rows=
        await getDeleteRows();

    if(
        !rows ||
        rows.length<2
    ){

        return {

            valid:
                submissions.slice(),

            removed:
                0
        };
    }

    var cols=
        detectDeleteColumns(
            rows[0]
        );

    var stateMap={};

    for(
        var i=1;
        i<rows.length;
        i++
    ){

        var row=
            rows[i];

        var rowCode=
            normalizeCode(
                valueAt(
                    row,
                    cols.code
                )
            );

        if(
            rowCode &&
            rowCode!==code
        ){

            continue;
        }

        var id=
            valueAt(
                row,
                cols.submissionId
            );

        if(!id){

            id=
                buildSubmissionId(
                    valueAt(
                        row,
                        cols.timestamp
                    ),
                    code,
                    valueAt(
                        row,
                        cols.file
                    )
                );
        }

        if(!id){

            continue;
        }

        var action=
            normalizeText(
                valueAt(
                    row,
                    cols.action
                )
            );

        if(
            action.indexOf(
                "khoi phuc"
            )!==-1 ||
            action.indexOf(
                "restore"
            )!==-1
        ){

            stateMap[id]=
                false;

        }else if(
            action.indexOf(
                "xoa"
            )!==-1 ||
            action.indexOf(
                "delete"
            )!==-1
        ){

            stateMap[id]=
                true;
        }
    }

    var valid=[];
    var removed=0;

    submissions.forEach(
        function(item){

            if(
                stateMap[
                    item.submissionId
                ]
            ){

                removed++;

            }else{

                valid.push(
                    item
                );
            }
        }
    );

    return {

        valid:
            valid,

        removed:
            removed
    };
}


/* =========================================================
   METRICS
========================================================= */

function calculateMetrics(submissions){

    var totalScore=0;
    var gradedCount=0;

    submissions.forEach(
        function(item){

            if(
                typeof item.score===
                "number" &&
                Number.isFinite(
                    item.score
                )
            ){

                totalScore+=
                    item.score;

                gradedCount++;
            }
        }
    );

    return {

        submissionCount:
            submissions.length,

        gradedCount:
            gradedCount,

        averageScore:
            gradedCount
                ?
                Math.round(
                    (
                        totalScore /
                        gradedCount
                    ) *
                    100
                ) / 100
                :
                0
    };
}

/* =========================================================
   LOOKUP
   GIỮ NGUYÊN CƠ CHẾ BẢN ĐANG HOẠT ĐỘNG
========================================================= */

APP.lookup=
async function(){

    var button=
        el(
            "examLookupButton"
        );

    var input=
        el(
            "examStudentCode"
        );

    var code=
        normalizeCode(
            input.value
        );

    if(!code){

        setLookupMessage(
            "Vui lòng nhập mã học viên.",
            "error"
        );

        return false;
    }

    button.disabled=
        true;

    button.textContent=
        "ĐANG TRA CỨU...";

    STATE.previousExam=
        null;

    setLookupMessage(

        CONFIG.trialMode
            ?
            "Đang tải hồ sơ cho phiên thi thử..."
            :
            "Đang kiểm tra hồ sơ, lịch sử bài nộp và trạng thái dự thi...",

        "loading"
    );

    try{

        /* =================================================
           ADMIN
        ================================================= */

        if(
            code===
            CONFIG.adminCode
        ){

            var adminSubmissions=
                createAdminSubmissions();

            STATE.student={

                code:
                    "ADMIN",

                name:
                    CONFIG.adminName,

                group:
                    "ADMIN",

                course:
                    "TEST",

                submissionCount:
                    adminSubmissions.length,

                gradedCount:
                    adminSubmissions.length,

                averageScore:
                    10,

                isAdmin:
                    true
            };

            STATE.validSubmissions=
                adminSubmissions;

            STATE.removedCount=
                0;

            STATE.previousExam=
                null;

            STATE.eligible=
                true;

            renderCandidate();

            resumeIfNeeded();

            setLookupMessage(
                CONFIG.trialMode
                    ?
                    "Tài khoản kiểm thử - chế độ thi thử đã sẵn sàng."
                    :
                    "Tài khoản kiểm thử đã sẵn sàng.",
                "success"
            );

            return false;
        }


        /* =================================================
           HỌC VIÊN
        ================================================= */

        var results;

        if(CONFIG.trialMode){

            results=
                await Promise.all([

                    loadStudentIdentity(
                        code
                    ),

                    loadStudentSubmissions(
                        code
                    )

                ]);

        }else{

            results=
                await Promise.all([

                    loadStudentIdentity(
                        code
                    ),

                    loadStudentSubmissions(
                        code
                    ),

                    findPreviousExam(
                        code
                    )

                ]);
        }

        var identity=
            results[0];

        var allSubmissions=
            results[1];

        var previousExam=
            CONFIG.trialMode
                ?
                null
                :
                results[2];

        if(!identity){

            throw new Error(
                "Không tìm thấy mã học viên."
            );
        }

        var deleteResult=
            await applyDeleteLog(
                code,
                allSubmissions
            );

        var metrics=
            calculateMetrics(
                deleteResult.valid
            );

        STATE.student={

            code:
                identity.code,

            name:
                identity.name,

            group:
                identity.group,

            course:
                identity.course,

            submissionCount:
                metrics.submissionCount,

            gradedCount:
                metrics.gradedCount,

            averageScore:
                metrics.averageScore,

            isAdmin:
                false
        };

        STATE.validSubmissions=
            deleteResult.valid;

        STATE.removedCount=
            deleteResult.removed;

        STATE.previousExam=
            previousExam;


        if(CONFIG.trialMode){

            STATE.eligible=
                true;

        }else{

            STATE.eligible=
                (
                    metrics.averageScore >
                    CONFIG.minAverageExclusive
                ) &&
                (
                    metrics.submissionCount >
                    CONFIG.minSubmissionExclusive
                ) &&
                !previousExam;
        }

        renderCandidate();

        resumeIfNeeded();


        if(CONFIG.trialMode){

            setLookupMessage(
                "Đã xác nhận mã học viên. Chế độ THI THỬ không áp dụng điều kiện điểm trung bình và số bài nộp.",
                "success"
            );

        }else if(previousExam){

            setLookupMessage(
                "Học viên đã có bài thi trong hệ thống. Không thể tạo thêm phiên thi mới.",
                "error"
            );

        }else{

            setLookupMessage(
                "Đã tải dữ liệu học viên và xác nhận chưa có bài thi trước đó.",
                "success"
            );
        }

    }catch(error){

        console.error(
            error
        );

        STATE.eligible=
            false;

        setLookupMessage(
            error &&
            error.message
                ?
                error.message
                :
                "Không thể xác minh dữ liệu dự thi.",
            "error"
        );

    }finally{

        button.disabled=
            false;

        button.textContent=
            "TRA CỨU";
    }

    return false;
};

function renderCandidate(){

    var s=
        STATE.student;

    if(!s){

        return;
    }

    el(
        "examCandidatePanel"

    .classList
    .remove(
        "exam-hidden"

        ) +

        infoBox(

        ) +

        infoBox(
            "Tổ",

        ) +

        infoBox(

            "-"
        ) +

        ) +

        infoBox(
            "Bài đã chấm",
            s.gradedCount
        ) +

        infoBox(
            "Điểm trung bình",
            s.averageScore
        ) +

        infoBox(
            "Bài đã loại",
            STATE.removedCount
        );

    var status=
        el(
            "examEligibility"
        );

    var start=
        el(
            "examStartButton"
        );


    if(CONFIG.trialMode){

        status.className=
            "exam-eligibility pass";

        status.innerHTML=
            "<strong>CHẾ ĐỘ THI THỬ</strong><br>" +
            "Học viên được phép tham gia ngay. " +
            "Không áp dụng điều kiện điểm trung bình, số lượng bài nộp hoặc giới hạn một lần thi.<br>" +
            "<strong>Kết quả thi thử không được ghi vào kỳ thi chính thức.</strong>";

        start.disabled=
            false;

        start.textContent=
            "BẮT ĐẦU THI THỬ";

        return;
    }


    if(
        STATE.previousExam &&
        !s.isAdmin
    ){

        status.className=
            "exam-eligibility locked";

        var examText=
            "<strong>ĐÃ HOÀN THÀNH MỘT LẦN DỰ THI</strong><br>" +
            "Hệ thống đã tìm thấy bài thi của mã học viên này trong hệ thống.";

        if(
            STATE.previousExam.examId
        ){

            examText+=
                "<br>Exam ID: <strong>" +
                escapeHtml(
                    STATE.previousExam.examId
                ) +
                "</strong>";
        }

        if(
            STATE.previousExam.submittedAt
        ){

            examText+=
                "<br>Thời gian nộp: " +
                escapeHtml(
                    STATE.previousExam.submittedAt
                );
        }

        examText+=
            "<br><br>Học viên không thể tự tạo phiên thi thứ hai.";

        status.innerHTML=
            examText;

        start.disabled=
            true;

        start.textContent=
            "ĐÃ KHÓA LẦN DỰ THI";

        return;
    }

    start.textContent=
        "BẮT ĐẦU BÀI THI";

    if(
        STATE.eligible ||
        s.isAdmin
    ){

        status.className=
            "exam-eligibility pass";

        if(s.isAdmin){

            status.innerHTML=
                "<strong>CHẾ ĐỘ KIỂM THỬ</strong><br>" +
                "Tài khoản kiểm thử không bị giới hạn số lần thi.";

        }else{

            status.innerHTML=
                "<strong>ĐỦ ĐIỀU KIỆN DỰ THI</strong><br>" +
                "Điểm trung bình lớn hơn 5, có trên 100 bài nộp hợp lệ và chưa có bài thi tốt nghiệp trước đó.";
        }

        start.disabled=
            false;

        return;
    }

    status.className=
        "exam-eligibility fail";

    status.innerHTML=
        "<strong>CHƯA ĐỦ ĐIỀU KIỆN DỰ THI</strong><br>" +
        "Hiện có " +
        escapeHtml(
            s.submissionCount
        ) +
        " bài hợp lệ - Điểm trung bình " +
        escapeHtml(
            s.averageScore
        ) +
        ".";

    start.disabled=
        true;
}


/* =========================================================
   STORAGE
========================================================= */

function storageKey(){

    if(!STATE.student){

        return "";
    }

    return (
        CONFIG.storagePrefix +
        normalizeCode(
            STATE.student.code
        )
    );
}


function saveSession(){

    if(
        !STATE.session ||
        !storageKey()
    ){

        return;
    }

    try{

        localStorage.setItem(
            storageKey(),
            JSON.stringify(
                STATE.session
            )
        );

    }catch(error){

        console.warn(
            "Không lưu được phiên thi.",
            error
        );
    }
}


function loadSession(){

    if(!storageKey()){

        return null;
    }

    try{

        var raw=
            localStorage.getItem(
                storageKey()
            );

        return raw
            ?
            JSON.parse(
                raw
            )
            :
            null;

    }catch(error){

        return null;
    }
}


function sessionStatus(session){

    if(!session){

        return "";
    }

    return (
        session.status==="submitted" ||
        session.submitted===true
    )
        ?
        "submitted"
        :
        "active";
}


/* =========================================================
   EXAM ID
========================================================= */

function buildExamId(
    code,
    startedAt
){

    var d=
        new Date(
            startedAt
        );

    function pad(n){

        return String(n)
        .padStart(
            2,
            "0"
        );
    }

    return [

        CONFIG.trialMode
            ?
            "OCD-TRIAL"
            :
            "OCD-EXAM",

        normalizeCode(
            code
        ),

        d.getFullYear() +
        pad(
            d.getMonth()+1
        ) +
        pad(
            d.getDate()
        ) +
        pad(
            d.getHours()
        ) +
        pad(
            d.getMinutes()
        ) +
        pad(
            d.getSeconds()
        )

    ].join("-");
}


/* =========================================================
   ENSURE THEORY PAPER
========================================================= */

function ensureTheoryPaper(){

    if(!STATE.session){

        return;
    }

    /*
       Chỉ chấp nhận đề đủ 20 câu.
       Nếu phiên nào sai số lượng sẽ tạo lại đề.
    */

    if(
        Array.isArray(
            STATE.session.theoryQuestions
        ) &&
        STATE.session.theoryQuestions.length===
        CONFIG.theoryCount
    ){

        return;
    }

    var studentCode=
        STATE.session.student &&
        STATE.session.student.code
            ?
            STATE.session.student.code
            :
            (
                STATE.student
                    ?
                    STATE.student.code
                    :
                    ""
            );

    var isAdmin=
        normalizeCode(
            studentCode
        )===
        CONFIG.adminCode;

    STATE.session.theoryQuestions=
        buildTheoryPaper(
            studentCode,
            STATE.session.startedAt ||
            Date.now(),
            isAdmin
        );

    if(
        !STATE.session.answers
    ){

        STATE.session.answers={};
    }

    STATE.session.answers.theory=
        {};

    STATE.session.lastTheoryIndex=
        0;

    STATE.theoryIndex=
        0;

    saveSession();
}


/* =========================================================
   START
========================================================= */

APP.start=
async function(){

    if(
        !STATE.student ||
        STATE.startChecking
    ){

        return false;
    }

    var startButton=
        el(
            "examStartButton"
        );

    var old=
        loadSession();

    if(
        old &&
        sessionStatus(
            old
        )===
        "active"
    ){

        STATE.session=
            old;

        ensureTheoryPaper();

        openExamScreen();

        return false;
    }

    if(
        old &&
        sessionStatus(
            old
        )===
        "submitted"
    ){

        STATE.session=
            old;

        openResultScreen();

        return false;
    }


    if(
        !CONFIG.trialMode &&
        !STATE.student.isAdmin
    ){

        if(!STATE.eligible){

            return false;
        }

        STATE.startChecking=
            true;

        if(startButton){

            startButton.disabled=
                true;

            startButton.textContent=
                "ĐANG XÁC MINH LẦN CUỐI...";
        }

        try{

            var existingExam=
                await findPreviousExam(
                    STATE.student.code
                );

            if(existingExam){

                STATE.previousExam=
                    existingExam;

                STATE.eligible=
                    false;

                renderCandidate();

                setLookupMessage(
                    "Không thể bắt đầu: hệ thống vừa phát hiện học viên đã có bài thi tốt nghiệp.",
                    "error"
                );

                return false;
            }

        }catch(error){

            console.error(
                error
            );

            setLookupMessage(
                "Không thể xác minh trạng thái dự thi. Hệ thống tạm thời chưa cho bắt đầu để tránh tạo bài thi trùng.",
                "error"
            );

            return false;

        }finally{

            STATE.startChecking=
                false;

            if(
                startButton &&
                !STATE.previousExam
            ){

                startButton.disabled=
                    false;

                startButton.textContent=
                    "BẮT ĐẦU BÀI THI";
            }
        }
    }


    var now=
        Date.now();

    var generatedTheory=
        buildTheoryPaper(
            STATE.student.code,
            now,
            !!STATE.student.isAdmin
        );

    STATE.session={

        version:
            CONFIG.version,

        isTrial:
            CONFIG.trialMode,

        theoryBankVersion:
            CONFIG.theoryBankVersion,

        examId:
            buildExamId(
                STATE.student.code,
                now
            ),

        student:{

            code:
                STATE.student.code,

            name:
                STATE.student.name,

            group:
                STATE.student.group,

            course:
                STATE.student.course
        },

        theoryQuestions:
            generatedTheory,

        startedAt:
            now,

        endAt:
            now +
            CONFIG.durationMs,

        status:
            "active",

        submitted:
            false,

        answers:{

            theory:{},

            practical:{}
        },

        lastSection:
            "theory",

        lastTheoryIndex:
            0,

        lastPracticalIndex:
            0,

        result:
            null,

        remoteSave:{

                CONFIG.trialMode
                    ?

                    :
                    "not_sent",

                0,

            lastAttemptAt:
                null,

            sentAt:
                null
        }
    };

    saveSession();

    openExamScreen();

    return false;
};


/* =========================================================
   RESUME
========================================================= */

function resumeIfNeeded(){

    var old=
        loadSession();

    if(!old){

    }

            old

========================================================= */

function openExamScreen(){

    if(!STATE.session){

    }

    ensureTheoryPaper();

        theoryQuestions();

    el(
        "examLookupPanel"
    )
    .classList

    );

    el(
        "examCandidatePanel"
    )
    .classList
    .add(
        "exam-hidden"
    );

    el(
        "examResultPanel"
    )
    .classList
    .add(
        "exam-hidden"
    );

    el(
        "examSessionPanel"
    )
    .classList
    .remove(
        "exam-hidden"
    );

    el(
        "examMiniName"
    )
    .textContent=
        STATE.student.name;

    el(
        "examMiniCode"
    )
    .textContent=
        STATE.student.code +
        (
            CONFIG.trialMode
                ?
                " - THI THỬ"
                :
                ""
        );

    STATE.theoryIndex=
        Math.max(
            0,
            Math.min(
                Number(
                    STATE.session
                    .lastTheoryIndex ||
                    0
                ),
                currentTheory.length-1
            )
        );

    STATE.practicalIndex=
        Math.max(
            0,
            Math.min(
                Number(
                    STATE.session
                    .lastPracticalIndex ||
                    0
                ),
                PRACTICAL_QUESTIONS.length-1
            )
        );

    startTimer();

    var section=
        STATE.session
        .lastSection ||
        "theory";

    if(
        section===
        "practical"
    ){

        APP.openPractical();

    }else if(
        section===
        "review"
    ){

        APP.openReview();

    }else{

        APP.openTheory();
    }
}


/* =========================================================
   TIMER
========================================================= */

function stopTimer(){

    if(
        STATE.timerHandle
    ){

        clearInterval(
            STATE.timerHandle
        );

        STATE.timerHandle=
            null;
    }
}


function startTimer(){

    stopTimer();

    updateTimer();

    STATE.timerHandle=
        setInterval(
            updateTimer,
            1000
        );
}


function updateTimer(){

    if(
        !STATE.session ||
        sessionStatus(
            STATE.session
        )===
        "submitted"
    ){

        stopTimer();

        return;
    }

    var remain=
        Number(
            STATE.session.endAt
        ) -
        Date.now();

    if(remain<=0){

        el(
            "examTimer"
        )
        .textContent=
            "00:00";

        stopTimer();

        finalizeExam(
            true
        );

        return;
    }

    var seconds=
        Math.floor(
            remain/1000
        );

    var minutes=
        Math.floor(
            seconds/60
        );

    seconds=
        seconds%60;

    el(
        "examTimer"
    )
    .textContent=
        String(
            minutes
        )
        .padStart(
            2,
            "0"
        ) +
        ":" +
        String(
            seconds
        )
        .padStart(
            2,
            "0"
        );

    el(
        "examTimer"
    )
    .classList
    .toggle(
        "warning",
        remain<=
        5*60*1000
    );
}


/* =========================================================
   PIN QUESTION
========================================================= */

function updatePinnedQuestion(){

    var box=
        el(
            "examPinnedQuestionText"
        );

    if(!box){

        return;
    }

    if(!STATE.session){

        box.textContent=
            "-";

        return;
    }

    var section=
        STATE.session.lastSection ||
        "theory";

    if(
        section===
        "theory"
    ){

        var questions=
            theoryQuestions();

        var theory=
            questions[
                STATE.theoryIndex
            ];

        if(theory){

            box.textContent=
                "Câu " +
                theory.id +
                ": " +
                decodeHtmlEntities(
                    theory.text
                );

        }else{

            box.textContent=
                "Phần lý thuyết";
        }

        return;
    }

    if(
        section===
        "practical"
    ){

        var practical=
            PRACTICAL_QUESTIONS[
                STATE.practicalIndex
            ];

        if(practical){

            box.textContent=
                "Câu " +
                practical.id +
                ": " +
                decodeHtmlEntities(
                    practical.text
                );

        }else{

            box.textContent=
                "Phần thực hành";
        }

        return;
    }

    box.textContent=
        "Rà soát toàn bộ bài thi và xác nhận nộp bài.";
}

            STATE.theoryIndex;

        saveSession();

        renderTheory();

APP.nextTheory=
function(){

    var questions=
        theoryQuestions();

    if(
        STATE.theoryIndex<
        questions.length-1

        STATE.session
        .lastTheoryIndex=
            STATE.theoryIndex;

        }

/* =========================================================
   USED SUBMISSIONS
========================================================= */

function usedSubmissionMap(){

    var map={};

    var answers=
        practicalAnswers();

    Object.keys(
        answers
    )
    .forEach(
        function(questionId){

            var answer=
                answers[
                    questionId
                ];

            if(
                answer &&
                answer.submissionId
            ){

                map[
                    answer.submissionId
                ]=
                    Number(
                        questionId
                    );
            }
        }
    );

    return map;
}


function practicalSortRank(
    item,
    currentQuestionId,
    used
){

    var usedQuestion=
        used[
            item.submissionId
        ];

    if(!usedQuestion){

        return 0;
    }

    if(
        Number(
            usedQuestion
        )===
        Number(
            currentQuestionId
        )
    ){

        return 1;
    }

    return 2;
}

/* =========================================================
   SUBMISSION LIST
========================================================= */

function renderSubmissionList(){

    var container=
        el(
            "examSubmissionList"
        );

    if(!container){

        return;
    }

    var q=
        PRACTICAL_QUESTIONS[
            STATE.practicalIndex
        ];

    if(!q){

        return;
    }

    var used=
        usedSubmissionMap();

    var search=
        normalizeText(
            STATE.practicalSearch
        );

    var list=
        STATE.validSubmissions
        .filter(
            function(item){

                if(!search){

                    return true;
                }

                var source=
                    normalizeText(

                        (
                            item.note ||
                            ""
                        ) +

                        " " +

                        (
                            item.timestamp ||
                            ""
                        ) +

                        " " +

                        (
                            item.score===null ||
                            item.score===undefined
                                ?
                                ""
                                :
                                item.score
                        )

                    );

                return (
                    source.indexOf(
                        search
                    )!==-1
                );
            }
        )
        .slice();


    list.sort(
        function(a,b){

            var rankA=
                practicalSortRank(
                    a,
                    q.id,
                    used
                );

            var rankB=
                practicalSortRank(
                    b,
                    q.id,
                    used
                );

            if(
                rankA!==rankB
            ){

                return rankA-rankB;
            }

            return (
                a.timestampSort -
                b.timestampSort
            );
        }
    );


    STATE.practicalRenderMap={};

    var unusedCount=0;

    list.forEach(
        function(item,index){

            var renderKey=
                String(
                    index
                );

            STATE.practicalRenderMap[
                renderKey
            ]=
                item;

            if(
                !used[
                    item.submissionId
                ]
            ){

                unusedCount++;
            }
        }
    );


    var html=

        '<div class="practical-list-info">' +

            'Tìm thấy ' +
            list.length +
            ' bài - Còn ' +
            unusedCount +
            ' bài chưa sử dụng. ' +

            'Bài chưa dùng được ưu tiên ở đầu danh sách.' +

        '</div>';


    if(!list.length){

        html+=

            '<div class="exam-message show error">' +

                (
                    CONFIG.trialMode
                        ?
                        'Không tìm thấy bài đã nộp. Chế độ thi thử vẫn cho phép vào phòng thi, nhưng phần thực hành cần có bài trong lịch sử để lựa chọn.'
                        :
                        'Không tìm thấy bài phù hợp.'
                ) +

            '</div>';

        container.innerHTML=
            html;

        return;
    }


    html+=
        '<div class="practical-list">';


    list.forEach(
        function(item,index){

            var renderKey=
                String(
                    index
                );

            var usedQuestion=
                used[
                    item.submissionId
                ];

            var isCurrent=
                Number(
                    usedQuestion
                )===
                Number(
                    q.id
                );

            var isLocked=
                !!usedQuestion &&
                !isCurrent;

            var img=
                imageUrl(
                    item.file
                );


            html+=

                '<article class="practical-card ' +

                    (
                        isCurrent
                            ?
                            "selected "
                            :
                            ""
                    ) +

                    (
                        isLocked
                            ?
                            "locked"
                            :
                            ""
                    ) +

                '">';


            html+=
                '<div class="practical-image-wrap">';


            if(img){

                html+=

                    '<img ' +
                        'class="practical-image" ' +
                        'loading="lazy" ' +
                        'src="' +
                            escapeHtml(
                                img
                            ) +
                        '" ' +
                        'alt="Bài thực hành">';

            }else{

                html+=

                    '<div class="practical-no-image">' +

                        'Không có ảnh xem trước' +

                    '</div>';
            }


            if(isCurrent){

                html+=

                    '<div class="practical-badge">' +

                        'ĐANG CHỌN' +

                    '</div>';

            }else if(isLocked){

                html+=

                    '<div class="practical-badge">' +

                        'ĐÃ DÙNG Ở CÂU ' +
                        escapeHtml(
                            usedQuestion
                        ) +

                    '</div>';
            }


            html+=
                '</div>';


            html+=

                '<div class="practical-body">' +

                    '<div class="practical-note">' +

                        escapeHtml(
                            item.note ||
                            "Bài tập"
                        ) +

                    '</div>' +

                    '<div class="practical-meta">' +

APP.selectPracticalByKey=
function(
    questionId,
    renderKey
){

    if(
        !STATE.session ||
        sessionStatus(
            STATE.session
        )===
        "submitted"
    ){

        return false;
    }

    var item=
        STATE.practicalRenderMap[
            String(
                renderKey
            )
        ];

    if(!item){

        alert(
            "Không tìm thấy dữ liệu bài được chọn. Vui lòng thử lại."
        );

        return false;
    }

    var used=
        usedSubmissionMap();

    var usedQuestion=
        used[
            item.submissionId
        ];

    if(
        usedQuestion &&
        Number(
            usedQuestion
        )!==
        Number(
            questionId
        )
    ){

        alert(
            "Bài này đã được sử dụng ở câu " +
            usedQuestion +
            "."
        );

        return false;
    }


    var question=
        PRACTICAL_QUESTIONS
        .find(
            function(q){

                return (
                    Number(
                        q.id
                    )===
                    Number(
                        questionId
                    )
                );
            }
        );


    practicalAnswers()[
        String(
            questionId
        )
    ]={

        questionId:
            Number(
                questionId
            ),

        prompt:
            question
                ?
                question.text
                :
                "",

        submissionId:
            item.submissionId,

        file:
            item.file,

        note:
            item.note,

        submittedAt:
            item.timestamp,

        originalScore:
            item.score
    };


    STATE.practicalSearch=
        "";

    saveSession();


    var currentIndex=
        PRACTICAL_QUESTIONS
        .findIndex(
            function(q){

                return (
                    Number(
                        q.id
                    )===
                    Number(
                        questionId
                    )
                );
            }
        );


    if(
        currentIndex>=0 &&
        currentIndex<
        PRACTICAL_QUESTIONS.length-1
    ){

        STATE.practicalIndex=
            currentIndex+1;

        STATE.session
        .lastPracticalIndex=
            STATE.practicalIndex;

        saveSession();

        renderPractical();

        var practicalPanel=
            el(
                "examPracticalPanel"
            );

        if(practicalPanel){

            practicalPanel.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });
        }

        return false;
    }


    APP.openReview();

    var reviewPanel=
        el(
            "examReviewPanel"
        );

    if(reviewPanel){

        reviewPanel.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });
    }

    return false;
};

/* =========================================================
   GRADE THEORY
========================================================= */

function gradeTheory(){

    var answers=
        theoryAnswers();

    var questions=
        theoryQuestions();

    var answered=0;
    var correct=0;

    questions.forEach(
        function(q){

            var answer=
                answers[
                    String(
                        q.id
                    )
                ];

            if(
                answer===undefined ||
                answer===null
            ){

                return;
            }

            answered++;

            if(
                Number(
                    answer
                )===
                Number(
                    q.correct
                )
            ){

                correct++;
            }
        }
    );

    var wrong=
        answered-
        correct;

    return {

        answered:
            answered,

        correct:
            correct,

        wrong:
            wrong,

        unanswered:
            CONFIG.theoryCount -
            answered,

        /*
           20 câu vẫn quy về thang điểm 10.
           Mỗi câu đúng = 0.5 điểm.
        */
        score:
            Math.round(
                (
                    correct /
                    CONFIG.theoryCount *
                    10
                ) *
                100
            ) / 100
    };
}


/* =========================================================
   THEORY DATA
========================================================= */

function buildTheoryData(){

    var answers=
        theoryAnswers();

    return theoryQuestions()
    .map(
        function(q){

            var answer=
                answers[
                    String(
                        q.id
                    )
                ];

            return {

                q:
                    q.id,

                bankId:
                    q.bankId,

                question:
                    q.text,

                options:
                    q.options.slice(),

                answer:
                    answer===undefined
                        ?
                        null
                        :
                        Number(answer),

                correct:
                    q.correct,

                isCorrect:
                    answer!==undefined &&
                    Number(answer)===
                    Number(q.correct)
            };
        }
    );
}


/* =========================================================
   PRACTICAL DATA
========================================================= */

function buildPracticalData(){

    var answers=
        practicalAnswers();

    return PRACTICAL_QUESTIONS
    .map(
        function(q){

            var answer=
                answers[
                    String(
                        q.id
                    )
                ];

            if(!answer){

                return {

                    q:q.id,

                    prompt:q.text,

                    submissionId:"",

                    note:"",

                    file:"",

                    submittedAt:"",

                    originalScore:null
                };
            }

            return {

                q:
                    q.id,

                prompt:
                    q.text,

                submissionId:
                    answer.submissionId ||
                    "",

                note:
                    answer.note ||
                    "",

                file:
                    answer.file ||
                    "",

                submittedAt:
                    answer.submittedAt ||
                    "",

                originalScore:
                    answer.originalScore===
                    undefined
                        ?
                        null
                        :
                        answer.originalScore
            };
        }
    );
}


/* =========================================================
   FINAL RESULT
========================================================= */

function buildFinalResult(
    autoSubmitted
){

    var theory=
        gradeTheory();

    return {

        examId:
            STATE.session.examId,

        isTrial:
            CONFIG.trialMode,

        studentCode:
            STATE.student.code,

        studentName:
            STATE.student.name,

        group:
            STATE.student.group,

        course:
            STATE.student.course,

        startedAt:
            STATE.session.startedAt,

        submittedAt:
            Date.now(),

        autoSubmitted:
            !!autoSubmitted,

        submitReason:
            autoSubmitted
                ?
                "TIMEOUT"
                :
                (
                    CONFIG.trialMode
                        ?
                        "TRIAL"
                        :
                        "MANUAL"
                ),

        theory:
            theory,

        theoryPaper:
            buildTheoryData(),

        practical:{

            answered:
                practicalCount(),

            unanswered:
                CONFIG.practicalCount -
                practicalCount(),

            selections:
                buildPracticalData()
        },

        totalAnswered:
            theory.answered +
            practicalCount(),

        missingQuestions:{

            theory:
                missingTheory(),

            practical:
                missingPractical()
        }
    };
}

APP.submitExam=

        );

    if(

        !confirmBox.checked
    ){

    }

    var confirmText=
        CONFIG.trialMode
            ?
            "Xác nhận nộp bài thi thử?\n\nKết quả này không được ghi vào kỳ thi chính thức."

/* =========================================================
   FINALIZE
========================================================= */

function finalizeExam(
    autoSubmitted
){

    if(
        !STATE.session ||
        sessionStatus(
            STATE.session
        )===
        "submitted"
    ){

        return;
    }

    stopTimer();

    var result=
        buildFinalResult(
            autoSubmitted
        );

    STATE.session.status=
        "submitted";

    STATE.session.submitted=
        true;

    STATE.session.submittedAt=
        result.submittedAt;

    STATE.session.submitReason=
        result.submitReason;

    STATE.session.result=
        result;

    STATE.session.remoteSave=
        STATE.session.remoteSave ||
        {};

    if(CONFIG.trialMode){

        STATE.session.remoteSave.status=
            "trial_not_sent";

    }else{

        STATE.session.remoteSave.status=
            "pending";
    }

    STATE.session.remoteSave.attempts=
        Number(
            STATE.session
            .remoteSave
            .attempts ||
            0
        );

    saveSession();

    openResultScreen();

    if(!CONFIG.trialMode){

        sendResultToGoogleForm();
    }
}


/* =========================================================
   FORM PAYLOAD
========================================================= */

function formPayload(){

    if(
        CONFIG.trialMode ||
        !STATE.session ||
        !STATE.session.result
    ){

        return null;
    }

    var r=
        STATE.session.result;

    var payload={};

    payload[
        CONFIG.formEntries.examId
    ]=
        r.examId;

    payload[
        CONFIG.formEntries.studentCode
    ]=
        r.studentCode;

    payload[
        CONFIG.formEntries.studentName
    ]=
        r.studentName;

    payload[
        CONFIG.formEntries.group
    ]=
        r.group ||
        "";

    payload[
        CONFIG.formEntries.course
    ]=
        r.course ||
        "";

    payload[
        CONFIG.formEntries.startedAt
    ]=
        formatDateTime(
            r.startedAt
        );

    payload[
        CONFIG.formEntries.submittedAt
    ]=
        formatDateTime(
            r.submittedAt
        );

    payload[
        CONFIG.formEntries.submitReason
    ]=
        r.submitReason;

    payload[
        CONFIG.formEntries.theoryAnswered
    ]=
        r.theory.answered;

    payload[
        CONFIG.formEntries.theoryCorrect
    ]=
        r.theory.correct;

    payload[
        CONFIG.formEntries.theoryWrong
    ]=
        r.theory.wrong;

    payload[
        CONFIG.formEntries.theoryScore
    ]=
        r.theory.score;

    payload[
        CONFIG.formEntries.practicalAnswered
    ]=
        r.practical.answered;

    payload[
        CONFIG.formEntries.practicalData
    ]=
        JSON.stringify(
            r.practical.selections
        );

    payload[
        CONFIG.formEntries.systemVersion
    ]=
        CONFIG.version +
        " | BANK=" +
        CONFIG.theoryBankVersion +
        " | THEORY=" +
        CONFIG.theoryCount +
        " | PRACTICAL=" +
        CONFIG.practicalCount;

    return payload;
}


/* =========================================================
   GOOGLE FORM
========================================================= */

function sendResultToGoogleForm(){

    if(CONFIG.trialMode){

        return;
    }

    if(
        !STATE.session ||
        !STATE.session.result ||
        STATE.remoteSubmitting
    ){

        return;
    }

    if(!navigator.onLine){

        STATE.session
        .remoteSave
        .status=
            "pending";

        saveSession();

        renderRemoteStatus();

        return;
    }

    var payload=
        formPayload();

    if(!payload){

        return;
    }

    STATE.remoteSubmitting=
        true;

    STATE.session
    .remoteSave
    .attempts=
        Number(
            STATE.session
            .remoteSave
            .attempts ||
            0
        ) + 1;

    STATE.session
    .remoteSave
    .lastAttemptAt=
        Date.now();

    STATE.session
    .remoteSave
    .status=
        "sending";

    saveSession();

    renderRemoteStatus();

    var iframe=
        el(
            "graduationFormFrame"
        );

    var form=
        document.createElement(
            "form"
        );

    form.method=
        "POST";

    form.action=
        CONFIG.formAction;

    form.target=
        "graduationFormFrame";

    form.style.display=
        "none";


    Object.keys(
        payload
    )
    .forEach(
        function(name){

            var input=
                document.createElement(
                    "input"
                );

            input.type=
                "hidden";

            input.name=
                name;

            input.value=
                String(
                    payload[name]===
                    undefined ||
                    payload[name]===
                    null
                        ?
                        ""
                        :
                        payload[name]
                );

            form.appendChild(
                input
            );
        }
    );


    document.body
    .appendChild(
        form
    );


    var done=
        false;

    function finish(){

        if(done){

            return;
        }

        done=
            true;

        STATE.remoteSubmitting=
            false;

        STATE.session
        .remoteSave
        .status=
            "sent";

        STATE.session
        .remoteSave
        .sentAt=
            Date.now();

        saveSession();

        renderRemoteStatus();

        try{

            form.remove();

        }catch(error){}
    }


    function onLoad(){

        iframe.removeEventListener(
            "load",
            onLoad
        );

        finish();
    }


    iframe.addEventListener(
        "load",
        onLoad
    );


    try{

        HTMLFormElement
        .prototype
        .submit
        .call(
            form
        );

        setTimeout(
            function(){

                if(
                    STATE.remoteSubmitting
                ){

                    iframe.removeEventListener(
                        "load",
                        onLoad
                    );

                    finish();
                }

            },
            6000
        );

    }catch(error){

        console.error(
            error
        );

        STATE.remoteSubmitting=
            false;

        STATE.session
        .remoteSave
        .status=
            "pending";

        saveSession();

        renderRemoteStatus();

        try{

            form.remove();

        }catch(e){}
    }
}

    renderResult();

    if(
        !CONFIG.trialMode &&
        STATE.session.remoteSave &&
        STATE.session
        .remoteSave
        .status===
        "pending" &&
        navigator.onLine
    ){

        setTimeout(
            sendResultToGoogleForm,
            800
        );
    }
}


function renderResult(){

    var r=
        STATE.session.result;

    var isAdmin=
        (
            STATE.student &&
            STATE.student.isAdmin
        ) ||
        normalizeCode(
            r.studentCode
        )===
        CONFIG.adminCode;


    var html=

        '<div class="result-head">' +

            '<div class="result-icon">' +

                String.fromCodePoint(
                    10003
                ) +

            '</div>' +

            '<h2 class="result-title">' +

                (
                    CONFIG.trialMode
                        ?
                        (
                            r.autoSubmitted
                                ?
                                'Bài thi thử đã tự động nộp'
                                :
                                'Đã hoàn thành bài thi thử'
                        )
                        :
                        (
                            r.autoSubmitted
                                ?
                                'Bài thi đã tự động nộp'
                                :
                                'Bài thi đã được nộp'
                        )
                ) +

            '</h2>' +

            '<p class="exam-muted">' +

                (
                    CONFIG.trialMode
                        ?
                        'Đây là kết quả luyện tập và không ảnh hưởng tới lượt thi tốt nghiệp chính thức.'
                        :
                        (
                            r.autoSubmitted
                                ?
                                'Hết thời gian làm bài. Phiên thi đã được khóa.'
                                :
                                'Phiên thi đã được khóa và không thể chỉnh sửa.'
                        )
                ) +

            '</p>' +

        '</div>';


    html+=

        '<div class="result-grid">' +

            '<div class="result-box">' +

                '<div class="result-value">' +

                    escapeHtml(
                        r.theory.score
                    ) +

                '</div>' +

                '<div class="result-label">' +

                    'Điểm lý thuyết /10' +

                '</div>' +

            '</div>' +

            '<div class="result-box">' +

                '<div class="result-value">' +

                    r.theory.correct +
                    '/' +
                    CONFIG.theoryCount +

                '</div>' +

                '<div class="result-label">' +

                    'Câu đúng' +

                '</div>' +

            '</div>' +

            '<div class="result-box">' +

                '<div class="result-value">' +

                    r.theory.answered +
                    '/' +
                    CONFIG.theoryCount +

                '</div>' +

                '<div class="result-label">' +

                    'Lý thuyết' +

                '</div>' +

            '</div>' +

            '<div class="result-box">' +

                '<div class="result-value">' +

                    r.practical.answered +
                    '/' +
                    CONFIG.practicalCount +

                '</div>' +

                '<div class="result-label">' +

                    'Thực hành' +

                '</div>' +

            '</div>' +

        '</div>';


    html+=
        '<div id="examRemoteStatusBox"></div>';


    if(
        CONFIG.trialMode ||
        isAdmin
    ){

        html+=

            '<div style="' +
                'margin-top:16px;' +
                'padding-top:16px;' +
                'border-top:1px dashed #e4d8c8;' +
            '">' +

                '<div class="exam-muted" style="font-size:12px;margin-bottom:9px;">' +

                    (
                        CONFIG.trialMode
                            ?
                            'Bạn có thể xóa phiên thi thử để luyện lại với một bộ 20 câu lý thuyết khác.'
                            :
                            'Chức năng kiểm thử nội bộ. Nút này chỉ xóa phiên trên thiết bị, không xóa dữ liệu đã gửi lên Google Form.'
                    ) +

                '</div>' +

                '<button ' +
                    'class="exam-btn secondary" ' +
                    'type="button" ' +
                    'onclick="return window.OCDGraduationExam.resetTestSession();">' +

                    (
                        CONFIG.trialMode
                            ?
                            'LÀM LẠI BÀI THI THỬ'
                            :
                            'XÓA PHIÊN TEST ĐỂ THI LẠI'
                    ) +

                '</button>' +

            '</div>';
    }


    el(
        "examResultContent"
    )
    .innerHTML=
        html;

    renderRemoteStatus();
}


/* =========================================================
   REMOTE STATUS
========================================================= */

function renderRemoteStatus(){

    var box=
        el(
            "examRemoteStatusBox"
        );

    if(
        !box ||
        !STATE.session
    ){

        return;
    }


    if(CONFIG.trialMode){

        box.innerHTML=

            '<div class="remote-status sent">' +

                '<strong>CHẾ ĐỘ THI THỬ</strong><br>' +

                'Kết quả không được gửi tới Google Form và không tạo bản ghi trong BaiThiTotNghiep.' +

            '</div>';

        return;
    }


    var remote=
        STATE.session
        .remoteSave ||
        {};


    if(
        remote.status===
        "sent"
    ){

        box.innerHTML=

            '<div class="remote-status sent">' +

                '<strong>Đã gửi dữ liệu tới Google Form.</strong><br>' +

                'ExamID: ' +

                escapeHtml(
                    STATE.session.examId
                ) +

            '</div>';

        return;
    }


    if(
        remote.status===
        "sending"
    ){

        box.innerHTML=

            '<div class="remote-status pending">' +

                '<strong>Đang gửi dữ liệu bài thi...</strong>' +

            '</div>';

        return;
    }


    box.innerHTML=

        '<div class="remote-status pending">' +

            '<strong>Bài đã khóa trên thiết bị nhưng đang chờ gửi dữ liệu.</strong>' +

            '<br><br>' +

            '<button ' +
                'class="exam-btn gold" ' +
                'type="button" ' +
                'onclick="return window.OCDGraduationExam.retryRemoteSave();">' +

                'GỬI LẠI KẾT QUẢ' +

            '</button>' +

        '</div>';
}


/* =========================================================
   RESET SESSION
========================================================= */

APP.resetTestSession=
function(){

    if(
        !CONFIG.trialMode &&
        (
            !STATE.student ||
            !STATE.student.isAdmin ||
            normalizeCode(
                STATE.student.code
            )!==
            CONFIG.adminCode
        )
    ){

        alert(
            "Bạn không có quyền sử dụng chức năng này."
        );

        return false;
    }

    var message=
        CONFIG.trialMode
            ?
            "Làm lại bài thi thử?\n\nPhiên thi thử hiện tại trên thiết bị sẽ bị xóa và hệ thống sẽ tạo một bộ 20 câu lý thuyết mới."
            :
            "Xóa phiên TEST trên thiết bị này?\n\nDữ liệu đã gửi vào Google Form sẽ không bị xóa.";

    if(
        !window.confirm(
            message
        )
    ){

        return false;
    }

    stopTimer();

    try{

        localStorage.removeItem(
            storageKey()
        );

    }catch(error){}

    STATE.session=
        null;

    STATE.theoryIndex=
        0;

    STATE.practicalIndex=
        0;

    STATE.practicalSearch=
        "";

    STATE.practicalRenderMap=
        {};

    el(
        "examResultPanel"
    )
    .classList
    .add(
        "exam-hidden"
    );

    el(
        "examSessionPanel"
    )
    .classList
    .add(
        "exam-hidden"
    );

    el(
        "examLookupPanel"
    )
    .classList
    .remove(
        "exam-hidden"
    );

    el(
        "examCandidatePanel"
    )
    .classList
    .remove(
        "exam-hidden"
    );

    var input=
        el(
            "examStudentCode"
        );

    if(input){

        input.value=
            "";
    }

    setLookupMessage(

        CONFIG.trialMode
            ?
            "Đã xóa phiên thi thử. Hãy nhập lại mã học viên để bắt đầu một đề 20 câu mới."
            :
            "Đã xóa phiên kiểm thử trên thiết bị.",

        "success"
    );

    return false;
};


/* =========================================================
   UPDATE HERO MODE
========================================================= */

function updatePageMode(){

    if(!CONFIG.trialMode){

        return;
    }

    var badge=
        document.querySelector(
            "#ocdGraduationExamPage .exam-hero-badge"
        );

    var title=
        document.querySelector(
            "#ocdGraduationExamPage .exam-hero h1"
        );

    var description=
        document.querySelector(
            "#ocdGraduationExamPage .exam-hero p"
        );

    var test=
        document.querySelector(
            "#ocdGraduationExamPage .exam-test"
        );

    if(badge){

        badge.textContent=
            "PHÒNG THI THỬ OCD";
    }

    if(title){

        title.textContent=
            "Thi thử tốt nghiệp";
    }

    if(description){

        description.textContent=
            "Luyện tập trước kỳ thi chính thức. Kết quả thi thử không ảnh hưởng tới lượt thi tốt nghiệp.";
    }

    if(test){

        test.textContent=
            "THI THỬ BAO GỒM 20 câu lý thuyết + 5 câu thực hành";
    }
}


/* =========================================================
   INIT
========================================================= */

function init(){

    try{

        localStorage.removeItem(
            CONFIG.lastCodeKey
        );

    }catch(error){}

    var input=
        el(
            "examStudentCode"
        );

    if(input){

        input.value=
            "";
    }

    updatePageMode();

    console.log(
        CONFIG.version +
        " READY | MODE=" +
        (
            CONFIG.trialMode
                ?
                "TRIAL"
                :
                "OFFICIAL"
        ) +
        " | THEORY BANK=" +
        THEORY_BANK.length +
        " | THEORY COUNT=" +
        CONFIG.theoryCount +
        " | PRACTICAL COUNT=" +
        CONFIG.practicalCount
    );
}


if(
    document.readyState===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        init
    );

}else{

    init();
}


})(window.OCDGraduationExam);

</script>

</div>
