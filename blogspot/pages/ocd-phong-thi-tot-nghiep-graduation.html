APP.sendUpload=
async function(questionId){

    var up=
        STATE.upload ||
        {};

    if(
        !STATE.session ||
        sessionStatus(
            STATE.session
        )==="submitted" ||
        !up.data ||
        up.busy
    ){

        return false;
    }

    var question=
        PRACTICAL_QUESTIONS.find(
            function(q){

                return Number(q.id)===Number(questionId);
            }
        );

    var note=
        String(
            up.note ||
            ""
        ).trim() ||
        "Sáng tác tại chỗ – Nhập cổ xuất tân";

    var local=
        CONFIG.trialMode ||
        isAdminSession() ||
        !CONFIG.examUploadUrl;

    up.busy=
        true;

    up.message=
        local
            ?
            ""
            :
            "Đang tải ảnh lên bài thi...";

    up.kind=
        "";

    renderPractical();

    var result;

    if(local){

        /* Thi thử / ADMIN: không tải lên máy chủ */
        result={
            ok:true,
            fileId:"LOCAL-" + Date.now(),
            url:"",
            uploadedAt:formatDateTime(Date.now())
        };

    }else{

        result=
            await postExamUpload({

                action:"examUpload",

                examId:
                    STATE.session.examId,

                code:
                    STATE.session.student.code,

                q:
                    Number(questionId),

                note:
                    note,

                data:
                    up.data
            });
    }

    up.busy=
        false;

    if(
        !result ||
        !result.ok
    ){

        up.message=
            (result && result.error) ||
            "Chưa tải được ảnh, vui lòng thử lại.";

        up.kind=
            "err";

        renderPractical();

        return false;
    }

    practicalAnswers()[
        String(
            questionId
        )
    ]={

        questionId:
            Number(questionId),

        prompt:
            question
                ?
                question.text
                :
                "",

        submissionId:
            "EXAMIMG|" +
            result.fileId,

        file:
            result.url ||
            "",

        note:
            note +
            (
                local
                    ?
                    " (ảnh thử – không tải lên)"
                    :
                    ""
            ),

        submittedAt:
            result.uploadedAt ||
            formatDateTime(Date.now()),

        originalScore:
            null,

        source:
            "exam-upload"
    };

    saveSession();

    STATE.upload={
        message:
            local
                ?
                "Đã ghi nhận ảnh (thi thử / kiểm thử, không tải lên máy chủ)."
                :
                (
                    result.reused
                        ?
                        "Ảnh này đã có trong bài thi, đã chọn lại cho câu " + questionId + "."
                        :
                        "✅ Đã tải ảnh lên bài thi và chọn cho câu " + questionId + "." +
                        (
                            Number(questionId)===Number(PRACTICAL_QUESTIONS[PRACTICAL_QUESTIONS.length-1].id)
                                ?
                                " Bấm RÀ SOÁT & NỘP BÀI ở cuối trang để kiểm tra lại và nộp bài."
                                :
                                ""
                        )
                ),
        kind:"ok",
        /* giữ mô tả học viên đã gõ cho lần tải sau */
        note:
            up.note ||
            ""
    };

    renderPractical();

    return false;
};


function practicalSortRank(
    item,
    currentQuestionId,
    used
){

    var usedQuestion=
        used[
            item.submissionId
        ];

    if(!usedQuestion){

        return 0;
    }

    if(
        Number(
            usedQuestion
        )===
        Number(
            currentQuestionId
        )
    ){

        return 1;
    }

    return 2;
}

/* =========================================================
   SUBMISSION LIST
========================================================= */

function renderSubmissionList(){

    var container=
        el(
            "examSubmissionList"
        );

    if(!container){

        return;
    }

    var q=
        PRACTICAL_QUESTIONS[
            STATE.practicalIndex
        ];

    if(!q){

        return;
    }

    var used=
        usedSubmissionMap();

    var search=
        normalizeText(
            STATE.practicalSearch
        );

    var list=
        STATE.validSubmissions
        .filter(
            function(item){

                return practicalAllowed(
                    q,
                    item
                );
            }
        )
        .filter(
            function(item){

                if(!search){

                    return true;
                }

                var source=
                    normalizeText(

                        (
                            item.note ||
                            ""
                        ) +

                        " " +

                        (
                            item.timestamp ||
                            ""
                        ) +

                        " " +

                        (
                            item.score===null ||
                            item.score===undefined
                                ?
                                ""
                                :
                                item.score
                        )

                    );

                return (
                    source.indexOf(
                        search
                    )!==-1
                );
            }
        )
        .slice();


    list.sort(
        function(a,b){

            var rankA=
                practicalSortRank(
                    a,
                    q.id,
                    used
                );

            var rankB=
                practicalSortRank(
                    b,
                    q.id,
                    used
                );

            if(
                rankA!==rankB
            ){

                return rankA-rankB;
            }

            return (
                q.mode==="live"
                    ?
                    b.timestampSort -
                    a.timestampSort
                    :
                    a.timestampSort -
                    b.timestampSort
            );
        }
    );

    STATE.practicalRenderMap={};

    var unusedCount=0;

    list.forEach(
        function(item,index){

            var renderKey=
                String(
                    index
                );

            STATE.practicalRenderMap[
                renderKey
            ]=
                item;

            if(
                !used[
                    item.submissionId
                ]
            ){

                unusedCount++;
            }
        }
    );


    var html=

        '<div class="practical-list-info">' +

            'Tìm thấy ' +
            list.length +
            ' bài - Còn ' +
            unusedCount +
            ' bài chưa sử dụng. ' +

            'Bài chưa dùng được ưu tiên ở đầu danh sách.' +

        '</div>';


    if(!list.length){

        html+=

            '<div class="exam-message show error">' +

                (
                    q.mode==="live"
                        ?
                        'Chưa có bài nào trên trang Nộp bài sau lúc bắt đầu thi. Cách chính là bấm TẢI ẢNH LÊN BÀI THI ở phía trên.'
                        :
                        'Không tìm thấy bài phù hợp.'
                ) +

            '</div>';

        container.innerHTML=
            html;

        return;
    }


    html+=
        '<div class="practical-list">';


    list.forEach(
        function(item,index){

            var renderKey=
                String(
                    index
                );

            var usedQuestion=
                used[
                    item.submissionId
                ];

            var isCurrent=
                Number(
                    usedQuestion
                )===
                Number(
                    q.id
                );

            var isLocked=
                !!usedQuestion &&
                !isCurrent;

            var img=
                imageUrl(
                    item.file
                );


            html+=

                '<article class="practical-card ' +

                    (
                        isCurrent
                            ?
                            "selected "
                            :
                            ""
                    ) +

                    (
                        isLocked
                            ?
                            "locked"
                            :
                            ""
                    ) +

                '">';


            html+=
                '<div class="practical-image-wrap">';


            if(img){

                html+=

                    '<img ' +
                        'class="practical-image" ' +
                        'loading="lazy" ' +
                        'src="' +
                            escapeHtml(
                                img
                            ) +
                        '" ' +
                        'alt="Bài thực hành">';

            }else{

                html+=

                    '<div class="practical-no-image">' +

                        'Không có ảnh xem trước' +

                    '</div>';
            }


            if(isCurrent){

                html+=

                    '<div class="practical-badge">' +

                        'ĐANG CHỌN' +

                    '</div>';

            }else if(isLocked){

                html+=

                    '<div class="practical-badge">' +

                        'ĐÃ DÙNG Ở CÂU ' +
                        escapeHtml(
                            usedQuestion
                        ) +

                    '</div>';
            }


            html+=
                '</div>';


            html+=

                '<div class="practical-body">' +

                    '<div class="practical-note">' +

                        escapeHtml(
                            item.note ||
                            "Bài tập"
                        ) +

                    '</div>' +

                    '<div class="practical-meta">' +

                        'Ngày nộp: ' +
                        escapeHtml(
                            item.timestamp ||
                            "-"
                        ) +

                    '</div>';


            if(
                item.score!==null &&
                item.score!==undefined
            ){

                html+=

                    '<div class="practical-score">' +

                        'Điểm cũ: ' +
                        escapeHtml(
                            item.score
                        ) +

                    '</div>';

            }else{

                html+=

                    '<div class="practical-score">' +

                        'Chưa có điểm cũ' +

                    '</div>';
            }


            if(isCurrent){

                html+=

                    '<button ' +
                        'class="exam-btn secondary" ' +
                        'type="button" ' +
                        'onclick="return window.OCDGraduationExam.removePractical(' +
                            q.id +
                        ');">' +

                        'BỎ CHỌN - GIẢI PHÓNG BÀI' +

                    '</button>';

            }else if(isLocked){

                html+=

                    '<button ' +
                        'class="exam-btn secondary" ' +
                        'type="button" ' +
                        'disabled>' +

                        'ĐÃ DÙNG Ở CÂU ' +
                        escapeHtml(
                            usedQuestion
                        ) +

                    '</button>';

            }else{

                html+=

                    '<button ' +
                        'class="exam-btn green" ' +
                        'type="button" ' +

                        'onclick="return window.OCDGraduationExam.selectPracticalByKey(' +

                            q.id +
                            ',' +
                            renderKey +

                        ');">' +

                        'CHỌN BÀI NÀY' +

                    '</button>';
            }


            html+=

                '</div>' +

                '</article>';
        }
    );


    html+=
        '</div>';

    container.innerHTML=
        html;
}

========================================================= */

APP.selectPracticalByKey=
function(
    questionId,
    renderKey
){

    if(
        !STATE.session ||
        sessionStatus(
            STATE.session
        )===
        "submitted"
    ){

        return false;
    }

    var item=
        STATE.practicalRenderMap[
            String(
                renderKey
            )
        ];

    if(!item){

        alert(
            "Không tìm thấy dữ liệu bài được chọn. Vui lòng thử lại."
        );

        return false;
    }

    var targetQuestion=
        PRACTICAL_QUESTIONS.find(
            function(x){

                return Number(x.id)===Number(questionId);
            }
        );

    if(
        targetQuestion &&
        !practicalAllowed(
            targetQuestion,
            item
        )
    ){

        alert(
            targetQuestion.mode==="live"
                ?
                "Câu " + targetQuestion.id + " chỉ nhận bài nộp sau lúc bắt đầu thi."
                :
                "Câu " + targetQuestion.id + " chỉ nhận bài đã nộp trước lúc bắt đầu thi."
        );

        return false;
    }

    var used=
        usedSubmissionMap();

    var usedQuestion=
        used[
            item.submissionId
        ];

    if(
        usedQuestion &&
        Number(
            usedQuestion
        )!==
        Number(
            questionId
        )
    ){

        alert(
            "Bài này đã được sử dụng ở câu " +
            usedQuestion +
            "."
        );

        return false;
    }


    var question=
        PRACTICAL_QUESTIONS
        .find(
            function(q){

                return (
                    Number(
                        q.id
                    )===
                    Number(
                        questionId
                    )
                );
            }
        );


    practicalAnswers()[
        String(
            questionId
        )
    ]={

        questionId:
            Number(
                questionId
            ),

        prompt:
            question
                ?
                question.text
                :
                "",

        submissionId:
            item.submissionId,

        file:
            item.file,

        note:
            item.note,

        submittedAt:
            item.timestamp,

        originalScore:
            item.score
    };


    STATE.practicalSearch=
        "";

    saveSession();


    var currentIndex=
        PRACTICAL_QUESTIONS
        .findIndex(
            function(q){

                return (
                    Number(
                        q.id
                    )===
                    Number(
                        questionId
                    )
                );
            }
        );


    if(
        currentIndex>=0 &&
        currentIndex<
        PRACTICAL_QUESTIONS.length-1
    ){

        STATE.practicalIndex=
            currentIndex+1;

        STATE.session
        .lastPracticalIndex=
            STATE.practicalIndex;

        saveSession();

        renderPractical();

        var practicalPanel=
            el(
                "examPracticalPanel"
            );

        if(practicalPanel){

            practicalPanel.scrollIntoView({
                behavior:"smooth",
                block:"start"
            });
        }

        return false;
    }


    APP.openReview();

    var reviewPanel=
        el(
            "examReviewPanel"
        );

    if(reviewPanel){

        reviewPanel.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });
    }

    return false;
};

    .filter(
        function(q){

            return (
                answers[
                    String(
                        q.id
                    )
                ]===
                undefined
            );
        }
    )
    .map(
        function(q){

            return q.id;
        }
    );

            ];
        }
    )
    .map(
        function(q){

            return q.id;
        }
    );
}

/* =========================================================
   GRADE THEORY
========================================================= */

function gradeTheory(){

    var answers=
        theoryAnswers();

    var questions=
        theoryQuestions();

    var answered=0;
    var correct=0;

    questions.forEach(
        function(q){

            var answer=
                answers[
                    String(
                        q.id
                    )
                ];

            if(
                answer===undefined ||
                answer===null
            ){

                return;
            }

                        answered++;

            if(
                questionIsCorrect(
                    q,
                    answer
                )
            ){

                correct++;
            }
        }
    );

    var wrong=
        answered-
        correct;

    return {

        answered:
            answered,

        correct:
            correct,

        wrong:
            wrong,

        unanswered:
            CONFIG.theoryCount -
            answered,

        /*
           30 câu trắc nghiệm (20 chữ + 10 hình ảnh)
           quy về thang điểm 10.
        */
        score:
            Math.round(
                (
                    correct /
                    CONFIG.theoryCount *
                    10
                ) *
                100
            ) / 100
    };
}


/* =========================================================
   THEORY DATA
========================================================= */

function buildTheoryData(){

    var answers=
        theoryAnswers();

    return theoryQuestions()
    .map(
        function(q){

            var answer=
                answers[
                    String(
                        q.id
                    )
                ];

            return {

                q:
                    q.id,

                bankId:
                    q.bankId,

                question:
                    q.text,

                options:
                    q.options.slice(),

                                answer:
                    answer===undefined
                        ?
                        null
                        :
                        Number(answer),

                isCorrect:
                    questionIsCorrect(
                        q,
                        answer
                    )
            };
        }
    );
}


/* =========================================================
   PRACTICAL DATA
========================================================= */

function buildPracticalData(){

    var answers=
        practicalAnswers();

    return PRACTICAL_QUESTIONS
    .map(
        function(q){

            var answer=
                answers[
                    String(
                        q.id
                    )
                ];

            if(!answer){

                return {

                    q:q.id,

                    prompt:q.text,

                    submissionId:"",

                    note:"",

                    file:"",

                    submittedAt:"",

                    originalScore:null
                };
            }

            return {

                q:
                    q.id,

                prompt:
                    q.text,

                submissionId:
                    answer.submissionId ||
                    "",

                note:
                    answer.note ||
                    "",

                file:
                    answer.file ||
                    "",

                submittedAt:
                    answer.submittedAt ||
                    "",

                originalScore:
                    answer.originalScore===
                    undefined
                        ?
                        null
                        :
                        answer.originalScore
            };
        }
    );
}

        submitReason:
            autoSubmitted
                ?
                "TIMEOUT"
                :
                (
                    CONFIG.trialMode
                        ?
                        "TRIAL"
                        :
                        "MANUAL"
                ),

        theory:
            theory,

        theoryPaper:
            buildTheoryData(),

        practical:{

            answered:
                practicalCount(),

            unanswered:
                CONFIG.practicalCount -
                practicalCount(),

            selections:
                buildPracticalData()
        },

        totalAnswered:
            theory.answered +
            practicalCount(),

        missingQuestions:{

            theory:
                missingTheory(),

            practical:
                missingPractical()
        }
    };
}

APP.submitExam=
function(){

        !STATE.session ||
        sessionStatus(
            STATE.session
        )===
        "submitted"
    ){

        return false;
    }

    if(
        theoryCount()!==
        CONFIG.theoryCount ||
        practicalCount()!==

    ){

            " câu lý thuyết và " +
            CONFIG.practicalCount +
            " câu thực hành."
        );

        return false;
    }

    var confirmBox=
        el(
            "examSubmitConfirm"
        );

    if(
        !confirmBox ||
        !confirmBox.checked
    ){

        return false;
    }

    var confirmText=
        CONFIG.trialMode
            ?
            "Xác nhận nộp bài thi thử?\n\nKết quả này không được ghi vào kỳ thi chính thức."

/* =========================================================
   FINALIZE
========================================================= */

function finalizeExam(
    autoSubmitted
){

    if(
        !STATE.session ||
        sessionStatus(
            STATE.session
        )===
        "submitted"
    ){

        return;
    }

    stopTimer();

    var result=
        buildFinalResult(
            autoSubmitted
        );

    STATE.session.status=
        "submitted";

    STATE.session.submitted=
        true;

    STATE.session.submittedAt=
        result.submittedAt;

    STATE.session.submitReason=
        result.submitReason;

    STATE.session.result=
        result;

    STATE.session.remoteSave=
        STATE.session.remoteSave ||
        {};

    if(CONFIG.trialMode){

        STATE.session.remoteSave.status=
            "trial_not_sent";

    }else if(
        isAdminSession()
    ){

        /* v2.6.0: ADMIN chỉ chạy thử, không gửi vào form thật */
        STATE.session.remoteSave.status=
            "admin_local";

    }else{

        STATE.session.remoteSave.status=
            "pending";
    }

    STATE.session.remoteSave.attempts=
        Number(
            STATE.session
            .remoteSave
            .attempts ||
            0
        );

    saveSession();

    /* openResultScreen tự gửi (một lần duy nhất) khi cần */
    openResultScreen();
}

/* =========================================================
   v2.6.0: GỬI GOOGLE FORM
   - fetch no-cors: lỗi mạng -> biết là CHƯA gửi được
   - Sau khi gửi, đọc lại BaiThiTotNghiep để XÁC NHẬN
   - Mỗi lúc chỉ một lượt gửi, đã xác nhận thì không gửi lại
========================================================= */

function postForm(payload){

    if(!payload){

        return Promise.resolve(false);
    }

    var body=
        new URLSearchParams();

    Object.keys(
        payload
    )
    .forEach(
        function(name){

            body.append(
                name,
                payload[name]===undefined ||
                payload[name]===null
                    ?
                    ""
                    :
                    String(
                        payload[name]
                    )
            );
        }
    );

    var controller=
        typeof AbortController!=="undefined"
            ?
            new AbortController()
            :
            null;

    var timer=
        controller
            ?
            setTimeout(
                function(){

                    controller.abort();
                },
                20000
            )
            :
            null;

    return fetch(
        CONFIG.formAction,
        {
            method:"POST",

            mode:"no-cors",

            cache:"no-store",

            body:body,

            signal:
                controller
                    ?
                    controller.signal
                    :
                    undefined
        }
    )
    .then(
        function(){

            return true;
        },
        function(error){

            console.error(
                error
            );

            return false;
        }
    )
    .finally(
        function(){

            if(timer){

                clearTimeout(
                    timer
                );
            }
        }
    );
}


/* Bài nộp (không phải dòng START) của Exam ID đã có trong BaiThiTotNghiep chưa */
async function examRecorded(examId){

    var rows=
        parseCSV(
            await fetchTextRetry(
                examHistoryCsvUrl()
            )
        );

    if(rows.length<2){

        return false;
    }

    var idCol=
        findColumn(
            rows[0],
            [
                "Exam ID",
                "examid",
                "exam id"
            ]
        );

    var reasonCol=
        findColumn(
            rows[0],
            [
                "Hình thức nộp",
                "hinh thuc nop"
            ]
        );

    if(idCol<0){

        return false;
    }

    for(
        var i=1;
        i<rows.length;
        i++
    ){

        if(
            valueAt(
                rows[i],
                idCol
            )===examId &&
            normalizeCode(
                valueAt(
                    rows[i],
                    reasonCol
                )
            )!==
            CONFIG.startReason
        ){

            return true;
        }
    }

    return false;
}


function markRemote(status){

    var remote=
        STATE.session.remoteSave;

    remote.status=
        status;

    if(status==="sent"){

        remote.sentAt=
            Date.now();
    }

    saveSession();

    renderRemoteStatus();
}


async function sendResultToGoogleForm(){

    if(
        CONFIG.trialMode ||
        !STATE.session ||
        !STATE.session.result ||
        isAdminSession() ||
        STATE.remoteSubmitting
    ){

        return;
    }

    STATE.session.remoteSave=
        STATE.session.remoteSave ||
        {};

    var remote=
        STATE.session.remoteSave;

    if(
        remote.status==="sent"
    ){

        return;
    }

    STATE.remoteSubmitting=
        true;

    var examId=
        STATE.session.examId;

    try{

        /*
           Đã từng gửi (gửi lại / tải lại trang giữa chừng):
           kiểm tra trước, có bài rồi thì không gửi thêm.
        */
        if(
            Number(
                remote.attempts ||
                0
            )>0
        ){

            markRemote(
                "verifying"
            );

            try{

                if(
                    await examRecorded(
                        examId
                    )
                ){

                    markRemote(
                        "sent"
                    );

                    return;
                }

            }catch(error){}
        }

        if(!navigator.onLine){

            markRemote(
                "failed"
            );

            return;
        }

        remote.attempts=
            Number(
                remote.attempts ||
                0
            ) + 1;

        remote.lastAttemptAt=
            Date.now();

        markRemote(
            "sending"
        );

        var ok=
            await postForm(
                formPayload()
            );

        if(!ok){

            markRemote(
                "failed"
            );

            return;
        }

        markRemote(
            "verifying"
        );

        for(
            var i=0;
            i<CONFIG.verifyTries;
            i++
        ){

            await sleep(
                CONFIG.verifyDelayMs
            );

            try{

                if(
                    await examRecorded(
                        examId
                    )
                ){

                    markRemote(
                        "sent"
                    );

                    return;
                }

            }catch(error){}
        }

        markRemote(
            "unconfirmed"
        );

    }finally{

        STATE.remoteSubmitting=
            false;
    }
}

        !isAdminSession() &&
        status!=="sent" &&
        status!=="admin_local" &&

    );
}

/*
   v2.7.2: điểm hiện số nguyên – từ 0,5 trở lên làm tròn lên,
   dưới 0,5 làm tròn xuống – kèm ghi chú "làm tròn từ ...".
   (Điểm gửi vào BaiThiTotNghiep vẫn giữ số lẻ để tính tổng chính xác.)
*/
function roundedScoreHtml(value){

    var n=
        Number(value);

    if(!Number.isFinite(n)){

        return "-";
    }

    var exact=
        Math.round(n*1000)/1000;

    var r=
        Math.floor(
            exact +
            0.5
        );

    return (
        String(r) +
        (
            exact===r
                ?
                ''
                :
                '<span style="display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:2px;">(làm tròn từ ' +
                    String(Math.round(n*100)/100).replace(".",",") +
                ')</span>'
        )
    );
}

        "exam-hidden"
    );

    var input=
        el(
            "examStudentCode"
        );

    if(input){

        input.value=
            "";
    }

    setLookupMessage(

        CONFIG.trialMode
            ?
            "Đã xóa phiên thi thử. Hãy nhập lại mã học viên để bắt đầu một đề mới."
            :
            "Đã xoá phiên kiểm thử trên thiết bị. Nhập lại mã để thi lượt mới.",

        "success"
    );

    return false;
};


/* =========================================================
   UPDATE HERO MODE
========================================================= */

function updatePageMode(){

    if(!CONFIG.trialMode){

        return;
    }

    var badge=
        document.querySelector(
            "#ocdGraduationExamPage .exam-hero-badge"
        );

    var title=
        document.querySelector(
            "#ocdGraduationExamPage .exam-hero h1"
        );

    var description=
        document.querySelector(
            "#ocdGraduationExamPage .exam-hero p"
        );

    var test=
        document.querySelector(
            "#ocdGraduationExamPage .exam-test"
        );

    if(badge){

        badge.textContent=
            "PHÒNG THI THỬ OCD";
    }

    if(title){

        title.textContent=
            "Thi thử tốt nghiệp";
    }

    if(description){

        description.textContent=
            "Luyện tập trước kỳ thi chính thức. Kết quả thi thử không ảnh hưởng tới lượt thi tốt nghiệp.";
    }

    if(test){

        test.textContent=
            "THI THỬ BAO GỒM 20 câu lý thuyết + 10 câu hình ảnh + 2 câu thực hành";
    }
}


/* =========================================================
   INIT
========================================================= */

function init(){

    try{

        localStorage.removeItem(
            CONFIG.lastCodeKey
        );

    }catch(error){}

    var input=
        el(
            "examStudentCode"
        );

    if(input){

        input.value=
            "";
    }

    updatePageMode();

    console.log(
        CONFIG.version +
        " READY | MODE=" +
        (
            CONFIG.trialMode
                ?
                "TRIAL"
                :
                "OFFICIAL"
        ) +
        " | THEORY BANK=" +
        THEORY_BANK.length +
        " | THEORY COUNT=" +
        CONFIG.theoryCount +
        " | PRACTICAL COUNT=" +
        CONFIG.practicalCount
    );
}


if(
    document.readyState===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        init
    );

}else{

    init();
}


})(window.OCDGraduationExam);

</script>

</div>
