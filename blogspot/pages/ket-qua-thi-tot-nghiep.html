<script>
/* =========================================================

window.OCDGraduationResult =
window.OCDGraduationResult || {};


(function(APP){

"use strict";


/* =========================================================
   CONFIG
========================================================= */

var CONFIG={

    version:
        "OCD_GRADUATION_RESULT_V1.0",

    spreadsheetId:
        "1GJoTRsbq0kZfZrDdh0uCC667PwS3Bgkje2fHQnwnCKs",

    examSheet:
        "BaiThiTotNghiep",

    gradingSheet:
        "ChamThiTotNghiep",

    passScore:

    theoryWeight:
        0.5,

    practicalWeight:
        0.5,

    timeout:
        15000,

    lastLookupKey:
        "OCD_GRADUATION_RESULT_LAST_LOOKUP"

};


/* =========================================================
   STATE
========================================================= */

var STATE={

    exams:[],

    gradings:[],

    matches:[],

    attemptRenderMap:{},

    selectedExam:null,

    selectedGrading:null

};


/* =========================================================
   DOM
========================================================= */

function el(id){

    return document.getElementById(id);
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(value){

    return String(
        value===undefined ||
        value===null
            ?
            ""
            :
            value
    )
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d")
    .replace(/\s+/g," ");
}


function normalizeCode(value){

    return String(
        value===undefined ||
        value===null
            ?
            ""
            :
            value
    )
    .trim()
    .toUpperCase();
}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(
        value===undefined ||
        value===null
            ?
            ""
            :
            value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

    var rows=[];
    var row=[];
    var field="";
    var quoted=false;


    text=
        String(text || "")
        .replace(/^\uFEFF/,"");


    for(
        var i=0;
        i<text.length;
        i++
    ){

        var c=
            text[i];


        if(c==='"'){

            if(
                quoted &&
                text[i+1]==='"'
            ){

                field+='"';

                i++;

            }else{

                quoted=
                    !quoted;
            }

        }else if(
            c==="," &&
            !quoted
        ){

            row.push(field);

            field="";

        }else if(
            (
                c==="\n" ||
                c==="\r"
            ) &&
            !quoted
        ){

            if(
                c==="\r" &&
                text[i+1]==="\n"
            ){

                i++;
            }


            row.push(field);


            if(
                row.some(
                    function(v){

                        return (
                            String(v)
                            .trim()!==""
                        );
                    }
                )
            ){

                rows.push(row);
            }


            row=[];

            field="";

        }else{

            field+=c;
        }
    }


    row.push(field);


    if(
        row.some(
            function(v){

                return (
                    String(v)
                    .trim()!==""
                );
            }
        )
    ){

        rows.push(row);
    }


    return rows;
}


/* =========================================================
   FETCH
========================================================= */

function sheetUrl(sheetName){

    return (
        "https://docs.google.com/spreadsheets/d/" +
        CONFIG.spreadsheetId +
        "/gviz/tq?tqx=out:csv&sheet=" +
        encodeURIComponent(
            sheetName
        ) +
        "&_=" +
        Date.now()
    );
}


function fetchWithTimeout(url){

    var controller=
        typeof AbortController!=="undefined"
            ?
            new AbortController()
            :
            null;


    var timer=
        controller
            ?
            setTimeout(
                function(){

                    controller.abort();

                },
                CONFIG.timeout
            )
            :
            null;


    return fetch(
        url,
        {
            cache:"no-store",

            signal:
                controller
                    ?
                    controller.signal
                    :
                    undefined
        }
    )

    .then(
        function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status
                );
            }


            return response.text();
        }
    )

    .finally(
        function(){

            if(timer){

                clearTimeout(timer);
            }
        }
    );
}


function sleep(ms){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


async function fetchRetry(url){

    var lastError=null;


    for(
        var i=0;
        i<2;
        i++
    ){

        try{

            return await fetchWithTimeout(
                url
            );

        }catch(error){

            lastError=
                error;


            if(i===0){

                await sleep(
                    400
                );
            }
        }
    }


    throw lastError;
}


/* =========================================================
   COLUMN
========================================================= */

function findColumn(
    headers,
    aliases
){

    var normalized=
        headers.map(
            normalizeText
        );


    for(
        var i=0;
        i<aliases.length;
        i++
    ){

        var wanted=
            normalizeText(
                aliases[i]
            );


        var exact=
            normalized.indexOf(
                wanted
            );


        if(exact!==-1){

            return exact;
        }
    }


    for(
        var a=0;
        a<aliases.length;
        a++
    ){

        var partial=
            normalizeText(
                aliases[a]
            );


        for(
            var h=0;
            h<normalized.length;
            h++
        ){

            if(
                partial &&
                normalized[h]
                .indexOf(
                    partial
                )!==-1
            ){

                return h;
            }
        }
    }


    return -1;
}


function valueAt(
    row,
    index
){

    if(
        index<0 ||
        !row ||
        index>=row.length
    ){

        return "";
    }


    return String(
        row[index] || ""
    )
    .trim();
}


/* =========================================================
   NUMBER
========================================================= */

function parseNumber(value){

    var str=
        String(
            value===undefined ||
            value===null
                ?
                ""
                :
                value
        )
        .trim()
        .replace(
            ",",
            "."
        );


    if(str===""){

        return null;
    }


    var number=
        Number(str);


    return Number.isFinite(number)
        ?
        number
        :
        null;
}


function round2(value){

    return Math.round(
        Number(value) *
        100
    ) / 100;
}


function scoreDisplay(value){

    var n=
        parseNumber(value);


    if(n===null){

        return "-";
    }


    return n.toFixed(2)
        .replace(
            /\.00$/,
            ""
        )
        .replace(
            /(\.\d)0$/,
            "$1"
        );
}


/* =========================================================
   DRIVE IMAGE
========================================================= */

function driveIdFromUrl(value){

    var str=
        String(
            value || ""
        )
        .trim();


    if(!str){

        return "";
    }


    var patterns=[

        /\/file\/d\/([a-zA-Z0-9_-]+)/,

        /[?&]id=([a-zA-Z0-9_-]+)/,

        /\/d\/([a-zA-Z0-9_-]+)/
    ];


    for(
        var i=0;
        i<patterns.length;
        i++
    ){

        var match=
            str.match(
                patterns[i]
            );


        if(match){

            return match[1];
        }
    }


    if(
        /^[a-zA-Z0-9_-]{20,}$/
        .test(str)
    ){

        return str;
    }


    return "";
}


function imageUrl(value){

    var RS=
        window.StudentRewardSystem;


    if(
        RS &&
        typeof RS.convertDriveImageUrl===
        "function"
    ){

        try{

            return RS.convertDriveImageUrl(
                value,
                800
            );

        }catch(error){}
    }


    var id=
        driveIdFromUrl(
            value
        );


    if(id){

        return (
            "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(id) +
            "&sz=w800"
        );
    }


    return String(
        value || ""
    );
}

   Nếu một Exam ID có nhiều bản chấm,
   ưu tiên dòng MỚI NHẤT trong Sheet.
========================================================= */

function buildGradingMap(gradings){

    var map={};


    gradings.forEach(
        function(item){

            map[
                normalizeCode(
                    item.examId
                )
            ]=
                item;
        }
    );


    return map;
}


/* =========================================================
   LOOKUP
========================================================= */

APP.lookup=
async function(){

    var input=
        el(
            "grLookupInput"
        );


    var button=
        el(
            "grLookupButton"
        );


    var query=
        String(
            input.value ||
            ""
        )
        .trim();


    if(!query){

        setMessage(
            "Vui lòng nhập mã học viên hoặc Exam ID.",
            "error"
        );


        return false;
    }


    try{

        localStorage.setItem(
            CONFIG.lastLookupKey,
            query
        );

    }catch(error){}


    button.disabled=
        true;


    button.textContent=
        "ĐANG TRA CỨU...";


    setMessage(
        "Đang đọc dữ liệu bài thi và kết quả chấm...",
        "loading"
    );


    el(
        "grAttemptList"
    )
    .classList
    .add(
        "gr-hidden"
    );


    el(
        "grResultPanel"
    )
    .classList
    .add(
        "gr-hidden"
    );


    try{

        /*
         Đọc song song 2 tab để nhanh hơn.
        */

        var data=
            await Promise.all([

                loadExams(),

                loadGradings()

            ]);


        STATE.exams=
            data[0];


        STATE.gradings=
            data[1];


        var wanted=
            normalizeCode(
                query
            );


        var matches=
            STATE.exams.filter(
                function(exam){

                    return (
                        normalizeCode(
                            exam.studentCode
                        )===
                        wanted
                    ) ||
                    (
                        normalizeCode(
                            exam.examId
                        )===
                        wanted
                    );
                }
            );


        if(!matches.length){

            throw new Error(
                "Không tìm thấy bài thi của học viên."
            );
        }


        var gradingMap=
            buildGradingMap(
                STATE.gradings
            );


        STATE.matches=
            matches.map(
                function(exam){

                    return {

                        exam:
                            exam,

                        grading:
                            gradingMap[
                                normalizeCode(
                                    exam.examId
                                )
                            ] ||
                            null
                    };
                }
            );


        /*
         Một Exam ID cụ thể
         hoặc chỉ có 1 lượt thi:
         mở thẳng kết quả.
        */

        if(
            STATE.matches.length===1
        ){

            openMatch(
                STATE.matches[0]
            );


            setMessage(
                STATE.matches[0].grading
                    ?
                    "Đã tải kết quả tốt nghiệp."
                    :
                    "Đã tìm thấy bài thi. Kết quả đang chờ giáo viên chấm.",
                "success"
            );


        }else{

            renderAttemptList();


            setMessage(
                "Tìm thấy " +
                STATE.matches.length +
                " lượt thi. Hãy chọn đúng lượt cần xem.",
                "success"
            );
        }


    }catch(error){

        console.error(
            error
        );


        setMessage(
            error &&
            error.message
                ?
                error.message
                :
                "Không thể tải dữ liệu kết quả.",
            "error"
        );


    }finally{

        button.disabled=
            false;


        button.textContent=
            "TRA CỨU";
    }


    return false;
};

   ATTEMPT LIST
========================================================= */

function renderAttemptList(){

    var box=
        el(
            "grAttemptList"
        );


    STATE.attemptRenderMap={};


    var list=
        STATE.matches
        .slice()
        .reverse();


    var html="";


    list.forEach(
        function(match,index){

            STATE.attemptRenderMap[
                String(index)
            ]=
                match;


            var exam=
                match.exam;


            var grading=
                match.grading;


            var finalScore=
                grading
                    ?
                    calculateFinalScore(
                        exam,
                        grading
                    )

                    null;


            html+=

                '<div class="gr-attempt">' +

                    '<div>' +

                        '<div class="gr-attempt-name">' +

                                exam.studentName ||
                                exam.studentCode

                        '<div class="gr-attempt-meta">' +

                            escapeHtml(
                                exam.examId
                            ) +

                            'Nộp bài: ' +
                            escapeHtml(
                                exam.submittedAt ||
                                exam.timestamp ||
                                "-"
                            ) +

                        '</div>';


            if(grading){

                html+=

                    '<div class="gr-attempt-status graded">' +

                        'ĐÃ CHẤM' +

                        (
                            finalScore!==null
                                ?
                                ' - ' +
                                scoreDisplay(
                                    finalScore
                                ) +
                                ' ĐIỂM'
                                :
                                ''
                        ) +

                    '</div>';

            }else{

                html+=

                    '<div class="gr-attempt-status waiting">' +
                        'ĐANG CHỜ CHẤM' +
                    '</div>';
            }


            html+=

                    '</div>' +

                    '<button ' +
                        'class="gr-btn" ' +
                        'type="button" ' +
                        'onclick="return window.OCDGraduationResult.openAttempt(' +
                            index +
                        ');">' +

                        'XEM KẾT QUẢ' +

                    '</button>' +

                '</div>';
        }
    );


    box.innerHTML=
        html;


    box.classList
    .remove(
        "gr-hidden"
    );
}

/* =========================================================
   FINAL SCORE

   50% LT + 50% TH
========================================================= */

function calculateFinalScore(
    exam,
    grading
){

    if(
        !exam ||
        !grading
    ){

        return null;
    }


    /*
       Điểm LT chính thức lấy từ bài thi gốc.
       Điểm TH chính thức lấy từ bản GVCN chấm.
    */

    var theory=
        parseNumber(
            exam.theoryScore
        );


    var practical=
        parseNumber(
            grading.practicalScore
        );


    if(
        theory===null ||
        practical===null
    ){

        return null;
    }


    return round2(

        theory *
        CONFIG.theoryWeight +

        practical *
        CONFIG.practicalWeight

    );
}


/* =========================================================
   GRADING DATA
========================================================= */

function parseGradingData(raw){

    if(!raw){

        return [];
    }


    try{

        var data=
            JSON.parse(raw);


        if(
            !Array.isArray(
                data
            )
        ){

            return [];
        }


        return data
            .filter(
                function(item){

                    return (
                        item &&
                        typeof item===
                        "object"
                    );
                }
            )
            .sort(
                function(a,b){

                    return (
                        Number(
                            a.questionId ||
                            a.q ||
                            0
                        ) -
                        Number(
                            b.questionId ||
                            b.q ||
                            0
                        )
                    );
                }
            );


    }catch(error){

        console.error(
            "GradingData JSON lỗi:",
            error
        );


        return [];
    }
}

                '</div>' +

                '<div class="gr-score-label">' +
                    'THỰC HÀNH - 50%' +
                '</div>' +

            '</div>' +


            '<div class="gr-score-box">' +

                '<div class="gr-score-number">' +
                    escapeHtml(
                        finalScore.toFixed(2)
                    ) +
                '</div>' +

                '<div class="gr-score-label">' +
                    'ĐIỂM TỐT NGHIỆP' +
                '</div>' +

            '</div>' +

        '</div>';


    html+=

        '<div class="gr-formula">' +

            '<strong>Cách tính:</strong> ' +

            scoreDisplay(
                theory
            ) +

            ' × 50% + ' +

            scoreDisplay(
                practical
            ) +

            ' × 50% = ' +

            '<strong>' +
                finalScore.toFixed(2) +
            '</strong>' +

            '<br>' +

            'Điều kiện tốt nghiệp: điểm tổng từ ' +
            CONFIG.passScore.toFixed(2) +
            ' trở lên.' +

        '</div>';


    /* =====================================================
       EXAMINER
    ===================================================== */

    html+=

        '<div class="gr-examiner">' +

            '<div class="gr-examiner-grid">' +

                infoBox(
                    "Người chấm",
                    grading.examiner
                ) +

                infoBox(
                    "Thời gian chấm",
                    grading.gradedAt ||
                    grading.timestamp
                ) +

            '</div>' +

        '</div>';


    /* =====================================================
       PRACTICAL DETAIL
    ===================================================== */

    var details=
        parseGradingData(
            grading.gradingRaw
        );


    if(details.length){

        html+=

            '<div class="gr-section-head">' +

                '<h3 class="gr-section-title">' +
                    'Chi tiết phần thực hành' +
                '</h3>' +

                '<div style="font-size:12px;color:var(--muted);">' +
                    details.length +
                    ' bài' +
                '</div>' +

            '</div>' +


            '<div class="gr-practical-grid">';


        details.forEach(
            function(item){

                var questionId=
                    item.questionId ||
                    item.q ||
                    "-";


                var img=
                    imageUrl(
                        item.file
                    );


                var originalScore=
                    item.originalScore;


                var examScore=
                    item.examScore;


                html+=

                    '<article class="gr-practical">' +


                        '<div class="gr-practical-image-wrap">';


                if(img){

                    html+=

                        '<img ' +
                            'class="gr-practical-image" ' +
                            'loading="lazy" ' +
                            'src="' +
                                escapeHtml(
                                    img
                                ) +
                            '" ' +
                            'alt="Bài thực hành">';

                }else{

                    html+=

                        '<div class="gr-no-image">' +
                            'Không có ảnh xem trước' +
                        '</div>';
                }


                html+=

                        '</div>' +


                        '<div class="gr-practical-body">' +

                            '<div class="gr-practical-question">' +
                                'CÂU ' +
                                escapeHtml(
                                    questionId
                                ) +
                            '</div>' +

                            '<div class="gr-practical-title">' +
                                escapeHtml(
                                    item.prompt ||
                                    item.note ||
                                    "Bài thực hành"
                                ) +
                            '</div>';


                if(
                    item.note &&
                    item.note!==
                    item.prompt
                ){

                    html+=

                        '<div class="gr-practical-note">' +
                            escapeHtml(
                                item.note
                            ) +
                        '</div>';
                }


                html+=

                    '<div class="gr-practical-scores">' +

                        '<div class="gr-small-score">' +

                            '<div class="gr-small-score-label">' +
                                'Điểm cũ' +
                            '</div>' +

                            '<div class="gr-small-score-value">' +
                                escapeHtml(
                                    scoreDisplay(
                                        originalScore
                                    )
                                ) +
                            '</div>' +

                        '</div>' +


                        '<div class="gr-small-score">' +

                            '<div class="gr-small-score-label">' +
                                'Điểm thi' +
                            '</div>' +

                            '<div class="gr-small-score-value">' +
                                escapeHtml(
                                    scoreDisplay(
                                        examScore
                                    )
                                ) +
                            '</div>' +

                        '</div>' +

                    '</div>';


                if(
                    item.examinerComment
                ){

                    html+=

                        '<div class="gr-comment">' +

                            '<strong>Nhận xét:</strong><br>' +

                            escapeHtml(
                                item.examinerComment
                            ) +

                        '</div>';
                }


                if(
                    item.usedOldScore
                ){

                    html+=

                        '<div style="' +
                            'margin-top:8px;' +
                            'font-size:10px;' +
                            'font-weight:900;' +
                            'color:#7c642c;' +
                        '">' +

                            'GIÁO VIÊN GIỮ NGUYÊN ĐIỂM CŨ' +

                        '</div>';
                }


                html+=

                        '</div>' +

                    '</article>';
            }
        );


        html+=
            '</div>';
    }


    html+=

        '<div class="gr-notice">' +

            'Điểm bài luyện tập cũ chỉ có giá trị tham khảo. ' +
            'Điểm thực hành tốt nghiệp được lấy từ bản chấm của giáo viên. ' +
            'Kết quả tốt nghiệp được tính theo tỷ trọng 50% lý thuyết và 50% thực hành.' +

        '</div>';


    el(
        "grResultContent"
    )
    .innerHTML=
        html;
}


/* =========================================================
   INIT
========================================================= */

function init(){

    try{

        var last=
            localStorage.getItem(
                CONFIG.lastLookupKey
            );


        if(last){

            el(
                "grLookupInput"
            )
            .value=
                last;
        }

    }catch(error){}


    console.log(
        CONFIG.version +
        " READY"
    );
}


if(
    document.readyState===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        init
    );

}else{

    init();
}


})(window.OCDGraduationResult);

</script>

</div>
