.gr-input{

.gr-attempt-status.waiting{

/* =========================================================

========================================================= */

.gr-info-value{

/* =========================================================

.gr-waiting{

/* =========================================================

========================================================= */

.gr-result-hero{

    font-size:13px;

.gr-formula strong{

/* =========================================================
   PRACTICAL RESULTS
========================================================= */

.gr-section-head{

    justify-content:space-between;

    gap:10px;

    margin-top:23px;

}

.gr-section-title{
    margin:0;

    font-size:20px;

    color:var(--brown-dark);

.gr-practical-grid{

    grid-template-columns:

.gr-practical{

    border:1px solid var(--line);

.gr-practical-image-wrap{

.gr-no-image{

.gr-practical-body{
    padding:13px;
}

.gr-practical-question{

}

.gr-practical-title{
    margin-top:3px;

    color:var(--brown-dark);

    font-size:15px;
    font-weight:900;
}

.gr-practical-note{
    margin-top:5px;

    color:var(--muted);

    font-size:12px;
}

.gr-practical-scores{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:7px;

    margin-top:10px;
}

.gr-small-score{
    padding:8px;

    border-radius:9px;

    background:#f6f0e7;

    text-align:center;
}

.gr-small-score-label{
    color:var(--muted);

    font-size:9px;
    font-weight:900;

    text-transform:uppercase;
}

.gr-small-score-value{
    margin-top:2px;

    color:var(--brown-dark);

    font-size:18px;
    font-weight:900;
}

.gr-comment{
    margin-top:9px;

    padding:10px;

    border-radius:9px;

    background:#f8f4ee;

    color:#66594d;

    font-size:12px;
}


/* =========================================================
   EXAMINER
========================================================= */

.gr-examiner{
    margin-top:18px;

    padding:14px;

    border:1px solid var(--line);
    border-radius:12px;

    background:#fffaf2;
}

.gr-examiner-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:9px;
}


/* =========================================================
   NOTICE
========================================================= */

.gr-notice{
    margin-top:15px;

    padding:12px;

    border-radius:10px;

    background:#f5f0e8;

    color:#71665c;

    font-size:12px;
}


/* =========================================================
   UTIL
========================================================= */

.gr-hidden{
    display:none !important;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:760px){

    #ocdGraduationResultPage{
        padding-left:8px;
        padding-right:8px;
    }

    .gr-hero{
        padding:27px 15px;
    }

    .gr-hero h1{
        font-size:27px;
    }

    .gr-card{
        padding:15px;
    }

    .gr-search-row{
        display:grid;

        grid-template-columns:1fr;
    }

    .gr-profile-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .gr-score-grid{
        grid-template-columns:1fr;
    }

    .gr-practical-grid{
        grid-template-columns:1fr;
    }

    .gr-final-score{
        font-size:47px;
    }

}

@media(max-width:440px){

    .gr-profile-grid{
        grid-template-columns:1fr;
    }

    .gr-examiner-grid{
        grid-template-columns:1fr;
    }

}

   - Tải ảnh về máy / chia sẻ (iPhone: Lưu hình ảnh).
   - Tự nộp ảnh vào trang Nộp bài tập (Apps Script submitWork, bài "KHAC")
     MỘT lần cho mỗi Exam ID, khi bài đã được chấm.
   API: OCDAchievementCard.mount(container, data)
========================================================= */
(function(){
"use strict";

if(window.OCDAchievementCard){
    return;
}

var W=1080, H=1920;

var API="https://script.google.com/macros/s/AKfycbwtMkodKNVrUgVWhpvhwMndPZKBrdWD4OF0XoR4i5poQsxRkEDLIkm56-MTxuOCVW9JXA/exec";

var SUBMIT_KEY="ocd_card_submitted_v1";

/* Exam ID đang nộp thẻ trên trang này (tránh nộp 2 lần khi thẻ được vẽ lại) */
var INFLIGHT={};

function settings(){
    var s=window.OCD_GRADUATION_RESULT_SETTINGS || {};
    return {
        cardTitle: s.cardTitle || "BÀI THI GIỮA KỲ KHOÁ D3",
        roundName: s.roundName || "đợt thi giữa kỳ của toàn khoá",
        teacherTitle: s.teacherTitle || "Giáo viên chủ nhiệm",
        teacherName: s.teacherName || "Thanh Phong - Bùi Khắc Sáng",
        autoSubmit: s.autoSubmitCard !== false,
        /* Apps Script ChamThi.gs v1.1.0+: nộp thẻ không qua giới hạn 2 bài/ngày của trang Nộp bài */
        cardUploadUrl: String(s.cardUploadUrl || "").trim()
    };
}

/* Xếp loại theo tổng điểm trung bình */
function rankOf(score){
    if(score>=8){ return {key:"gioi", label:"GIỎI", text:"Giỏi", color:"#b4232a"}; }
    if(score>=5){ return {key:"kha", label:"KHÁ", text:"Khá", color:"#9a6b12"}; }
    return {key:"tb", label:"TRUNG BÌNH", text:"Trung bình", color:"#4b5563"};
}

/* Điểm thi làm tròn đến số nguyên: từ 0,5 trở lên làm tròn lên, dưới 0,5 xuống */
function roundInt(n){
    var v=Number(n);
    if(!Number.isFinite(v)){ return null; }
    return Math.floor(Math.round(v*1000)/1000+0.5);
}
function roundNoteText(n){
    var v=Number(n);
    if(!Number.isFinite(v)){ return ""; }
    var r=Math.round(v*1000)/1000;
    if(r===roundInt(v)){ return ""; }
    return "làm tròn từ "+String(Math.round(v*100)/100).replace(".",",");
}
function fmt(n){
    var v=Number(n);
    if(!Number.isFinite(v)){ return "-"; }
    return (Math.round(v*100)/100).toFixed(2).replace(/\.?0+$/,"") || "0";
}

/* ---------------- ảnh ---------------- */
function driveId(v){
    var s=String(v||"");
    var m=s.match(/\/file\/d\/([^/?&#]+)/i) || s.match(/\/d\/([^/?&#]+)/i) || s.match(/[?&]id=([^&#]+)/i);
    return m ? m[1] : "";
}
function bigImageUrl(value,size){
    if(!value){ return ""; }
    var id=driveId(value);
    if(id){ return "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w"+(size||1080); }
    var s=String(value).trim();
    return /^https:\/\//i.test(s) ? s : "";
}
/* v1.6.0: ảnh avatar / khung / nền cho canvas.
   Ảnh Drive dạng thumbnail không cho canvas đọc -> thử lh3.googleusercontent (cho đọc chéo),
   không được thì nhờ ChamThi.gs (imageProxy) gửi ảnh về dạng base64. */
function imageCandidates(value,size){
    if(!value){ return []; }
    var id=driveId(value);
    if(id){
        return [
            "https://lh3.googleusercontent.com/d/"+encodeURIComponent(id)+"=w"+(size||1080),
            "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w"+(size||1080)
        ];
    }
    var s=String(value).trim();
    return /^https:\/\//i.test(s) ? [s] : [];
}
async function loadFirstImage(urls,timeout){
    for(var i=0;i<urls.length;i++){
        var img=await loadImage(urls[i],timeout);
        if(img){ return img; }
    }
    return null;
}
async function proxyImages(ids){
    var url=settings().cardUploadUrl;
    if(!url || !ids.length){ return {}; }
    var ac=new AbortController(), timer=setTimeout(function(){ ac.abort(); },25000);
    try{
        var res=await fetch(url,{method:"POST",
            body:JSON.stringify({action:"imageProxy",ids:ids}),
            headers:{"Content-Type":"text/plain;charset=utf-8"},credentials:"omit",cache:"no-store",signal:ac.signal});
        var j=JSON.parse(await res.text());
        return (j && j.ok && j.images) ? j.images : {};
    }catch(e){
        return {};
    }finally{
        clearTimeout(timer);
    }
}
async function loadLookImages(look){
    var specs=[[look.background,1080],[look.avatar,400],[look.frame,400]];
    var imgs=await Promise.all(specs.map(function(sp){ return loadFirstImage(imageCandidates(sp[0],sp[1]),8000); }));
    var need=[];
    specs.forEach(function(sp,i){
        var id=driveId(sp[0]);
        if(!imgs[i] && id && need.indexOf(id)<0){ need.push(id); }
    });
    if(need.length){
        var got=await proxyImages(need);
        await Promise.all(specs.map(async function(sp,i){
            var id=driveId(sp[0]);
            if(!imgs[i] && id && got[id]){ imgs[i]=await loadImage(got[id],8000); }
        }));
    }
    return imgs;
}
function loadImage(url,timeout){
    return new Promise(function(resolve){
        if(!url){ resolve(null); return; }
        var img=new Image();
        var done=false;
        var timer=setTimeout(function(){ if(!done){ done=true; resolve(null); } },timeout||12000);
        if(!/^data:/i.test(url)){ img.crossOrigin="anonymous"; }
        img.onload=function(){ if(done){ return; } done=true; clearTimeout(timer); resolve(img); };
        img.onerror=function(){ if(done){ return; } done=true; clearTimeout(timer); resolve(null); };
        img.src=url;
    });
}

/* ---------------- phông chữ ---------------- */
var FONT_SERIF="'Playfair Display', Georgia, 'Times New Roman', serif";
var FONT_SANS="'Be Vietnam Pro', Arial, Helvetica, sans-serif";

function ensureFonts(){
    if(!document.getElementById("ocd-card-fonts")){
        var link=document.createElement("link");
        link.id="ocd-card-fonts";
        link.rel="stylesheet";
        link.href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Playfair+Display:wght@700;900&display=swap";
        document.head.appendChild(link);
    }
    if(!document.fonts || !document.fonts.load){ return Promise.resolve(); }
    var want=[
        "900 80px 'Playfair Display'","700 60px 'Playfair Display'",
        "800 40px 'Be Vietnam Pro'","600 30px 'Be Vietnam Pro'","400 30px 'Be Vietnam Pro'"
    ];
    var all=Promise.all(want.map(function(f){ return document.fonts.load(f,"Thư Đạo ĐỆ"); })).catch(function(){});
    return Promise.race([all,new Promise(function(r){ setTimeout(r,4000); })]);
}

/* ---------------- vẽ ---------------- */
function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
}

function wrap(ctx,text,maxWidth){
    var words=String(text||"").split(/\s+/), lines=[], line="";
    words.forEach(function(w){
        var test=line ? line+" "+w : w;
        if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=w; }
        else{ line=test; }
    });
    if(line){ lines.push(line); }
    return lines;
}

function fitFont(ctx,text,weight,family,start,min,maxWidth){
    var size=start;
    while(size>min){
        ctx.font=weight+" "+size+"px "+family;
        if(ctx.measureText(text).width<=maxWidth){ break; }
        size-=2;
    }
    return size;
}

function drawCover(ctx,img,x,y,w,h){
    var r=Math.max(w/img.width,h/img.height);
    var dw=img.width*r, dh=img.height*r;
    ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}

function star(ctx,cx,cy,r,color){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.beginPath();
    for(var i=0;i<8;i++){
        var rad=i%2===0 ? r : r*0.32;
        var a=Math.PI/4*i-Math.PI/2;
        ctx[i===0?"moveTo":"lineTo"](Math.cos(a)*rad,Math.sin(a)*rad);
    }
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.shadowColor="rgba(251,191,36,.95)";
    ctx.shadowBlur=18;
    ctx.fill();
    ctx.restore();
}

function drawBackground(ctx,bgImg){
    if(bgImg){
        drawCover(ctx,bgImg,0,0,W,H);
        var g=ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,"rgba(28,18,12,.35)");
        g.addColorStop(1,"rgba(28,18,12,.65)");
        ctx.fillStyle=g;
        ctx.fillRect(0,0,W,H);
        return;
    }
    var g2=ctx.createLinearGradient(0,0,W,H);
    g2.addColorStop(0,"#3b2416");
    g2.addColorStop(0.55,"#6b3f24");
    g2.addColorStop(1,"#2a1a10");
    ctx.fillStyle=g2;
    ctx.fillRect(0,0,W,H);
    /* hoa văn vòng tròn mờ */
    ctx.save();
    ctx.globalAlpha=0.08;
    ctx.strokeStyle="#f3d9a4";
    ctx.lineWidth=3;
    for(var i=0;i<9;i++){
        ctx.beginPath();
        ctx.arc(W*0.85,H*0.12,120+i*70,0,Math.PI*2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(W*0.1,H*0.92,90+i*65,0,Math.PI*2);
        ctx.stroke();
    }
    ctx.restore();
}

function drawAvatar(ctx,cx,cy,size,avatarImg,frameImg,name){
    var r=size*0.4;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,r+8,0,Math.PI*2);
    ctx.fillStyle="#fff";
    ctx.shadowColor="rgba(0,0,0,.25)";
    ctx.shadowBlur=24;
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.clip();
    if(avatarImg){
        drawCover(ctx,avatarImg,cx-r,cy-r,r*2,r*2);
    }else{
        ctx.fillStyle="#f3eee8";
        ctx.fillRect(cx-r,cy-r,r*2,r*2);
        var words=String(name||"").trim().split(/\s+/);
        var letter=(words[words.length-1]||"✍").charAt(0).toUpperCase();
        ctx.fillStyle="#8a6b50";
        ctx.font="900 "+Math.round(r*0.95)+"px "+FONT_SERIF;
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText(letter,cx,cy+4);
    }
    ctx.restore();

    if(frameImg){
        ctx.drawImage(frameImg,cx-size/2,cy-size/2,size,size);
    }else{
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx,cy,r+8,0,Math.PI*2);
        ctx.lineWidth=6;
        ctx.strokeStyle="#c9a45c";
        ctx.stroke();
        ctx.restore();
    }
}

function drawName(ctx,name,cx,y,maxWidth,multitask){
    var size=fitFont(ctx,name,"900",FONT_SERIF,76,44,maxWidth);
    ctx.font="900 "+size+"px "+FONT_SERIF;
    ctx.textAlign="center";
    ctx.textBaseline="alphabetic";
    var w=ctx.measureText(name).width;
    if(multitask){
        /* Hiệu ứng thuốc đa nhiệm: chữ đổi sắc cam – hồng – tím – xanh, phát sáng, có sao lấp lánh */
        var g=ctx.createLinearGradient(cx-w/2,0,cx+w/2,0);
        g.addColorStop(0,"#f59e0b");
        g.addColorStop(0.33,"#ec4899");
        g.addColorStop(0.66,"#8b5cf6");
        g.addColorStop(1,"#0ea5e9");
        ctx.save();
        ctx.shadowColor="rgba(245,158,11,.75)";
        ctx.shadowBlur=26;
        ctx.fillStyle=g;
        ctx.fillText(name,cx,y);
        ctx.shadowColor="rgba(255,255,255,.9)";
        ctx.shadowBlur=8;
        ctx.fillText(name,cx,y);
        ctx.restore();
        star(ctx,cx-w/2-30,y-size*0.78,20,"#fff");
        star(ctx,cx+w/2+32,y-size*0.7,16,"#fff7d6");
        star(ctx,cx-w/2-14,y+18,13,"#fff7d6");
        star(ctx,cx+w/2+20,y+16,15,"#fff");
    }else{
        ctx.fillStyle="#3a2418";
        ctx.fillText(name,cx,y);
    }
    return size;
}

function drawSeal(ctx,x,y,s){
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(-0.05);
    roundRect(ctx,0,0,s,s,s*0.08);
    ctx.fillStyle="#b4232a";
    ctx.globalAlpha=0.92;
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.lineWidth=5;
    ctx.strokeStyle="#fff1ec";
    roundRect(ctx,s*0.08,s*0.08,s*0.84,s*0.84,s*0.05);
    ctx.stroke();
    ctx.fillStyle="#fff1ec";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    var fs=Math.round(s*0.27);
    ctx.font="900 "+fs+"px "+FONT_SERIF;
    while(fs>10 && ctx.measureText("PHONG").width>s*0.7){ fs-=1; ctx.font="900 "+fs+"px "+FONT_SERIF; }
    ctx.fillText("THANH",s/2,s*0.37);
    ctx.fillText("PHONG",s/2,s*0.65);
    ctx.restore();
}

async function draw(data){
    var cfg=settings();
    await ensureFonts();
    var look=data.profile || {};
    var imgs=data.noImages ? [null,null,null] : await loadLookImages(look);

    var canvas=document.createElement("canvas");
    canvas.width=W;
    canvas.height=H;
    var ctx=canvas.getContext("2d");

    drawBackground(ctx,imgs[0]);

    /* Khung giấy */
    var px=64, py=96, pw=W-128, ph=H-192;
    ctx.save();
    roundRect(ctx,px,py,pw,ph,44);
    ctx.shadowColor="rgba(0,0,0,.35)";
    ctx.shadowBlur=50;
    ctx.fillStyle="rgba(255,250,240,.94)";
    ctx.fill();
    ctx.restore();
    ctx.lineWidth=4;
    ctx.strokeStyle="#c9a45c";
    roundRect(ctx,px+18,py+18,pw-36,ph-36,32);
    ctx.stroke();
    ctx.lineWidth=1.5;
    roundRect(ctx,px+30,py+30,pw-60,ph-60,26);
    ctx.stroke();

    var cx=W/2;
    ctx.textAlign="center";

    /* Đầu thẻ */
    ctx.fillStyle="#9a6b12";
    ctx.font="800 30px "+FONT_SANS;
    ctx.textBaseline="alphabetic";
    if("letterSpacing" in ctx){ ctx.letterSpacing="8px"; }
    ctx.fillText("THƯ ĐẠO · THANH PHONG THƯ MÔN",cx,py+108);
    if("letterSpacing" in ctx){ ctx.letterSpacing="0px"; }

    ctx.fillStyle="#8b1e24";
    var titleSize=fitFont(ctx,cfg.cardTitle,"900",FONT_SERIF,64,40,pw-140);
    ctx.font="900 "+titleSize+"px "+FONT_SERIF;
    ctx.fillText(cfg.cardTitle,cx,py+196);

    ctx.strokeStyle="#c9a45c";
    ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(cx-150,py+232); ctx.lineTo(cx+150,py+232); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,py+232,7,0,Math.PI*2); ctx.fillStyle="#c9a45c"; ctx.fill();

    /* Avatar + tên */
    drawAvatar(ctx,cx,py+395,260,imgs[1],imgs[2],data.name);
    var nameY=py+600;
    drawName(ctx,data.name,cx,nameY,pw-200,!!look.multitask);

    ctx.fillStyle="#6b5a48";
    ctx.font="600 34px "+FONT_SANS;
    ctx.textAlign="center";
    /* v1.6.0: không in mã học viên lên thẻ (giữ bí mật) */
    var meta=["Tổ "+(data.group||"-"),"Khoá "+(data.course||"-")].join("   ·   ");
    ctx.fillText(meta,cx,nameY+64);

    /* Điểm */
    var boxY=nameY+110, gap=30, bw=(pw-120-gap)/2, bh=170;
    [["ĐIỂM LÝ THUYẾT",data.theory],["ĐIỂM THỰC HÀNH",data.practical]].forEach(function(item,i){
        var bx=px+60+i*(bw+gap);
        ctx.save();
        roundRect(ctx,bx,boxY,bw,bh,26);
        ctx.fillStyle="#fff";
        ctx.shadowColor="rgba(120,80,40,.15)";
        ctx.shadowBlur=20;
        ctx.fill();
        ctx.restore();
        ctx.lineWidth=2;
        ctx.strokeStyle="#e6d6bb";
        roundRect(ctx,bx,boxY,bw,bh,26);
        ctx.stroke();
        ctx.fillStyle="#8a6b50";
        ctx.font="800 26px "+FONT_SANS;
        ctx.fillText(item[0],bx+bw/2,boxY+50);
        ctx.fillStyle="#3a2418";
        ctx.font="900 80px "+FONT_SERIF;
        var ri=roundInt(item[1]);
        var rn=roundNoteText(item[1]);
        ctx.fillText(ri===null?"-":String(ri),bx+bw/2,boxY+(rn?126:140));
        if(rn){
            ctx.fillStyle="#8a6b50";
            ctx.font="600 22px "+FONT_SANS;
            ctx.fillText("("+rn+")",bx+bw/2,boxY+156);
        }
    });

    var totalInt=roundInt(data.total);
    var totalNote=roundNoteText(data.total);
    var rank=rankOf(totalInt===null?0:totalInt);
    var tY=boxY+bh+30, tH=240;
    ctx.save();
    roundRect(ctx,px+60,tY,pw-120,tH,30);
    var tg=ctx.createLinearGradient(0,tY,0,tY+tH);
    tg.addColorStop(0,"#8b1e24");
    tg.addColorStop(1,"#5c1217");
    ctx.fillStyle=tg;
    ctx.shadowColor="rgba(92,18,23,.35)";
    ctx.shadowBlur=30;
    ctx.fill();
    ctx.restore();
    ctx.fillStyle="#f3d9a4";
    ctx.font="800 28px "+FONT_SANS;
    ctx.fillText("TỔNG ĐIỂM TRUNG BÌNH",cx,tY+54);
    ctx.fillStyle="#fffaf0";
    ctx.font="900 120px "+FONT_SERIF;
    ctx.fillText(totalInt===null?"-":String(totalInt),cx,tY+(totalNote?160:172));
    if(totalNote){
        ctx.fillStyle="#f3d9a4";
        ctx.font="600 24px "+FONT_SANS;
        ctx.fillText("("+totalNote+")",cx,tY+196);
    }
    /* dải xếp loại */
    ctx.font="900 34px "+FONT_SANS;
    var rbW=Math.max(360,ctx.measureText("XẾP LOẠI: "+rank.label).width+90), rbH=66, rbX=cx-rbW/2, rbY=tY+tH-rbH/2;
    ctx.save();
    roundRect(ctx,rbX,rbY,rbW,rbH,33);
    ctx.fillStyle="#f3d9a4";
    ctx.shadowColor="rgba(0,0,0,.2)";
    ctx.shadowBlur=12;
    ctx.fill();
    ctx.restore();
    ctx.fillStyle="#5c1217";
    ctx.font="900 34px "+FONT_SANS;
    ctx.fillText("XẾP LOẠI: "+rank.label,cx,rbY+46);

    /* Lời chúc */
    ctx.fillStyle="#3a2418";
    ctx.font="600 36px "+FONT_SANS;
    var msg="Chúc mừng bạn đã đạt thành tích "+rank.text+" trong "+cfg.roundName+".";
    var lines=wrap(ctx,msg,pw-170);
    var my=rbY+rbH+72;
    lines.forEach(function(l,i){ ctx.fillText(l,cx,my+i*52); });

    /* Chữ ký: luôn nằm dưới lời chúc */
    var sy=Math.max(my+(lines.length-1)*52+90,py+ph-330);
    var sx=px+pw-260;
    ctx.textAlign="center";
    ctx.fillStyle="#6b5a48";
    ctx.font="800 30px "+FONT_SANS;
    ctx.fillText(cfg.teacherTitle,sx,sy);
    ctx.font="italic 400 28px "+FONT_SANS;
    ctx.fillText("(Đã ký)",sx,sy+42);
    drawSeal(ctx,sx-66,sy+62,132);
    ctx.fillStyle="#8b1e24";
    var tnSize=fitFont(ctx,cfg.teacherName,"700",FONT_SERIF,38,24,440);
    ctx.font="700 "+tnSize+"px "+FONT_SERIF;
    ctx.fillText(cfg.teacherName,sx,sy+240);

    /* Thông tin phụ góc trái */
    ctx.textAlign="left";
    ctx.fillStyle="#8a7a68";
    ctx.font="400 24px "+FONT_SANS;
    if(data.gradedAt){ ctx.fillText("Ngày chấm: "+String(data.gradedAt).split(" ")[0],px+70,py+ph-150); }
    ctx.fillText("thudao.com",px+70,py+ph-112);
    /* v1.6.0: không in Exam ID (có chứa mã học viên); chỉ in số hiệu bài thi theo giờ bắt đầu */
    var serial=String(data.examId||"").match(/(\d{14})$/);
    if(serial){
        ctx.font="400 19px "+FONT_SANS;
        ctx.fillText("Số hiệu: "+serial[1],px+70,py+ph-78);
    }
    return canvas;
}

function toBlob(canvas,type,quality){
    return new Promise(function(resolve){
        try{ canvas.toBlob(function(b){ resolve(b); },type,quality); }
        catch(e){ resolve(null); } /* canvas bị khoá do ảnh ngoài -> null */
    });
}

/* ---------------- nộp vào Nộp bài tập ---------------- */
function submittedMap(){
    try{ return JSON.parse(localStorage.getItem(SUBMIT_KEY)||"{}")||{}; }catch(e){ return {}; }
}
function markSubmitted(examId){
    try{ var m=submittedMap(); m[examId]=Date.now(); localStorage.setItem(SUBMIT_KEY,JSON.stringify(m)); }catch(e){}
}
function cardNote(data){
    return "Thẻ thành tích "+settings().cardTitle+" – "+data.examId;
}
/* Đã có bài thẻ thành tích của Exam ID này trong lịch sử nộp bài chưa (Apps Script, lọc theo mã) */
async function alreadyInNopBai(data){
    try{
        var key="students:Form Responses 1!";
        var res=await fetch(API+"?multi="+encodeURIComponent(key)+"&code="+encodeURIComponent(data.code)+"&v=449&_="+Date.now(),{cache:"no-store",credentials:"omit"});
        var json=JSON.parse(await res.text());
        var rows=json && json.ok && json.sheets && json.sheets[key];
        if(!Array.isArray(rows)){ return null; }
        return rows.some(function(r){ return (r||[]).some(function(v){ return String(v||"").indexOf(data.examId)!==-1; }); });
    }catch(e){
        return null;
    }
}
function fileSlug(text){
    return String(text||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D")
        .replace(/[^A-Za-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40) || "hoc_vien";
}
async function submitViaChamThi(data,dataUrl,url){
    var ac=new AbortController(), timer=setTimeout(function(){ ac.abort(); },120000);
    try{
        var res=await fetch(url,{method:"POST",
            body:JSON.stringify({action:"cardUpload",examId:data.examId,code:data.code,note:cardNote(data),data:dataUrl}),
            headers:{"Content-Type":"text/plain;charset=utf-8"},credentials:"omit",cache:"no-store",signal:ac.signal});
        return JSON.parse(await res.text()) || {ok:false};
    }catch(e){
        return {ok:false,network:true,error:"Không kết nối được máy chủ."};
    }finally{
        clearTimeout(timer);
    }
}
async function submitToNopBai(data,dataUrl){
    var viaUrl=settings().cardUploadUrl;
    if(viaUrl){ return submitViaChamThi(data,dataUrl,viaUrl); }
    var A=window.OCDAuth;
    var payload={
        token: A && A.token ? (A.token()||"") : "",
        code: data.code,
        lesson: "KHAC",
        note: cardNote(data),
        data: dataUrl
    };
    var ac=new AbortController(), timer=setTimeout(function(){ ac.abort(); },120000);
    try{
        var res=await fetch(API,{method:"POST",
            body:JSON.stringify({action:"enroll",op:"submitWork",token:payload.token,code:payload.code,device:navigator.userAgent.slice(0,100),fields:Object.assign({op:"submitWork"},payload)}),
            headers:{"Content-Type":"text/plain;charset=utf-8"},credentials:"omit",cache:"no-store",signal:ac.signal});
        return JSON.parse(await res.text()) || {ok:false};
    }catch(e){
        return {ok:false,network:true,error:"Không kết nối được máy chủ."};
    }finally{
        clearTimeout(timer);
    }
}

function injectCss(){
    if(document.getElementById("ocdcard-style")){ return; }
    var st=document.createElement("style");
    st.id="ocdcard-style";
    st.textContent=CSS;
    document.head.appendChild(st);
}

function h(tag,cls,text){
    var e=document.createElement(tag);
    if(cls){ e.className=cls; }
    if(text!==undefined){ e.textContent=text; }
    return e;
}

async function mount(container,data){
    injectCss();
    var cfg=settings();
    container.innerHTML="";
    var box=h("section","ocdcard");
    box.appendChild(h("h3","ocdcard-title","🎖 Thẻ thành tích"));
    box.appendChild(h("p","ocdcard-sub","Ảnh thành tích "+cfg.cardTitle+" của "+data.name+". Tải về để lưu vào điện thoại hoặc chia sẻ."));
    var stage=h("div","ocdcard-loading","Đang vẽ thẻ thành tích…");
    box.appendChild(stage);
    var actions=h("div","ocdcard-actions");
    var status=h("div","ocdcard-status");
    status.style.display="none";
    box.appendChild(actions);
    box.appendChild(status);
    var hint=h("div","ocdcard-note","Trên iPhone: bấm TẢI ẢNH VỀ MÁY rồi chọn “Lưu hình ảnh”, hoặc nhấn giữ vào ảnh và chọn “Lưu vào Ảnh”.");
    box.appendChild(hint);
    container.appendChild(box);

    var profile=data.profile;
    if(!profile && window.OCDIdentity && typeof window.OCDIdentity.profile==="function"){
        try{
            profile=await Promise.race([
                window.OCDIdentity.profile(data.code),
                new Promise(function(r){ setTimeout(function(){ r(null); },15000); })
            ]);
        }catch(e){ profile=null; }
    }
    data=Object.assign({},data,{profile:profile||{}});

    var canvas=await draw(data);
    var blob=await toBlob(canvas,"image/png");
    if(!blob){
        /* ảnh nền/avatar không cho đọc chéo -> vẽ lại không dùng ảnh ngoài */
        data.noImages=true;
        canvas=await draw(data);
        blob=await toBlob(canvas,"image/png");
    }
    if(!blob){
        stage.textContent="Trình duyệt không tạo được ảnh. Vui lòng thử trình duyệt khác.";
        return;
    }
    var url=URL.createObjectURL(blob);
    var img=h("img","ocdcard-preview");
    img.alt="Thẻ thành tích "+data.name;
    img.src=url;
    stage.replaceWith(img);

    var fileName="ThanhTich_"+fileSlug(data.name||"hoc-vien")+".png";
    var save=h("button","ocdcard-btn gold","TẢI ẢNH VỀ MÁY");
    save.type="button";
    save.onclick=async function(){
        try{
            var file=new File([blob],fileName,{type:"image/png"});
            if(navigator.canShare && navigator.canShare({files:[file]})){
                await navigator.share({files:[file],title:"Thẻ thành tích"});
                return;
            }
        }catch(e){
            if(e && e.name==="AbortError"){ return; }
        }
        var a=document.createElement("a");
        a.href=url;
        a.download=fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
    };
    actions.appendChild(save);

    /* Tự nộp vào Nộp bài tập (một lần cho mỗi Exam ID) */
    if(!cfg.autoSubmit || !data.examId){ return; }
    var say=function(text,kind){ status.style.display="block"; status.className="ocdcard-status "+(kind||""); status.textContent=text; };
    if(submittedMap()[data.examId]){
        say("Thẻ thành tích đã được nộp vào trang Nộp bài tập.","ok");
        return;
    }
    /* qua ChamThi.gs: máy chủ tự kiểm tra trùng theo Exam ID */
    var exists=cfg.cardUploadUrl ? false : await alreadyInNopBai(data);
    if(exists===true){
        markSubmitted(data.examId);
        say("Thẻ thành tích đã có trong trang Nộp bài tập.","ok");
        return;
    }
    if(exists===null){
        say("Chưa kiểm tra được trang Nộp bài tập, thẻ sẽ được nộp vào lần mở sau.","");
        return;
    }
    say("Đang nộp thẻ thành tích vào trang Nộp bài tập…","");
    var r;
    if(INFLIGHT[data.examId]){
        /* thẻ được vẽ lại trong lúc đang nộp: chờ lượt nộp đang chạy, không nộp thêm */
        r=await INFLIGHT[data.examId];
    }else{
        var jpg=canvas.toDataURL("image/jpeg",0.9);
        INFLIGHT[data.examId]=submitToNopBai(data,jpg);
        try{ r=await INFLIGHT[data.examId]; }
        finally{ delete INFLIGHT[data.examId]; }
    }
    if(r && r.ok){
        markSubmitted(data.examId);
        say(r.dup ? "Thẻ thành tích đã có trong trang Nộp bài tập." : "✅ Đã nộp thẻ thành tích vào trang Nộp bài tập"+(r.time?" lúc "+r.time:"")+".","ok");
        return;
    }
    var err=(r && r.error) || "Chưa nộp được thẻ thành tích.";
    say(err+" Thẻ sẽ được thử nộp lại vào lần mở trang sau.","err");
    var A=window.OCDAuth;
    if(A && A.openLogin && !(A.isMe && A.isMe(data.code)) && /bảo mật|đăng nhập|token|mật khẩu/i.test(err)){
        var login=h("button","ocdcard-btn","ĐĂNG NHẬP ĐỂ NỘP THẺ");
        login.type="button";
        login.onclick=function(){ A.openLogin({code:data.code,onSuccess:function(){ mount(container,data); }}); };
        actions.appendChild(login);
    }
}

/* =========================================================

function normalizeText(value){

    return String(
        value===undefined ||
        value===null
            ?
            ""
            :
            value
    )
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/đ/g,"d")
    .replace(/\s+/g," ");
}


function normalizeCode(value){

    )

}


/* =========================================================

========================================================= */

function escapeHtml(value){

    return String(
        value===undefined ||
        value===null
            ?
            ""
            :
            value
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}


/* =========================================================
   CSV
========================================================= */

function parseCSV(text){

    var rows=[];
    var row=[];
    var field="";
    var quoted=false;


    text=
        String(text || "")
        .replace(/^\uFEFF/,"");


    for(
        var i=0;
        i<text.length;
        i++
    ){

        var c=
            text[i];


        if(c==='"'){

            if(
                quoted &&
                text[i+1]==='"'
            ){

                field+='"';

                i++;

            }else{

                quoted=
                    !quoted;
            }

        }else if(
            c==="," &&
            !quoted
        ){

            row.push(field);

            field="";

        }else if(
            (
                c==="\n" ||
                c==="\r"
            ) &&
            !quoted
        ){

            if(
                c==="\r" &&
                text[i+1]==="\n"
            ){

                i++;
            }


            row.push(field);


            if(
                row.some(
                    function(v){

                        return (
                            String(v)
                            .trim()!==""
                        );
                    }
                )
            ){

                rows.push(row);
            }


            row=[];

            field="";

        }else{

            field+=c;
        }
    }


    row.push(field);


    if(
        row.some(
            function(v){

                return (
                    String(v)
                    .trim()!==""
                );
            }
        )
    ){

        rows.push(row);
    }


    return rows;
}

function fetchWithTimeout(url){

    var controller=
        typeof AbortController!=="undefined"
            ?
            new AbortController()
            :
            null;


    var timer=
        controller
            ?
            setTimeout(
                function(){

                    controller.abort();

                },
                CONFIG.timeout
            )
            :
            null;


    return fetch(
        url,
        {
            cache:"no-store",

            signal:
                controller
                    ?
                    controller.signal
                    :
                    undefined
        }
    )

    .then(
        function(response){

            if(!response.ok){

                throw new Error(
                    "HTTP " +
                    response.status
                );
            }


            return response.text();
        }
    )

    .finally(
        function(){

            if(timer){

                clearTimeout(timer);
            }
        }
    );
}


function sleep(ms){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


async function fetchRetry(url){

    var lastError=null;


    for(
        var i=0;
        i<2;
        i++
    ){

        try{

            return await fetchWithTimeout(
                url
            );

        }catch(error){

            lastError=
                error;


            if(i===0){

                await sleep(
                    400
                );
            }
        }
    }


    throw lastError;
}


/* =========================================================
   COLUMN
========================================================= */

function findColumn(
    headers,
    aliases
){

    var normalized=
        headers.map(
            normalizeText
        );


    for(
        var i=0;
        i<aliases.length;
        i++
    ){

        var wanted=
            normalizeText(
                aliases[i]
            );


        var exact=
            normalized.indexOf(
                wanted
            );


        if(exact!==-1){

            return exact;
        }
    }


    for(
        var a=0;
        a<aliases.length;
        a++
    ){

        var partial=
            normalizeText(
                aliases[a]
            );


        for(
            var h=0;
            h<normalized.length;
            h++
        ){

            if(
                partial &&
                normalized[h]
                .indexOf(
                    partial
                )!==-1
            ){

                return h;
            }
        }
    }


    return -1;
}


function valueAt(
    row,
    index
){

    if(
        index<0 ||
        !row ||
        index>=row.length
    ){

        return "";
    }


    return String(
        row[index] || ""
    )
    .trim();
}


/* =========================================================
   NUMBER
========================================================= */

function parseNumber(value){

    var str=
        String(
            value===undefined ||
            value===null
                ?
                ""
                :
                value
        )
        .trim()
        .replace(
            ",",
            "."
        );


    if(str===""){

        return null;
    }


    var number=
        Number(str);


    return Number.isFinite(number)
        ?
        number
        :
        null;
}


function round2(value){

    return Math.round(
        Number(value) *
        100
    ) / 100;
}


/*
   v1.4.0: ĐIỂM THI LÀM TRÒN ĐẾN SỐ NGUYÊN
   phần lẻ từ 0,5 trở lên -> làm tròn lên, dưới 0,5 -> làm tròn xuống
   (8,75 -> 9 · 8,5 -> 9 · 8,25 -> 8). Bên cạnh ghi "làm tròn từ ...".
*/
function roundScore(value){

    var n=
        parseNumber(value);

    if(n===null){

        return null;
    }

    return Math.floor(
        Math.round(n*1000)/1000 +
        0.5
    );
}


function rawScoreText(value){

    var n=
        parseNumber(value);

    if(n===null){

        return "-";
    }

    return String(
        Math.round(n*100)/100
    )
    .replace(".",",");
}


function roundNote(value){

    var n=
        parseNumber(value);

    if(
        n===null ||
        Math.round(n*1000)/1000===roundScore(n)
    ){

        return "";
    }

    return "làm tròn từ " +
        rawScoreText(n);
}


/* Điểm nguyên + ghi chú làm tròn (HTML) */
function roundHtml(value){

    var r=
        roundScore(value);

    if(r===null){

        return "-";
    }

    var note=
        roundNote(value);

    return (
        String(r) +
        (
            note
                ?
                '<span class="gr-round-note">(' + escapeHtml(note) + ')</span>'
                :
                ''
        )
    );
}


function scoreDisplay(value){

    var n=
        parseNumber(value);


    if(n===null){

        return "-";
    }


    return n.toFixed(2)
        .replace(
            /\.00$/,
            ""
        )
        .replace(
            /(\.\d)0$/,
            "$1"
        );
}


/* =========================================================
   DRIVE IMAGE
========================================================= */

function driveIdFromUrl(value){

    var str=
        String(
            value || ""
        )
        .trim();


    if(!str){

        return "";
    }


    var patterns=[

        /\/file\/d\/([a-zA-Z0-9_-]+)/,

        /[?&]id=([a-zA-Z0-9_-]+)/,

        /\/d\/([a-zA-Z0-9_-]+)/
    ];


    for(
        var i=0;
        i<patterns.length;
        i++
    ){

        var match=
            str.match(
                patterns[i]
            );


        if(match){

            return match[1];
        }
    }


    if(
        /^[a-zA-Z0-9_-]{20,}$/
        .test(str)
    ){

        return str;
    }


    return "";
}


function imageUrl(value){

    var RS=
        window.StudentRewardSystem;


    if(
        RS &&
        typeof RS.convertDriveImageUrl===
        "function"
    ){

        try{

            return RS.convertDriveImageUrl(
                value,
                800
            );

        }catch(error){}
    }


    var id=
        driveIdFromUrl(
            value
        );


    if(id){

        return (
            "https://drive.google.com/thumbnail?id=" +
            encodeURIComponent(id) +
            "&sz=w800"
        );
    }


    return String(
        value || ""
    );
}


/* =========================================================
   MESSAGE

function setMessage(

    type

async function loadExams(){

    var text=

    var rows=
        parseCSV(text);


    if(
        !rows ||
        rows.length<2
    ){

        return [];
    }


    var headers=
        rows[0];


    var cols={

        timestamp:
            findColumn(
                headers,
                ["Dấu thời gian"]
            ),

        examId:
            findColumn(
                headers,
                [
                    "Exam ID",
                    "ExamID"
                ]

        code:

        name:
            findColumn(
                headers,
                ["Họ và tên"]
            ),

        group:
            findColumn(
                headers,
                ["Tổ"]
            ),

        course:
            findColumn(
                headers,
                [
                    "Khoá",
                    "Khóa"
                ]
            ),

        startedAt:
            findColumn(
                headers,
                ["Thời gian bắt đầu"]
            ),

        submittedAt:
            findColumn(
                headers,
                ["Thời gian nộp"]
            ),

        submitReason:
            findColumn(
                headers,
                ["Hình thức nộp"]
            ),

        theoryAnswered:
            findColumn(
                headers,
                ["Số câu lý thuyết đã làm"]
            ),

        theoryCorrect:
            findColumn(
                headers,
                ["Số câu lý thuyết đúng"]
            ),

        theoryWrong:
            findColumn(
                headers,
                ["Số câu lý thuyết sai"]
            ),

        theoryScore:
            findColumn(
                headers,
                ["Điểm lý thuyết"]
            ),

        practicalAnswered:
            findColumn(
                headers,
                ["Số câu thực hành đã chọn"]
            ),

        practicalData:
            findColumn(
                headers,
                ["PracticalData"]
            ),

        version:
            findColumn(
                headers,
                ["Phiên bản hệ thống"]
            )
    };


    if(
        cols.examId<0 ||
        cols.code<0
    ){

        throw new Error(
            "Không nhận diện được cấu trúc BaiThiTotNghiep."
        );
    }


    var result=[];

    /*
       v1.0.1 (29/10/2026):
       - Bỏ dòng "START" (phòng thi ghi lúc học viên bắt đầu thi)
       - Một Exam ID chỉ lấy bài nộp ĐẦU TIÊN (bỏ dòng gửi trùng)
    */
    var seenExam={};


    for(
        var i=1;
        i<rows.length;
        i++
    ){

        var row=
            rows[i];


        var examId=
            valueAt(
                row,
                cols.examId
            );


        if(!examId){

            continue;
        }

        if(
            normalizeCode(
                valueAt(
                    row,
                    cols.submitReason
                )
            )==="START"
        ){

            continue;
        }

        if(seenExam[examId]){

            continue;
        }

        seenExam[examId]=
            true;


        result.push({

            rowNumber:
                i+1,

            timestamp:
                valueAt(
                    row,
                    cols.timestamp
                ),

            examId:
                examId,

            studentCode:
                normalizeCode(
                    valueAt(
                        row,
                        cols.code
                    )
                ),

            studentName:
                valueAt(
                    row,
                    cols.name
                ),

            group:
                valueAt(
                    row,
                    cols.group
                ),

            course:
                valueAt(
                    row,
                    cols.course
                ),

            startedAt:
                valueAt(
                    row,
                    cols.startedAt
                ),

            submittedAt:
                valueAt(
                    row,
                    cols.submittedAt
                ),

            submitReason:
                valueAt(
                    row,
                    cols.submitReason
                ),

            theoryAnswered:
                parseNumber(
                    valueAt(
                        row,
                        cols.theoryAnswered
                    )
                ) || 0,

            theoryCorrect:
                parseNumber(
                    valueAt(
                        row,
                        cols.theoryCorrect
                    )
                ) || 0,

            theoryWrong:
                parseNumber(
                    valueAt(
                        row,
                        cols.theoryWrong
                    )
                ) || 0,

            theoryScore:
                parseNumber(
                    valueAt(
                        row,
                        cols.theoryScore
                    )
                ),

            practicalAnswered:
                parseNumber(
                    valueAt(
                        row,
                        cols.practicalAnswered
                    )
                ) || 0,

            practicalRaw:
                valueAt(
                    row,
                    cols.practicalData
                ),

            version:
                valueAt(
                    row,
                    cols.version
                )
        });
    }


    return result;
}

/* =========================================================
   GRADING MAP

   Nếu một Exam ID có nhiều bản chấm,
   ưu tiên dòng MỚI NHẤT trong Sheet.
========================================================= */

function buildGradingMap(gradings){

    var map={};


    gradings.forEach(
        function(item){

            map[
                normalizeCode(
                    item.examId
                )
            ]=
                item;
        }
    );


    return map;
}


/* =========================================================
   LOOKUP
========================================================= */

APP.lookup=
async function(){

    var input=
        el(
            "grLookupInput"
        );


    var button=
        el(
            "grLookupButton"
        );


    var query=
        String(
            input.value ||
            ""
        )
        .trim();


    if(!query){

        setMessage(
            "Vui lòng nhập mã học viên hoặc Exam ID.",
            "error"
        );


        return false;
    }


    try{

        localStorage.setItem(
            CONFIG.lastLookupKey,
            query
        );

    }catch(error){}


    button.disabled=
        true;


    button.textContent=
        "ĐANG TRA CỨU...";


    setMessage(
        "Đang đọc dữ liệu bài thi và kết quả chấm...",
        "loading"
    );


    el(
        "grAttemptList"
    )
    .classList
    .add(
        "gr-hidden"
    );


    el(
        "grResultPanel"
    )
    .classList
    .add(
        "gr-hidden"
    );


    try{

        /*
         Đọc song song 2 tab để nhanh hơn.
        */

        var data=
            await Promise.all([

                loadExams(),

                loadGradings()

            ]);


        STATE.exams=
            data[0];


        STATE.gradings=
            data[1];


        var wanted=
            normalizeCode(
                query
            );


        var matches=
            STATE.exams.filter(
                function(exam){

                    return (
                        normalizeCode(
                            exam.studentCode
                        )===
                        wanted
                    ) ||
                    (
                        normalizeCode(
                            exam.examId
                        )===
                        wanted
                    );
                }
            );


        if(!matches.length){

            throw new Error(
                "Không tìm thấy bài thi của học viên."
            );
        }


        var gradingMap=
            buildGradingMap(
                STATE.gradings
            );


        STATE.matches=
            matches.map(
                function(exam){

                    return {

                        exam:
                            exam,

                        grading:
                            gradingMap[
                                normalizeCode(
                                    exam.examId
                                )
                            ] ||
                            null
                    };
                }
            );


        /*
         Một Exam ID cụ thể
         hoặc chỉ có 1 lượt thi:
         mở thẳng kết quả.
        */

        if(
            STATE.matches.length===1
        ){

            openMatch(
                STATE.matches[0]
            );


            setMessage(
                STATE.matches[0].grading
                    ?
                    "Đã tải kết quả tốt nghiệp."
                    :
                    "Đã tìm thấy bài thi. Kết quả đang chờ giáo viên chấm.",
                "success"
            );


        }else{

            renderAttemptList();


            setMessage(
                "Tìm thấy " +
                STATE.matches.length +
                " lượt thi. Hãy chọn đúng lượt cần xem.",
                "success"
            );
        }


    }catch(error){

        console.error(
            error
        );


        setMessage(
            error &&
            error.message
                ?
                error.message
                :
                "Không thể tải dữ liệu kết quả.",
            "error"
        );


    }finally{

        button.disabled=
            false;


        button.textContent=
            "TRA CỨU";
    }


    return false;
};


/* =========================================================
   ATTEMPT LIST
========================================================= */

function renderAttemptList(){

    var box=
        el(
            "grAttemptList"
        );


    STATE.attemptRenderMap={};


    var list=
        STATE.matches
        .slice()
        .reverse();


    var html="";


    list.forEach(
        function(match,index){

            STATE.attemptRenderMap[
                String(index)
            ]=
                match;


            var exam=
                match.exam;


            var grading=
                match.grading;


            var finalScore=
                grading
                    ?
                    calculateFinalScore(
                        exam,
                        grading
                    )
                    :
                    null;


            html+=

                '<div class="gr-attempt">' +

                    '<div>' +

                        '<div class="gr-attempt-name">' +
                            escapeHtml(
                                exam.studentName ||
                                exam.studentCode
                            ) +
                        '</div>' +

                        '<div class="gr-attempt-meta">' +

                            'Exam ID: ' +
                            escapeHtml(
                                exam.examId
                            ) +

                            '<br>' +

                            'Nộp bài: ' +
                            escapeHtml(
                                exam.submittedAt ||
                                exam.timestamp ||
                                "-"
                            ) +

                        '</div>';


            if(grading){

                html+=

                    '<div class="gr-attempt-status graded">' +

                        'ĐÃ CHẤM' +

                        (
                            finalScore!==null
                                ?
                                ' - ' +
                                roundHtml(
                                    finalScore
                                ) +
                                ' ĐIỂM'
                                :
                                ''
                        ) +

                    '</div>';

            }else{

                html+=

                    '<div class="gr-attempt-status waiting">' +
                        'ĐANG CHỜ CHẤM' +
                    '</div>';
            }


            html+=

                    '</div>' +

                    '<button ' +
                        'class="gr-btn" ' +
                        'type="button" ' +
                        'onclick="return window.OCDGraduationResult.openAttempt(' +
                            index +
                        ');">' +

                        'XEM KẾT QUẢ' +

                    '</button>' +

                '</div>';
        }
    );


    box.innerHTML=
        html;


    box.classList
    .remove(
        "gr-hidden"
    );
}


APP.openAttempt=
function(index){

    var match=
        STATE.attemptRenderMap[
            String(index)
        ];


    if(match){

        openMatch(
            match
        );
    }


    return false;
};

/* =========================================================
   FINAL SCORE

   50% LT + 50% TH
========================================================= */

function resultMode(){

    var s=
        window.OCD_GRADUATION_RESULT_SETTINGS ||
        {};

    return s.resultMode==="pass"
        ?
        "pass"
        :
        "rank";
}


function rankOfScore(score){

    var n=
        Number(score);

    if(n>=8){

        return {
            label:"GIỎI"
        };
    }

    if(n>=5){

        return {
            label:"KHÁ"
        };
    }

    return {
        label:"TRUNG BÌNH"
    };
}


function calculateFinalScore(
    exam,
    grading
){

    if(
        !exam ||
        !grading
    ){

        return null;
    }


    /*
       Điểm LT chính thức lấy từ bài thi gốc.
       Điểm TH chính thức lấy từ bản GVCN chấm.
    */

    var theory=
        parseNumber(
            exam.theoryScore
        );


    var practical=
        parseNumber(
            grading.practicalScore
        );


    if(
        theory===null ||
        practical===null
    ){

        return null;
    }


    return round2(

        theory *
        CONFIG.theoryWeight +

        practical *
        CONFIG.practicalWeight

    );
}


/* =========================================================
   GRADING DATA
========================================================= */

function parseGradingData(raw){

    if(!raw){

        return [];
    }


    try{

        var data=
            JSON.parse(raw);


        if(
            !Array.isArray(
                data
            )
        ){

            return [];
        }


        return data
            .filter(
                function(item){

                    return (
                        item &&
                        typeof item===
                        "object"
                    );
                }
            )
            .sort(
                function(a,b){

                    return (
                        Number(
                            a.questionId ||
                            a.q ||
                            0
                        ) -
                        Number(
                            b.questionId ||
                            b.q ||
                            0
                        )
                    );
                }
            );


    }catch(error){

        console.error(
            "GradingData JSON lỗi:",
            error
        );


        return [];
    }
}

       "pass" (thi tốt nghiệp) -> ĐẠT / CHƯA ĐẠT TỐT NGHIỆP.

    var rankMode=

/* =========================================================
   v1.2.0: KHU CHẤM BÀI (GIÁO VIÊN)
   - Ghi điểm vào ChamThiTotNghiep qua Apps Script riêng ChamThi.gs
   - Thang 10: Thực hành = trung bình điểm các câu thực hành,
     Tổng = 50% lý thuyết + 50% thực hành
   - Mở: link "Khu chấm bài" cuối trang, hoặc thêm #cham vào địa chỉ trang
========================================================= */

var GRADER_KEY=
    "ocd_grader_v1";

var GRADER={

    url:"",

    password:"",

    examiner:"",

    filter:"todo",

    list:[],

    current:null,

    saving:false
};


function graderSettings(){

    var s=
        window.OCD_GRADUATION_RESULT_SETTINGS ||
        {};

    return {

        url:
            String(
                s.graderApiUrl ||
                ""
            ).trim(),

        teacherName:
            s.teacherName ||
            "Thanh Phong - Bùi Khắc Sáng"
    };
}


function graderLoad(){

    var saved={};

    try{

        saved=
            JSON.parse(
                localStorage.getItem(
                    GRADER_KEY
                ) ||
                "{}"
            ) ||
            {};

    }catch(error){}

    GRADER.url=
        graderSettings().url ||
        saved.url ||
        "";

    GRADER.password=
        saved.password ||
        "";

    GRADER.examiner=
        saved.examiner ||
        graderSettings().teacherName;
}


function graderSave(){

    try{

        localStorage.setItem(
            GRADER_KEY,
            JSON.stringify({

                url:GRADER.url,

                password:GRADER.password,

                examiner:GRADER.examiner
            })
        );

    }catch(error){}
}


async function graderPost(body){

    var controller=
        new AbortController();

    var timer=
        setTimeout(
            function(){

                controller.abort();
            },
            30000
        );

    try{

        var response=
            await fetch(
                GRADER.url,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(
                            Object.assign(
                                {
                                    password:
                                        GRADER.password
                                },
                                body
                            )
                        ),

                    credentials:"omit",

                    cache:"no-store",

                    signal:
                        controller.signal
                }
            );

        return JSON.parse(
            await response.text()
        );

    }catch(error){

        return {

            ok:false,

            network:true,

            error:
                "Không kết nối được máy chủ chấm bài. Kiểm tra mạng hoặc URL ứng dụng."
        };

    }finally{

        clearTimeout(
            timer
        );
    }
}


function graderBox(){

    return el(
        "grGraderContent"
    );
}


APP.openGrader=
function(){

    graderLoad();

    var panel=
        el(
            "grGraderPanel"
        );

    panel.classList.remove(

    if(
        GRADER.url &&
        GRADER.password
    ){

        );

    }else{

        graderLoginView("");
    }

    try{

        panel.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }catch(error){}

    return false;
};

        (

                '<input class="gr-input" id="grGraderUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="' +
                    escapeHtml(GRADER.url) +

        ) +

        '<label class="gr-grader-label">Mật khẩu chấm bài</label>' +

APP.graderEnter=
async function(silent){

    if(!silent){

        var urlInput=
            el(
                "grGraderUrl"
            );

        if(urlInput){

            GRADER.url=
                urlInput.value.trim();
        }

        GRADER.password=
            el(
                "grGraderPassword"
            ).value;

        GRADER.examiner=
            el(
                "grGraderExaminer"
            ).value.trim() ||
            graderSettings().teacherName;

        if(
            !/^https:\/\/script\.google(usercontent)?\.com\//.test(
                GRADER.url
            )
        ){

            graderLoginView(
                "URL ứng dụng chấm bài chưa đúng (dạng https://script.google.com/macros/s/.../exec)."
            );

            return false;
        }

        var button=
            el(
                "grGraderEnter"
            );

        if(button){

            button.disabled=
                true;

            button.textContent=
                "ĐANG KIỂM TRA...";
        }
    }

    var r=
        await graderPost({
            action:"ping"
        });

    if(
        !r ||
        !r.ok
    ){

        if(
            r &&
            r.auth===false
        ){

            GRADER.password=
                "";

            graderSave();
        }

        graderLoginView(
            (r && r.error) ||
            "Chưa vào được khu chấm bài."
        );

        return false;
    }

    graderSave();

    await graderRefresh();

    return false;
};


APP.graderLogout=
function(){

    GRADER.password=
        "";

    graderSave();

    graderLoginView("");

    return false;
};


async function graderRefresh(){

    graderBox().innerHTML=
        '<div class="gr-message show loading">Đang tải danh sách bài thi...</div>';

    try{

        var data=
            await Promise.all([
                loadExams(),
                loadGradings()
            ]);

        STATE.exams=
            data[0];

        STATE.gradings=
            data[1];

        var map=
            buildGradingMap(
                STATE.gradings
            );

        GRADER.list=
            STATE.exams.map(
                function(exam){

                    return {

                        exam:
                            exam,

                        grading:
                            map[
                                normalizeCode(
                                    exam.examId
                                )
                            ] ||
                            null
                    };
                }
            );

        graderListView();

    }catch(error){

        console.error(
            error
        );

        graderBox().innerHTML=
            '<div class="gr-message show error">' +
                escapeHtml(
                    error &&
                    error.message ||
                    "Không tải được danh sách bài thi."
                ) +
            '</div>' +
            '<div class="gr-grader-actions"><button class="gr-btn" type="button" onclick="return window.OCDGraduationResult.openGrader();">THỬ LẠI</button></div>';
    }
}


APP.graderFilter=
function(value){

    GRADER.filter=
        value;

    graderListView();

    return false;
};


function graderListView(){

    var todo=
        GRADER.list.filter(
            function(m){

                return !m.grading;
            }
        );

    var shown=
        GRADER.list.filter(
            function(m){

                if(GRADER.filter==="todo"){

                    return !m.grading;
                }

                if(GRADER.filter==="done"){

                    return !!m.grading;
                }

                return true;
            }
        );

    var html=

        '<h2 class="gr-card-title">Khu chấm bài (giáo viên)</h2>' +

        '<div class="gr-grader-top">' +
            '<span>Người chấm: <strong>' + escapeHtml(GRADER.examiner) + '</strong></span>' +
            '<button class="gr-link" type="button" onclick="return window.OCDGraduationResult.graderLogout();">Thoát</button>' +
        '</div>' +

        '<div class="gr-grader-tabs">' +
            [
                ["todo","Chưa chấm ("+todo.length+")"],
                ["done","Đã chấm ("+(GRADER.list.length-todo.length)+")"],
                ["all","Tất cả ("+GRADER.list.length+")"]
            ]
            .map(
                function(t){

                    return '<button type="button" class="gr-grader-tab ' +
                        (
                            GRADER.filter===t[0]
                                ?
                                'on'
                                :
                                ''
                        ) +
                        '" onclick="return window.OCDGraduationResult.graderFilter(\'' + t[0] + '\');">' +
                        t[1] +
                    '</button>';
                }
            )
            .join("") +
        '</div>';

    if(!shown.length){

        html+=
            '<div class="gr-message show success">' +
                (
                    GRADER.filter==="todo"
                        ?
                        'Không còn bài nào chờ chấm.'
                        :
                        'Chưa có bài nào.'
                ) +
            '</div>';
    }

    shown.forEach(
        function(m){

            var index=
                GRADER.list.indexOf(m);

            html+=
                '<div class="gr-grader-row">' +
                    '<div class="gr-grader-who">' +
                        '<strong>' + escapeHtml(m.exam.studentName || m.exam.studentCode) + '</strong>' +
                        '<span>' +
                            escapeHtml(m.exam.studentCode) +
                            ' · Tổ ' + escapeHtml(m.exam.group || "-") +
                            ' · Khoá ' + escapeHtml(m.exam.course || "-") +
                            ' · LT ' + roundHtml(m.exam.theoryScore) +
                            (
                                m.grading
                                    ?
                                    ' · TH ' + roundHtml(m.grading.practicalScore)
                                    :
                                    ''
                            ) +
                        '</span>' +
                    '</div>' +
                    '<button class="gr-btn ' +
                        (
                            m.grading
                                ?
                                'gr-btn-ghost'
                                :
                                ''
                        ) +
                        '" type="button" onclick="return window.OCDGraduationResult.graderOpen(' + index + ');">' +
                        (
                            m.grading
                                ?
                                'CHẤM LẠI'
                                :
                                'CHẤM'
                        ) +
                    '</button>' +
                '</div>';
        }
    );

    graderBox().innerHTML=
        html;
}


function practicalOf(exam){

    try{

        var data=
            JSON.parse(
                exam.practicalRaw ||
                "[]"
            );

        return Array.isArray(data)
            ?
            data
            :
            [];

    }catch(error){

        return [];
    }
}


APP.graderOpen=
function(index){

    var m=
        GRADER.list[
            Number(index)
        ];

    if(!m){

        return false;
    }

    GRADER.current=
        m;

    var exam=
        m.exam;

    var items=
        practicalOf(
            exam
        );

    var old={};

    if(m.grading){

        parseGradingData(
            m.grading.gradingRaw
        )
        .forEach(
            function(it){

                old[
                    String(
                        it.questionId ||
                        it.q
                    )
                ]=
                    it;
            }
        );

    var html=

        '<div class="gr-grader-top">' +

            '>LƯU ĐIỂM</button>' +
        '</div>' +
        '<div class="gr-message" id="grGraderMessage"></div>';

    graderBox().innerHTML=
        html;

    APP.graderCalc();

    try{

        el(
            "grGraderPanel"
        ).scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }catch(error){}

    return false;
};


APP.graderBack=
function(){

    GRADER.current=
        null;

    graderListView();

    return false;
};


function graderScores(){

    var out=[];

    var ok=true;

    Array.prototype.forEach.call(
        document.querySelectorAll(
            "#grGraderContent .gr-grader-score"
        ),
        function(input){

            var raw=
                String(
                    input.value
                )
                .replace(",",".")
                .trim();

            var n=
                raw===""
                    ?
                    NaN
                    :
                    Number(raw);

            var valid=
                Number.isFinite(n) &&
                n>=0 &&
                n<=10;

            input.classList.toggle(
                "bad",
                raw!=="" &&
                !valid
            );

            if(!valid){

                ok=false;
            }

            var comment=
                document.querySelector(
                    '#grGraderContent .gr-grader-comment[data-q="' + input.getAttribute("data-q") + '"]'
                );

            out.push({

                q:
                    Number(
                        input.getAttribute("data-q")
                    ),

                examScore:
                    valid
                        ?
                        Math.round(n*4)/4
                        :
                        null,

                examinerComment:
                    comment
                        ?
                        comment.value.trim()
                        :
                        ""
            });
        }
    );

    return {
        ok:ok && out.length>0,
        items:out
    };
}


APP.graderCalc=
function(){

    var s=
        graderScores();

    var theory=
        GRADER.current
            ?
            parseNumber(
                GRADER.current.exam.theoryScore
            )
            :
            null;

    var p=
        el(
            "grGraderPractical"
        );

    var t=
        el(
            "grGraderTotal"
        );

    var rank=
        el(
            "grGraderRank"
        );

    if(!p){

        return;
    }

    if(!s.ok){

        p.textContent="-";

        t.textContent="-";

        rank.textContent="Nhập đủ điểm các câu";

        return;
    }

    var practical=
        round2(
            s.items.reduce(
                function(sum,it){

                    return sum+it.examScore;
                },
                0
            ) /
            s.items.length
        );

    p.innerHTML=
        roundHtml(
            practical
        );

    if(theory===null){

        t.textContent="-";

        return;
    }

    var total=
        round2(
            theory*CONFIG.theoryWeight +
            practical*CONFIG.practicalWeight
        );

    t.innerHTML=
        roundHtml(
            total
        );

    total=
        roundScore(
            total
        );

    rank.textContent=
        total>=8
            ?
            "Giỏi"
            :
            (
                total>=5
                    ?
                    "Khá"
                    :
                    "Trung bình"
            );
};


APP.graderSubmit=
async function(){

    if(
        GRADER.saving ||
        !GRADER.current
    ){

        return false;
    }

    var s=
        graderScores();

    var msg=
        el(
            "grGraderMessage"
        );

    if(!s.ok){

        msg.className="gr-message show error";

        msg.textContent=
            "Vui lòng nhập điểm từ 0 đến 10 cho tất cả các câu thực hành.";

        return false;
    }

    var button=
        el(
            "grGraderSave"
        );

    GRADER.saving=
        true;

    button.disabled=
        true;

    button.textContent=
        "ĐANG LƯU...";

    msg.className="gr-message show loading";

    msg.textContent=
        "Đang ghi điểm vào ChamThiTotNghiep...";

    var exam=
        GRADER.current.exam;

    var r=
        await graderPost({

            action:"grade",

            examId:
                exam.examId,

            examiner:
                GRADER.examiner,

            items:
                s.items
        });

    GRADER.saving=
        false;

    if(
        !r ||
        !r.ok
    ){

        button.disabled=
            false;

        button.textContent=
            "LƯU ĐIỂM";

        msg.className="gr-message show error";

        msg.textContent=
            (r && r.error) ||
            "Chưa lưu được điểm.";

        if(
            r &&
            r.auth===false
        ){

            GRADER.password=
                "";

            graderSave();
        }

        return false;
    }

    msg.className="gr-message show success";

    msg.textContent=
        "Đã lưu: thực hành " +
        roundScore(r.practicalScore) +
        ", tổng " +
        roundScore(r.finalScore) +
        (
            r.regraded
                ?
                " (chấm lại)."
                :
                "."
        ) +
        " Đang mở kết quả và thẻ thành tích...";

    /* Mở kết quả của học viên: thẻ thành tích tự nộp vào Nộp bài tập */
    await sleep(1500);

    try{

        var gradings=
            await loadGradings();

        STATE.gradings=
            gradings;

        var map=
            buildGradingMap(
                gradings
            );

        /* v1.6.2: Google có thể trả dữ liệu Sheet cũ vài phút sau khi ghi.
           Bản chấm vừa lưu lấy thẳng từ phản hồi máy chủ, để thẻ thành tích
           luôn được vẽ và tự nộp ngay (không phụ thuộc Sheet đã cập nhật chưa). */
        var key=normalizeCode(exam.examId);
        var fromSheet=map[key] || null;
        var grading=
            fromSheet && String(fromSheet.gradedAt||"")===String(r.gradedAt||"")
                ? fromSheet
                : freshGrading(exam, r, s.items, fromSheet);
        map[key]=grading;

        GRADER.list.forEach(
            function(m){

                m.grading=
                    map[
                        normalizeCode(
                            m.exam.examId
                        )
                    ] ||
                    null;
            }
        );

        graderListView();

        openMatch({

            exam:
                exam,

            grading:
                grading
        });

        if(!grading){

            setMessage(
                "Đã lưu điểm. Google cần thêm ít phút để hiện kết quả – hãy tra cứu lại sau.",
                "success"
            );
        }

    }catch(error){

        console.error(
            error
        );
    }

    return false;
};



/* v1.6.2: dựng bản chấm từ phản hồi ChamThi.gs (khi Sheet chưa kịp cập nhật) */
function freshGrading(exam, r, items, old){
    var details=(Array.isArray(r.gradingData) ? r.gradingData : (items||[]).map(function(it){
        return {questionId:it.q, examScore:it.examScore, examinerComment:it.examinerComment||""};
    }));
    return {
        rowNumber: old ? old.rowNumber : 0,
        timestamp: old ? old.timestamp : (r.gradedAt || ""),
        examId: exam.examId,
        studentCode: normalizeCode(r.code || exam.studentCode),
        studentName: exam.studentName,
        group: exam.group,
        course: exam.course,
        theoryScore: parseNumber(r.theoryScore),
        practicalScore: parseNumber(r.practicalScore),
        practicalGraded: details.length,
        gradingRaw: JSON.stringify(details),
        examiner: GRADER.examiner || "GVCN",
        gradedAt: r.gradedAt || "",
        version: "server"
    };
}

function init(){

    try{

        var last=
            localStorage.getItem(
                CONFIG.lastLookupKey
            );


        if(last){

            el(
                "grLookupInput"
            )
            .value=
                last;
        }

    }catch(error){}


    /* v1.5.1: mở từ phòng thi (…?ma=MÃ) -> điền mã và tra cứu luôn */
    try{

        var fromExam=
            String(
                new URLSearchParams(
                    location.search
                )
                .get("ma") ||
                ""
            )
            .trim();

        if(
            fromExam &&
            /^[A-Za-z0-9-]{2,60}$/.test(
                fromExam
            )
        ){

            el(
                "grLookupInput"
            )
            .value=
                fromExam;

            setTimeout(
                APP.lookup,
                0
            );
        }

    }catch(error){}


    if(
        /(^|[#&?])cham(=1)?\b/i.test(
            location.hash +
            location.search
        )
    ){

        setTimeout(
            APP.openGrader,
            0
        );
    }

    console.log(
        CONFIG.version +
        " READY"
    );
}


if(
    document.readyState===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        init
    );

}else{

    init();
}


})(window.OCDGraduationResult);
